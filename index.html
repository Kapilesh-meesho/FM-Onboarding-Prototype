<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valmo · Captain Self-Serve Onboarding</title>
<style>
/* ============================================================================
   Design tokens — extracted from Figma file T6DMr5qro6WZS908w41Qc9
   ("Self-serve captain onboarding", page "First time user flows" 0:1)
   ========================================================================= */
:root{
  --navy:#092d5e;
  --navy-deep:#0f2e5e;
  --rail-top:#0f2444;
  --rail-bot:#071d3b;
  --rail-chip:#0d2a52;
  --cyan:#20c7f3;
  --cyan-bar:#15b6e8;
  --cyan-ink:#087c9d;
  --cyan-label:#078eb9;
  --cyan-bg:#f0fbff;
  --cyan-br:#cbeff9;

  --page:#f4f7fb;
  --page-alt:#f4f6f9;
  --ink:#17213b;
  --ink-alt:#272829;
  --muted:#667085;
  --muted-alt:#5a5e66;
  --placeholder:#8e96a3;
  --placeholder-alt:#6b7380;

  --line:#e5eaf2;
  --line-soft:#eef1f6;
  --line-top:#e4eaf2;
  --line-field:#c6ccd6;
  --line-field-lg:#c3c9d4;
  --line-ghost:#dee6f1;
  --line-chip:#e1e7f0;
  --line-sum:#e3e8f1;

  --ok:#12b76a;
  --ok-ink:#13a565;
  --ok-bg:#eaf8f1;
  --ok-br:#bfe9d3;

  --warn-bg:#fff3e1;
  --warn-ink:#b88000;
  --warn-br:#f5e0b8;

  --err:#d92d20;
  --err-bg:#fef3f2;
  --err-br:#fda29b;

  --rail-mute:#8ea0bd;
  --rail-mute2:#95a8c4;
  --rail-mute3:#9fb2cd;
  --rail-mute4:#b8c4d8;
  --logout:#ffb4a9;

  --sum-bg:#fbfcfe;
  --chip-bg:#f5f8fc;
  --chip-ink:#48627d;
  --track:#ebf0f6;

  --role-icon:#e6f2fc;
  --role-icon-mute:#eef2f7;
  --role-icon-ink:#98a2b2;
  --avatar:#dde7f7;

  --font:'Inter','Inter var',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--page);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
img{max-width:100%}
[hidden]{display:none !important}

/* ---------------------------------------------------------------- shells -- */
/* Full-bleed navy shell used by LG-01..LG-06. Fills the viewport and centres
   the card both axes — the Figma frames are fixed 1440x900 with the card at
   x=510/y=306, which is dead-centre horizontally. */
.shell-navy{
  position:fixed; inset:0;
  background:var(--navy);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:28px; padding:24px;
  overflow:auto;
}
.shell-navy .brand{width:150px;height:40px;flex:none}
.shell-navy .brand img{width:100%;height:100%;object-fit:contain}

.auth-card{
  background:#fff; border-radius:8px; width:100%;
  padding:32px; position:relative;
  box-shadow:0 18px 48px rgba(3,14,32,.28);
}
.auth-card.login{max-width:420px}
.auth-card.otp{max-width:440px}
.auth-card h1{
  margin:0 0 10px; font-size:22px; font-weight:700;
  color:var(--ink-alt); line-height:1.25;
}
.auth-card.otp h1{font-size:20px;margin-top:4px}
.auth-card p.sub{margin:0 0 22px;font-size:15px;color:var(--muted-alt)}

.backlink{
  position:absolute;left:20px;top:14px;font-size:26px;line-height:1;
  color:var(--ink-alt);background:none;padding:0;
}

/* floating-label field (login + inner forms share the pattern) */
.fl{position:relative;margin-bottom:18px}
.fl > label{
  position:absolute;left:10px;top:-7px;z-index:2;
  background:#fff;padding:0 5px;
  font-size:11px;font-weight:700;color:var(--cyan-label);
  line-height:14px;white-space:nowrap;
}
.fl.lg > label{font-size:12px;font-weight:500}
.fl .box{
  display:flex;align-items:center;gap:8px;
  height:48px;padding:0 14px;
  background:#fff;border:1px solid var(--line-field);border-radius:8px;
}
.fl.lg .box{height:52px;border:1.5px solid var(--line-field-lg);border-radius:10px}
.fl .box:focus-within{border-color:var(--cyan-label);box-shadow:0 0 0 3px rgba(7,142,185,.12)}
.fl .box.bad{border-color:var(--err)}
.fl .box input{
  flex:1;min-width:0;border:none;outline:none;background:none;
  font-size:14px;font-weight:500;color:var(--ink);
}
.fl.lg .box input{font-size:15px;font-weight:400}
.fl .box input::placeholder{color:var(--placeholder);font-weight:400}
.fl .box select{
  flex:1;min-width:0;border:none;outline:none;background:none;
  font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;
  appearance:none;-webkit-appearance:none;padding-right:18px;
}
.fl .box.sel{position:relative}
.fl .box.sel::after{
  content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:var(--muted);font-size:12px;
}
/* multi-select dropdown (vehicle types) */
.ms{position:relative}
.ms-control{
  width:100%;display:flex;align-items:center;gap:6px;text-align:left;position:relative;
  min-height:48px;padding:6px 34px 6px 14px;background:#fff;cursor:pointer;
  border:1px solid var(--line-field);border-radius:8px;
  font-size:14px;font-weight:500;color:var(--ink);
}
.ms-control:hover{border-color:var(--cyan-label)}
.ms-control.bad{border-color:var(--err)}
.ms-control::after{
  content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:12px;
}
.ms-control.open{border-color:var(--cyan-label);box-shadow:0 0 0 3px rgba(7,142,185,.12)}
.ms-control.open::after{content:"▴"}
.ms-val{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ms-val .ph{color:var(--placeholder);font-weight:400}
.ms-tok{
  background:var(--cyan-bg);border:1px solid var(--cyan-br);color:var(--cyan-ink);
  border-radius:6px;padding:3px 7px;font-size:11px;font-weight:700;white-space:nowrap;
}
.ms-more{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}

.ms-panel{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;
  box-shadow:0 14px 34px rgba(15,23,41,.16);
}
.ms-search{
  width:100%;height:38px;padding:0 12px;margin-bottom:8px;
  border:1px solid var(--line-field);border-radius:8px;outline:none;
  font-size:13px;color:var(--ink);background:#fff;
}
.ms-search:focus{border-color:var(--cyan-label);box-shadow:0 0 0 3px rgba(7,142,185,.12)}
.ms-list{max-height:236px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ms-row{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);
}
.ms-row:hover{background:var(--chip-bg)}
.ms-row.on{background:var(--cyan-bg)}
.ms-row input{width:16px;height:16px;flex:none;accent-color:var(--navy);cursor:pointer}
.ms-row span{flex:1;min-width:0}
.ms-row i{font-style:normal;font-size:11px;font-weight:600;color:var(--muted)}
/* single-pick option rows, smallest capacity first */
.ms-row.pick{width:100%;text-align:left;background:none;border:none;font-family:inherit}
.ms-row.pick:hover{background:var(--chip-bg)}
.ms-row.pick span.mark{
  flex:none;width:16px;text-align:center;font-size:11px;color:transparent;font-weight:700;
}
/* everything below the chosen row is implied to fit */
.ms-row.pick.inc{background:var(--cyan-bg)}
.ms-row.pick.inc span.mark{color:var(--cyan-ink)}
.ms-row.pick.inc i{color:var(--cyan-ink)}
/* the chosen row is the hub's max */
.ms-row.pick.on{background:var(--navy);color:#fff}
.ms-row.pick.on span.mark{color:var(--cyan)}
.ms-row.pick.on i{color:#b6c9e4;font-weight:700}
.ms-row.pick.on:hover{background:var(--navy)}
.ms-empty{padding:14px 10px;font-size:12px;color:var(--muted);text-align:center}
.ms-foot{
  display:flex;align-items:center;gap:14px;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--line-soft);
}
.ms-foot button{font-size:11px;font-weight:700;color:var(--cyan-ink);padding:0}
.ms-foot button:disabled{color:var(--muted);cursor:not-allowed}
.ms-foot .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.fl .box .prefix{font-size:15px;font-weight:500;color:var(--ink-alt);flex:none}
.fl .hint{padding:6px 0 0 2px;font-size:11px;font-weight:500;color:var(--muted);line-height:16px}
.fl .hint.err{color:var(--err)}
.fl .hint.warn{color:var(--warn-ink)}
.fl .box.warn{border-color:var(--warn-ink)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;font-weight:700;transition:filter .12s,opacity .12s;
}
.btn:disabled{cursor:not-allowed}
.btn-primary{
  background:var(--navy);color:#fff;padding:12px 20px;font-size:15px;
  box-shadow:0 4px 10px rgba(33,41,79,.18);
}
.btn-primary:hover:not(:disabled){filter:brightness(1.14)}
.btn-primary:disabled{background:var(--line-field-lg);box-shadow:none;color:#fff}
.btn-block{
  display:flex;width:100%;height:48px;border-radius:10px;
  font-size:16px;font-weight:600;
}
.btn-ghost{
  background:#fff;border:1px solid var(--line-ghost);color:var(--navy);
  padding:8px 14px;font-size:13px;border-radius:8px;line-height:20px;
}
.btn-ghost:hover{background:var(--chip-bg)}
.btn-sm{padding:8px 12px;font-size:12px;border-radius:7px;background:var(--navy);color:#fff;font-weight:700}
.btn-sm:disabled{background:var(--line-field-lg)}
.btn-link{color:var(--cyan-ink);font-weight:700;font-size:13px;padding:0}

/* OTP cells */
.otp-row{display:flex;gap:12px;justify-content:center;margin:4px 0 18px}
.otp-cell{
  width:52px;height:56px;border:1.5px solid var(--line-field-lg);border-radius:10px;
  text-align:center;font-size:20px;font-weight:700;color:var(--ink);
  outline:none;background:#fff;
}
.otp-cell:focus{border-color:var(--cyan-label);box-shadow:0 0 0 3px rgba(7,142,185,.12)}
.otp-cell.bad{border-color:var(--err);background:var(--err-bg)}
.otp-meta{font-size:14px;color:var(--muted-alt);margin:0 0 16px}
.otp-meta .err{color:var(--err);font-weight:600}

/* ------------------------------------------------------------ role select -- */
.rs-page{min-height:100vh;background:var(--page-alt)}
.phead{
  height:64px;background:var(--navy);display:flex;align-items:center;
  padding:0 40px;justify-content:space-between;
}
.phead .logo{width:120px;height:32px}
.phead .logo img{width:100%;height:100%;object-fit:contain}
.phead button{color:var(--rail-mute4);font-size:14px;font-weight:500}
.rs-body{max-width:1200px;margin:0 auto;padding:44px 24px 60px}
.rs-body h1{margin:0 0 6px;font-size:28px;font-weight:700;color:var(--ink-alt)}
.rs-body .lede{margin:0 0 40px;font-size:15px;color:var(--muted-alt)}
.rs-sec{margin:0 0 14px;font-size:18px;font-weight:600;color:var(--ink-alt)}
.rs-empty{
  background:#fff;border:1px dashed var(--line);border-radius:12px;
  min-height:96px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;margin-bottom:36px;
}
.rs-empty b{font-size:15px;font-weight:600;color:var(--ink-alt)}
.rs-empty span{font-size:14px;color:var(--muted-alt)}
.rs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;margin-bottom:36px}
.role-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:19px;display:flex;gap:16px;align-items:flex-start;
}
.role-card .ricon{
  width:48px;height:48px;border-radius:10px;flex:none;
  background:var(--role-icon);color:var(--navy);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;
}
.role-card.dim .ricon{background:var(--role-icon-mute);color:var(--role-icon-ink)}
.role-card .rbody{flex:1;min-width:0}
.role-card h3{margin:0 0 4px;font-size:17px;font-weight:600;color:var(--ink-alt)}
.role-card p{margin:0 0 10px;font-size:14px;color:var(--muted-alt)}
.role-card .ract{flex:none;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tag{
  display:inline-block;padding:4px 10px;border-radius:6px;
  font-size:12px;font-weight:500;
}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink)}
.tag.info{background:var(--cyan-bg);color:var(--cyan-ink)}
.role-card .btn-primary{padding:11px 16px;font-size:14px;border-radius:10px;white-space:nowrap}

/* ------------------------------------------------------------------ flow -- */
.flow{display:flex;align-items:stretch;min-height:100vh}
.rail{
  width:280px;flex:none;padding:22px 20px;
  background:linear-gradient(180deg,var(--rail-top),var(--rail-bot));
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.rail .rlogo{display:flex;gap:12px;align-items:center;padding-bottom:24px}
.rail .rlogo .mark{width:132px;height:36px;flex:none}
.rail .rlogo .mark img{width:100%;height:100%;object-fit:contain}
.rail .rlogo span{font-size:11px;font-weight:500;color:var(--rail-mute4);line-height:14px}
.rprogress{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;
}
.rprogress .top{display:flex;justify-content:space-between;align-items:center}
.rprogress b{font-size:13px;font-weight:700;color:#fff;line-height:16px}
.rprogress i{font-size:12px;font-weight:500;color:var(--rail-mute3);font-style:normal}
.bar{background:rgba(255,255,255,.12);height:8px;border-radius:999px;overflow:hidden}
.bar > div{background:var(--cyan-bar);height:8px;border-radius:999px;transition:width .3s}
.rsteps{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-top:14px}
.rstep{
  display:flex;gap:10px;align-items:center;padding:9px 6px;
  border-radius:11px;text-align:left;width:100%;
}
.rstep .dot{
  width:24px;height:24px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;line-height:11px;
  background:var(--rail-chip);border:1px solid rgba(255,255,255,.22);color:var(--rail-mute);
}
.rstep .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rstep .txt b{font-size:13px;font-weight:700;line-height:16px;color:var(--rail-mute)}
.rstep .txt span{font-size:11px;font-weight:500;line-height:14px;color:var(--rail-mute)}
.rstep.done .dot{background:var(--cyan);border-color:var(--cyan);color:#062038}
.rstep.done .txt b{color:#fff}
.rstep.done .txt span{color:var(--rail-mute2)}
.rstep.here{background:rgba(21,182,232,.13)}
.rstep.here .dot{background:#fff;border:3px solid var(--cyan);color:#082347}
.rstep.here .txt b{color:#fff}
.rstep.here .txt span{color:var(--rail-mute2)}
.ruser{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);
  border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;margin-top:10px;
}
.ruser .av{
  width:36px;height:36px;border-radius:18px;flex:none;background:var(--avatar);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--navy-deep);
}
.ruser .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ruser .who span{font-size:11px;font-weight:500;color:var(--rail-mute3);line-height:14px}
.ruser .who b{font-size:13px;font-weight:700;color:#fff;line-height:16px}
.rfoot{display:flex;gap:16px;padding-top:14px}
.rfoot button{font-size:13px;font-weight:700;line-height:16px;padding:0}
.rfoot .out{color:var(--logout)}
.rfoot .swap{color:var(--rail-mute4)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:#fff;border-bottom:1px solid var(--line-top);
  height:70px;display:flex;align-items:center;gap:24px;padding:0 34px;flex:none;
}
.topbar .tt{width:300px;flex:none;display:flex;flex-direction:column;gap:2px}
.topbar .tt span{font-size:12px;font-weight:500;color:var(--muted);line-height:16px}
.topbar .tt b{font-size:17px;font-weight:700;color:var(--ink);line-height:24px}
.topbar .track{flex:1;min-width:0;height:8px;background:var(--track);border-radius:999px;overflow:hidden}
.topbar .track > div{height:8px;background:var(--cyan);border-radius:999px;transition:width .3s}
.topbar .tr{display:flex;gap:10px;align-items:center;flex:none}
.pill{
  display:inline-flex;align-items:center;gap:9px;
  background:#fff;border:1px solid var(--line-ghost);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:700;color:#344054;line-height:20px;
}
.pill .led{width:8px;height:8px;border-radius:4px;background:var(--ok);flex:none}

.content{flex:1;display:flex;gap:24px;align-items:flex-start;padding:30px 34px}
.col-left{flex:1;min-width:0;max-width:760px;display:flex;flex-direction:column;gap:16px}
.col-side{width:340px;flex:none;display:flex;flex-direction:column;gap:16px}

.phead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.phead-row .pl{display:flex;flex-direction:column;gap:9px;min-width:0}
.crumb{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
  background:var(--cyan-bg);border:1px solid var(--cyan-br);border-radius:999px;
  padding:5px 10px;font-size:12px;font-weight:700;color:var(--cyan-ink);line-height:16px;
}
.phead-row h2{margin:0;font-size:26px;font-weight:700;color:var(--ink);line-height:31px}
.phead-row .lede{margin:0;font-size:15px;font-weight:500;color:var(--muted);line-height:20px}
.saved{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  background:var(--ok-bg);border:1px solid var(--ok-br);border-radius:999px;
  padding:7px 10px;font-size:12px;font-weight:700;color:var(--ok-ink);line-height:16px;
}
.saved .led{width:8px;height:8px;border-radius:4px;background:var(--ok-ink)}

.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  filter:drop-shadow(0 1px 1px rgba(15,23,41,.04));
}
.card > .chead{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:22px 24px 16px;border-bottom:1px solid var(--line-soft);
}
.card > .chead .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card > .chead b{font-size:17px;font-weight:700;color:var(--ink);line-height:24px}
.card > .chead span{font-size:13px;font-weight:500;color:var(--muted);line-height:20px}
.chip{
  background:var(--chip-bg);border:1px solid var(--line-chip);border-radius:999px;
  padding:4px 10px;font-size:11px;font-weight:700;color:var(--chip-ink);
  line-height:20px;white-space:nowrap;flex:none;
}
.card > .cbody{padding:24px}
.cfoot{
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  border-top:1px solid var(--line-soft);padding-top:18px;margin-top:22px;
}
.cfoot .note{font-size:12px;font-weight:500;color:var(--muted);line-height:16px;max-width:430px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}}

/* status / timeline rows */
.status-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.status-head .ico{
  width:34px;height:34px;border-radius:17px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.status-head .ico.ok{background:var(--ok-bg);color:var(--ok-ink)}
.status-head .ico.run{background:#eef3fa;color:var(--navy)}
.status-head .ico.bad{background:var(--err-bg);color:var(--err)}
.status-head .ico.wait{background:var(--warn-bg);color:var(--warn-ink)}
.status-head .st{flex:1;min-width:0}
.status-head h3{margin:0 0 5px;font-size:17px;font-weight:700;color:var(--ink);line-height:22px}
.status-head p{margin:0;font-size:13px;font-weight:500;color:var(--muted);line-height:20px}

.tl{display:flex;flex-direction:column;gap:10px}
.tl-row{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;
}
.tl-row .m{
  width:18px;height:18px;border-radius:9px;flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;
  background:#dfe5ee;
}
.tl-row.ok .m{background:var(--ok)}
.tl-row.now{background:var(--cyan-bg);border-color:var(--cyan-br)}
.tl-row.now .m{background:var(--cyan-ink)}
.tl-row.bad{background:var(--err-bg);border-color:var(--err-br)}
.tl-row.bad .m{background:var(--err)}
.tl-row .tx{flex:1;min-width:0}
.tl-row b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:18px}
.tl-row span{display:block;font-size:12px;font-weight:500;color:var(--muted);line-height:17px;margin-top:2px}

/* key/value tables */
.kv{border:1px solid var(--line-sum);border-radius:12px;background:var(--sum-bg);padding:0 16px}
.kv .row{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:10px 0;border-bottom:1px solid var(--line-soft);
}
.kv .row:last-child{border-bottom:none}
.kv .row .k{font-size:12px;font-weight:500;color:var(--muted)}
.kv .row .v{font-size:13px;font-weight:700;color:var(--ink);text-align:right}
.kv .row .v.ok{color:var(--ok-ink)}
.kv .row .v.mute{color:var(--muted)}

.side-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.side-card > b{display:block;font-size:14px;font-weight:700;color:var(--ink);line-height:20px}
.side-step{display:flex;gap:10px;align-items:flex-start;padding-top:10px}
.side-step .n{
  width:28px;height:28px;border-radius:8px;flex:none;background:var(--cyan-bg);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:var(--cyan-ink);
}
.side-step .sx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.side-step .sx b{font-size:12px;font-weight:700;color:var(--ink);line-height:16px}
.side-step .sx span{font-size:11px;font-weight:500;color:var(--muted);line-height:16px}
.contact{display:flex;gap:10px;align-items:flex-start;padding-top:12px}
.contact .ci{width:22px;flex:none;text-align:center;font-size:14px}
.contact .cx{flex:1;min-width:0}
.contact .cx b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:18px}
.contact .cx span{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:16px}
.contact .cx a{color:var(--cyan-ink);font-weight:700;text-decoration:none;font-size:13px}

/* chips (pincodes) */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:36px;align-items:center}
.pchip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--chip-bg);border:1px solid var(--line-chip);border-radius:8px;
  padding:7px 10px;font-size:13px;font-weight:700;color:var(--ink);
}
.pchip.ok{background:var(--ok-bg);border-color:var(--ok-br);color:var(--ok-ink)}
.pchip.no{background:var(--err-bg);border-color:var(--err-br);color:var(--err)}
.pchip button{font-size:14px;line-height:1;color:var(--muted);padding:0}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:11px;margin-top:10px}
.meta-row .l{flex:1;min-width:0;font-weight:500;color:var(--muted);line-height:16px}
.meta-row .r{font-weight:700;color:var(--cyan-ink);white-space:nowrap}
.addbtn{
  background:var(--cyan-bg);border:1px solid var(--cyan-br);border-radius:8px;
  height:34px;padding:0 14px;font-size:13px;font-weight:700;color:var(--cyan-ink);flex:none;
}
.addbtn:disabled{opacity:.45;cursor:not-allowed}

/* KYC blocks */
.kyc-item{
  border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff;
}
.kyc-item.done{background:var(--ok-bg);border-color:var(--ok-br)}
.kyc-item > .h{display:flex;justify-content:space-between;align-items:center;gap:14px}
.kyc-item > .h .lt{flex:1;min-width:0}
.kyc-item > .h b{display:block;font-size:14px;font-weight:700;color:var(--ink);line-height:20px}
.kyc-item > .h span{display:block;font-size:12px;font-weight:500;color:var(--muted);line-height:17px;margin-top:2px}
.kyc-item .body{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.req{color:var(--err);font-weight:700}

.toggle-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toggle-row button{
  border:1px solid var(--line-field);border-radius:8px;padding:9px 14px;
  font-size:13px;font-weight:600;color:var(--muted);background:#fff;
}
.toggle-row button.on{border-color:var(--navy);background:var(--navy);color:#fff}

.upload{
  border:1px dashed var(--line-field);border-radius:10px;padding:16px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--sum-bg);
}
.upload.done{border-style:solid;border-color:var(--ok-br);background:var(--ok-bg)}
.upload .ut b{display:block;font-size:13px;font-weight:700;color:var(--ink)}
.upload .ut span{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}

/* agreements */
.rate-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
@media (max-width:900px){.rate-grid{grid-template-columns:1fr}}
.rate-box{border:1px solid var(--line);border-radius:12px;padding:16px}
.rate-box span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px}
.rate-box b{display:block;font-size:20px;font-weight:700;color:var(--ink)}
.scrollbox{
  border:1px solid var(--line);border-radius:12px;padding:18px;
  height:170px;overflow-y:auto;margin-bottom:18px;background:#fff;
}
.scrollbox p{margin:0 0 12px;font-size:13px;font-weight:500;color:var(--muted);line-height:20px}
.scrollbox p:last-child{margin-bottom:0}
.check-row{
  display:flex;gap:12px;align-items:flex-start;
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;
}
.check-row.off{opacity:.55}
.check-row input{
  width:18px;height:18px;flex:none;margin:1px 0 0;accent-color:var(--navy);cursor:pointer;
}
.check-row input:disabled{cursor:not-allowed}
.check-row .cl b{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:18px}
.check-row .cl span{display:block;font-size:12px;font-weight:500;color:var(--muted);line-height:17px;margin-top:2px}

/* notices */
.notice{
  border-radius:12px;padding:14px 16px;margin-bottom:16px;
  font-size:13px;font-weight:500;line-height:20px;
}
.notice b{display:block;font-weight:700;margin-bottom:3px;font-size:13px}
.notice.info{background:var(--cyan-bg);border:1px solid var(--cyan-br);color:var(--cyan-ink)}
.notice.warn{background:var(--warn-bg);border:1px solid var(--warn-br);color:var(--warn-ink)}
.notice.bad{background:var(--err-bg);border:1px solid var(--err-br);color:var(--err)}
.notice.ok{background:var(--ok-bg);border:1px solid var(--ok-br);color:var(--ok-ink)}

/* =========================================================================
   Captain Hub — the logged-in shell (Figma page 96:2 "Logged-in · Profile & Hubs")
   A different surface from onboarding: 1280-wide, its own dark sidebar.
   ====================================================================== */
.hub-shell{display:flex;align-items:stretch;min-height:100vh;background:var(--page-alt)}
.hub-side{
  width:224px;flex:none;position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg,#0c2247,#0a1734);
  display:flex;flex-direction:column;justify-content:space-between;
  padding:16px 12px;
}
.hub-side .top{display:flex;flex-direction:column;gap:6px;width:100%}
.hub-user{
  display:flex;gap:10px;align-items:center;width:100%;padding:10px;text-align:left;
  background:#14294c;border:1.5px solid rgba(21,182,232,.35);border-radius:12px;
}
.hub-user:hover{border-color:rgba(21,182,232,.6)}
.hub-user .av{
  width:40px;height:40px;border-radius:20px;flex:none;
  background:linear-gradient(90deg,#e6177f,#15b6e8);
}
.hub-user .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hub-user .who b{font-size:15px;font-weight:700;color:#fff;line-height:1.1}
.hub-user .hbadge{
  display:inline-flex;gap:6px;align-items:center;
  background:#12294d;border:1px solid #2e4372;border-radius:6px;
  padding:3px 8px 3px 10px;white-space:nowrap;
}
.hub-user .hbadge b{font-size:12px;font-weight:700;color:#fff}
.hub-user .hbadge i{font-size:10px;color:#b2c7e5;font-style:normal}
.hub-user .chev{font-size:20px;font-weight:700;color:#15b6e8;flex:none}
.hub-rule{height:1px;background:#fff;opacity:.1;width:100%;margin:4px 0}
.hub-nav{
  display:flex;gap:12px;align-items:center;width:100%;
  padding:11px 14px;border-radius:10px;color:#9aa7be;text-align:left;
}
.hub-nav .ic{font-size:15px;flex:none}
.hub-nav .lb{font-size:14px;font-weight:500}
.hub-nav:hover{background:rgba(255,255,255,.05);color:#cfdcef}
.hub-nav.on{background:#2b3d60;color:#fff}
.hub-nav.on .lb{font-weight:700}
.hub-side .bot{display:flex;flex-direction:column;gap:10px;width:100%}
.hub-brand{display:flex;gap:8px;align-items:center;padding:6px 0 0 14px}
.hub-brand b{font-size:16px;font-weight:700;color:#fff;letter-spacing:1.28px}
.hub-brand span{font-size:11px;font-weight:500;color:#9aa7be}

.hub-main{flex:1;min-width:0;padding:26px 32px 60px}
.hub-wrap{max-width:800px}
.crumbs{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:10px}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs .sep{margin:0 6px;color:#c3ccd9}
.hub-h1{
  display:flex;align-items:center;gap:8px;margin:0 0 16px;
  font-size:22px;font-weight:700;color:var(--ink);
}
.hub-h1 button{font-size:20px;color:var(--ink);padding:0;line-height:1}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{
  padding:0 0 10px;font-size:14px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}

.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.pcard > .ph{padding:18px 20px 14px}
.pcard > .ph b{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.pcard > .ph span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
.prow{
  display:flex;align-items:center;gap:16px;justify-content:space-between;
  padding:14px 20px;border-top:1px solid var(--line-soft);
}
.prow .pl{flex:1;min-width:0}
.prow .pl .k{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:3px}
.prow .pl .v{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.prow .pl .s{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.prow .pr{display:flex;align-items:center;gap:10px;flex:none}
.pill-ok{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--ok-bg);border:1px solid var(--ok-br);color:var(--ok-ink);
  border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap;
}
.pill-mute{
  display:inline-flex;align-items:center;gap:5px;
  background:#eef1f6;border:1px solid var(--line);color:var(--muted);
  border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;white-space:nowrap;
}
.pnote{
  display:flex;gap:10px;align-items:flex-start;
  background:var(--cyan-bg);border:1px solid var(--cyan-br);border-radius:10px;
  padding:13px 15px;font-size:12px;font-weight:500;color:var(--cyan-ink);line-height:18px;
}

/* My Hubs */
.hubs-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}
.hubs-head b{font-size:15px;font-weight:700;color:var(--ink)}
.hub-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.hub-card.off{opacity:.62}
.hub-card > .hh{display:flex;align-items:flex-start;gap:12px;padding:16px 20px}
.hcode{
  background:var(--navy);color:#fff;border-radius:6px;padding:4px 9px;
  font-size:11px;font-weight:700;white-space:nowrap;flex:none;
}
.hub-card.off .hcode{background:#8e9bb0}
.hub-card > .hh .ht{flex:1;min-width:0}
.hub-card > .hh .ht b{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.hub-card > .hh .ht span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
/* more specific than the `.ht span{display:block}` rule above, so the chip
   hugs its text instead of stretching the full card width */
.hub-card > .hh .ht span.hrole{
  display:inline-block;width:auto;margin-top:6px;
  background:var(--cyan-bg);border:1px solid var(--cyan-br);
  color:var(--cyan-ink);border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;
}

/* Add-new-hub GST choice */
.choice{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;
}
.choice:hover{border-color:var(--cyan-label)}
.choice.on{border:1.5px solid var(--cyan-label);background:var(--cyan-bg)}
.choice .radio{
  width:18px;height:18px;border-radius:9px;flex:none;margin-top:1px;
  border:1.5px solid var(--line-field);background:#fff;position:relative;
}
.choice.on .radio{border-color:var(--cyan-label)}
.choice.on .radio::after{
  content:"";position:absolute;inset:3px;border-radius:5px;background:var(--cyan-label);
}
.choice .ct{flex:1;min-width:0}
.choice .ct b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.choice .ct span{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:3px;line-height:17px}
.choice .ct .sub{margin-top:10px}
.choice{cursor:pointer}
.choice:focus-visible{outline:2px solid var(--cyan-label);outline-offset:2px}
.choice.off{opacity:.5;cursor:not-allowed}
.choice.off:hover{border-color:var(--line)}
/* controls inside a row must not re-trigger the row */
.choice input,.choice select{cursor:auto}

/* optional location photo, beside the map link */
.photo-row{
  display:flex;gap:12px;align-items:center;margin-top:10px;
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sum-bg);
}
.photo-row img{
  width:72px;height:54px;flex:none;object-fit:cover;border-radius:7px;
  border:1px solid var(--line);background:#fff;cursor:zoom-in;
}
.photo-row .pm{flex:1;min-width:0}
.photo-row .pm b{
  display:block;font-size:12px;font-weight:700;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.photo-row .pm span{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.photo-row button{font-size:11px;font-weight:700;color:var(--err);padding:0;flex:none}
.kv .row .v img{
  width:56px;height:42px;object-fit:cover;border-radius:6px;
  border:1px solid var(--line);vertical-align:middle;
}
/* full-size peek */
.photo-lb{
  position:fixed;inset:0;z-index:200;background:rgba(6,14,28,.72);
  display:flex;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;
}
.photo-lb img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}

/* ------------------------------------------------------------- dev panel -- */
#dev{
  position:fixed;right:18px;bottom:18px;z-index:9999;width:330px;
  font-family:var(--font);
}
#dev .dp{
  background:#0e1b2e;border:1px solid #243449;border-radius:14px;
  box-shadow:0 16px 40px rgba(2,10,22,.45);overflow:hidden;
}
#dev .dh{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 14px;background:#132340;cursor:pointer;width:100%;
}
#dev .dh b{font-size:12px;font-weight:700;color:#cfe0f5;letter-spacing:.2px}
#dev .dh i{font-size:11px;color:#7d93b2;font-style:normal}
#dev .db{padding:12px 14px 14px;max-height:62vh;overflow-y:auto}
#dev .dctx{font-size:11px;color:#8fa6c4;margin:0 0 10px;line-height:16px}
#dev .dctx b{color:#e6f0fb}
#dev .dgrp{margin-bottom:12px}
#dev .dgrp > span{
  display:block;font-size:10px;font-weight:700;color:#6f87a8;
  text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;
}
#dev button.da{
  display:block;width:100%;text-align:left;margin-bottom:6px;
  background:#1b2c47;border:1px solid #2b3f5c;border-radius:9px;
  padding:9px 11px;font-size:12px;font-weight:600;color:#dce8f7;
}
#dev button.da:hover{background:#24395a}
#dev button.da.ok{border-color:#1d5f45;background:#12331f;color:#7fe0ae}
#dev button.da.bad{border-color:#6d2b28;background:#33161a;color:#ffb0a6}
#dev button.da.warn{border-color:#6b5320;background:#332a12;color:#ffd58a}
#dev button.da:disabled{opacity:.4;cursor:not-allowed}
#dev .dnone{font-size:11px;color:#6f87a8;line-height:16px;margin:0 0 10px}
#dev .dreset{
  width:100%;background:#2a1418;border:1px solid #5c2a2a;border-radius:9px;
  padding:9px;font-size:11px;font-weight:700;color:#ff9b8e;margin-top:4px;
}
</style>
</head>

<div id="app"></div>
<div id="dev"></div>

<script>
"use strict";
/* ============================================================================
   Valmo — Captain self-serve onboarding prototype
   Design source: Figma T6DMr5qro6WZS908w41Qc9 / page "First time user flows"

   Two roles, two independent onboarding journeys:
     LM Captain — 9 phases (as designed)

var VEHICLE_TYPES_RAW = [
  "0.8MT_4W_TataAce","0.8MT_4W _TataAce","1.5MT_4W_Dost","2MT_4W_Bolero",

  "25MT_12W","30MT_14W","42MT_18W"
];
function dedupeVehicles(list) {
  var seen = {}, out = [];
  list.forEach(function (v) {
    var key = String(v).replace(/\s+/g, "");
    if (!key || seen[key]) return;
    seen[key] = true;
    out.push(key);
  });
  return out;
}
var VEHICLE_TYPES = dedupeVehicles(VEHICLE_TYPES_RAW);

/* Capacity rank = position in the ascending list. -1 for anything unknown. */
function vehicleRank(v) { return VEHICLE_TYPES.indexOf(String(v == null ? "" : v).trim()); }

/* The captain picks only the largest vehicle the hub can take; everything
   below it in the list is implied to fit. */
function impliedVehicles(max) {
  var i = vehicleRank(max);
  return i < 0 ? [] : VEHICLE_TYPES.slice(0, i + 1);
}
function smallerThan(max) {
  var i = vehicleRank(max);
  return i <= 0 ? [] : VEHICLE_TYPES.slice(0, i);
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* private mode */ }

function load() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    var parsed = JSON.parse(raw);
    if (!parsed || !parsed.roles) return false;
    // Merge each role over a blank so an older saved shape cannot break a render.
    var next = blankState();
    for (var k in parsed) if (k !== "roles") next[k] = parsed[k];
    ["LM","FM"].forEach(function (r) {
      var role = Object.assign(blankRole(r), parsed.roles[r] || {});
      /* Migration: hub details used to hold a single `maxVehicle` string before
         multiple types could be chosen. Carry it into the array. */
      /* Migration: hub details used to hold a list of accommodated vehicle
         types. Only the largest was ever meaningful — collapse to it. */
      if (role.hub && Array.isArray(role.hub.vehicles)) {
        if (!role.hub.maxVehicle) {
          role.hub.maxVehicle = role.hub.vehicles.reduce(function (best, v) {
            return vehicleRank(v) > vehicleRank(best) ? v : best;
          }, "");
        }
        delete role.hub.vehicles;
      }
      next.roles[r] = role;
    });
    next.profile = Object.assign(blankProfile(), parsed.profile || {});
    next.profile.bank = Object.assign(blankProfile().bank, (parsed.profile || {}).bank || {});
    next.hubs = Array.isArray(parsed.hubs) ? parsed.hubs.map(function (h) { return makeHub(h); }) : [];
    next.panel = Object.assign(blankPanel(), parsed.panel || {});
    next.panel.bank = Object.assign(blankPanel().bank, (parsed.panel || {}).bank || {});
    next.panel.gst = Object.assign(blankPanel().gst, (parsed.panel || {}).gst || {});
    next.panel.addHub = Object.assign(blankPanel().addHub, (parsed.panel || {}).addHub || {});
    S = next;
    return true;
  } catch (e) { return false; }
}

/* ------------------------------------------------------------- flow moves */

function goPhase(id) {
  var list = phases();
  for (var i = 0; i < list.length; i++) {
    if (list[i].id === id) { R().phaseIdx = i; save(); render(); return; }
  }
}
/* Phases carried over from the captain record when adding a second hub — they
   are already satisfied and must not be walked through again. */
function isCarried(r, id) { return !!(r.carried && r.carried[id]); }

function nextPhase() {
  var r = R(), list = phases();
  var i = r.phaseIdx + 1;
  while (i < list.length - 1 && isCarried(r, list[i].id)) i++;
  if (i <= list.length - 1) r.phaseIdx = i;
  save(); render();
}
function prevPhase() {
  var r = R(), i = prevEditableIdx(r);
  if (i < 0) return;
  r.phaseIdx = i;
  save(); render();
}

/* The captain can step back through the opening phases to correct something.
   Beyond hub details the flow has handed off to other people — background
   checks, Cluster Head review — so going back stops there. */
var BACK_EDITABLE = ["pd", "kyc", "hub"];

function prevEditableIdx(r) {
  var list = phases();
  if (BACK_EDITABLE.indexOf(list[r.phaseIdx].id) < 0) return -1;
  var i = r.phaseIdx - 1;
  while (i >= 0 && isCarried(r, list[i].id)) i--;
  if (i < 0 || BACK_EDITABLE.indexOf(list[i].id) < 0) return -1;
  return i;
}
function canGoBack(r) { return prevEditableIdx(r) >= 0; }
function backLabel(r) {
  var i = prevEditableIdx(r);
  return i < 0 ? "" : "← Back to " + phases()[i].lc;
}
/* Rendered on the left of a card footer, opposite Continue. */
function backBtn(r) {
  return canGoBack(r)
    ? '<button class="btn btn-ghost" id="phase-back">' + esc(backLabel(r)) + '</button>'
    : '';
}

/* Title of the phase the captain goes to next, skipping anything carried over.
   Continue-button labels read from this so a reordering of PHASES cannot leave
   a button pointing at the wrong screen. */
function nextTitle(r) {
  var list = phases(), i = r.phaseIdx + 1;
  while (i < list.length && isCarried(r, list[i].id)) i++;
  return i < list.length ? list[i].title : null;
}
function nextPhaseMeta(r) {
  var list = phases(), i = r.phaseIdx + 1;
  while (i < list.length && isCarried(r, list[i].id)) i++;
  return i < list.length ? list[i] : null;
}
function nextLabel(r, fallback) {
  var p = nextPhaseMeta(r);
  return p ? "Continue to " + p.lc + " →" : (fallback || "Continue →");
}
function nextRowLabel(r) {
  var p = nextPhaseMeta(r);
  return p ? "Next: " + p.lc : "Next step";
}

/* Progress bar counts completed phases, not the index, so a rejection that
   sends the captain backwards also walks the bar back. */
function progressPct() {
  var r = R(), total = phases().length;
  var pct = Math.round(((r.phaseIdx + (r.complete ? 1 : 0)) / total) * 100);
  return Math.max(0, Math.min(100, pct));
}

/* ------------------------------------------------------- phase gate checks */

function kycComplete(r) {
  var k = r.kyc;
  var base = k.aadhaar.done && k.pan.done && k.bank.done;
  if (!base) return false;
  if (r.role === "FM") {
    // FM: GST is mandatory. MSME is collected but optional, and the cancelled
    // cheque is not collected at all — the penny-drop proves the bank account.
    return k.gst.done && k.gst.registered === true;
  }
  // LM: GST is an optional toggle — "Non-GST" is a valid completed answer.
  return k.gst.done;
}

function chCanDecide(r) {
  // FM blocks until the Area Manager has classified the hub.
  if (r.role === "FM") return !!r.ch.category;
  return true;
}

function agCanActivate(r) {
  return r.ag.rateAccepted && r.ag.serviceAccepted;
}

/* ------------------------------------------------------- rate card helpers */

function ceilingFor(r) {
  var c = r.ch.category;
  return c && HUB_CATEGORIES[c] ? HUB_CATEGORIES[c].ceiling : null;
}
function tpFor(r) {
  var c = r.ch.category;
  return c && HUB_CATEGORIES[c] ? HUB_CATEGORIES[c].tp : null;
}
function isAboveCeiling(r) {
  var ceil = ceilingFor(r);
  return ceil != null && r.ch.rate != null && r.ch.rate > ceil;
}

/* Split mode, captain side. The payouts team has NOT confirmed this formula —
   it is rendered as an indicative figure with a caveat and is deliberately not
   used to gate or compute anything downstream. */
function indicativeCaptainSplit(r) {
  var slab = r.ch.slab != null ? r.ch.slab : r.ch.rate;
  if (slab == null) return null;
  var pilotCut = 0.35;                 // placeholder per-shipment pilot cut
  return Math.max(0, +(slab - pilotCut).toFixed(2));
}

/* ------------------------------------------------------------------ escape */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function money(n) {
  if (n == null) return "—";
  return "₹" + (Math.round(n * 100) / 100).toFixed(2);
}
function maskPhone(p) {
  if (!p || p.length < 10) return p || "";
  return "+91 " + p.slice(0, 5) + "•••" + p.slice(8);
}
function initials(name, phone) {
  var n = (name || "").trim();
  if (n) {
    var parts = n.split(/\s+/);
    return ((parts[0][0] || "") + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  return phone ? phone.slice(0, 2) : "KV";
}

  else if (S.screen === "otp")   html = viewOtp();
  else if (S.screen === "roles") html = viewRoles();
  else if (S.screen === "panel") html = viewPanel();
  else                           html = viewFlow();
  app.innerHTML = html;
  bind();
  renderDev();
}

function roleCard(code) {

function viewRoles() {

            'placeholder="HDFC0001234" value="' + esc(bk.draft.ifsc) + '"></div>' +
          '<div class="hint' + (bk.errField === "ifsc" ? ' err' : '') + '">' +
            (bk.errField === "ifsc" ? esc(bk.error) : "11 characters.") + '</div></div>' +
      '</div>' +
      '<div class="fl"><label>Account holder name</label>' +
        '<div class="box' + (bk.errField === "holder" ? ' bad' : '') + '">' +

/* ----------------------------------------------- HB-07 · Add a new hub */

function panelAddHub() {
  var a = S.panel.addHub, known = knownGstins();
  var fm = a.role === "FM";

  // FM hubs must be GST registered, so Non-GST is not offered for them.
  var nonGstDisabled = fm;

  /* A row is a radio, not a <button> — it contains a text field and a select, and
     form controls cannot live inside a button: the click would bubble to the
     button, re-render, and destroy the field before anything could be typed. */
  var opt = function (id, title, sub, extra, dis) {
    return '<div class="choice' + (a.choice === id ? " on" : "") + (dis ? " off" : "") + '" ' +
             'data-choice="' + id + '" role="radio" ' +
             'aria-checked="' + (a.choice === id ? "true" : "false") + '" ' +
             'aria-disabled="' + (dis ? "true" : "false") + '" ' +
             (dis ? '' : 'tabindex="0"') + '>' +
             '<span class="radio"></span>' +
             '<span class="ct"><b>' + title + '</b><span>' + sub + '</span>' +
               (extra ? '<span class="sub">' + extra + '</span>' : '') + '</span>' +
           '</div>';
  };

  var gstinSelect = known.length
    ? '<select id="addhub-existing" class="ms-search" style="max-width:280px;margin:0">' +
      known.map(function (g) {
        return '<option value="' + esc(g) + '"' + (a.existing === g ? " selected" : "") + '>' +
               esc(g) + ' · Karnataka</option>';
      }).join("") + '</select>'
    : '<span style="font-size:11px;color:var(--muted)">No verified GSTIN on your account yet.</span>';

  return '<div class="crumbs">My Profile<span class="sep">›</span>My Hubs' +
      '<span class="sep">›</span><b>Add new hub</b></div>' +
    '<h2 class="hub-h1"><button id="hub-back-hubs">‹</button>Add a new hub</h2>' +

    '<div class="pcard" style="max-width:520px"><div style="padding:22px 24px">' +
      '<div style="margin-bottom:22px">' +
        '<span style="display:block;font-size:11px;font-weight:700;color:var(--cyan-label);' +
          'margin-bottom:8px">Role for this hub</span>' +
        '<div class="toggle-row" style="margin:0">' +
          '<button data-addrole="LM"' + (a.role === "LM" ? ' class="on"' : '') + '>LM Captain</button>' +
          '<button data-addrole="FM"' + (a.role === "FM" ? ' class="on"' : '') + '>FM Captain</button>' +
        '</div></div>' +

      '<b style="display:block;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px">' +
        'How is this hub registered for GST?</b>' +
      '<p style="margin:0 0 18px;font-size:13px;font-weight:500;color:var(--muted);line-height:19px">' +
        'Your KYC and bank details carry over automatically. Choose the GST setup for this new hub ' +
        '— you can change it later.</p>' +

      opt("existing", "Use an existing GSTIN",
          "Map one of your already-verified GSTINs to this hub.", gstinSelect, !known.length) +
      opt("none", "Continue as Non-GST",
          nonGstDisabled
            ? "Not available for FM hubs — GST registration is mandatory for First Mile."
            : "This hub won&rsquo;t have a GSTIN. You can add one later from My Hubs.",
          "", nonGstDisabled) +
      opt("new", "Add a new GSTIN",
          "Enter and verify a new GSTIN for this hub via Cashfree.",
          a.choice === "new"
            ? '<span class="fl" style="display:block;margin:0"><span class="box' +
              (a.error ? ' bad' : '') + '" style="max-width:280px">' +
              '<input id="addhub-gstin" maxlength="15" style="text-transform:uppercase" ' +
              'placeholder="15-character GSTIN" value="' + esc(a.gstin) + '"></span>' +
              (a.error ? '<span class="hint err" style="display:block">' + esc(a.error) + '</span>' : '') +
              '</span>'
            : "") +

      '<div style="margin-top:20px">' +
        '<button class="btn btn-primary" id="addhub-go">Continue to hub details →</button>' +
        '<div style="margin-top:10px;font-size:11px;color:var(--muted)">' +
          'Personal details, KYC and background verification carry over — you start at ' +
          'hub details.</div>' +
      '</div>' +
    '</div></div>';
}

function panelPlaceholder(section) {
  var meta = {};
  HUB_NAV.forEach(function (n) { meta[n.id] = n; });
  var m = meta[section] || { label:"Captain Hub", icon:"🏠" };
  return '<div class="crumbs"><b>' + esc(m.label) + '</b></div>' +
    '<h2 class="hub-h1">' + m.icon + ' ' + esc(m.label) + '</h2>' +
    '<div class="pcard"><div style="padding:36px 24px;text-align:center">' +
      '<b style="display:block;font-size:15px;color:var(--ink);margin-bottom:6px">' +
        'Not part of this prototype</b>' +
      '<span style="font-size:13px;color:var(--muted)">' +
        esc(m.label) + ' is designed in the Captain Hub but out of scope here. ' +
        'This build covers Profile &amp; Hubs.</span>' +
      '<div style="margin-top:18px"><button class="btn btn-primary" data-nav="hubs">' +
        'Go to My Hubs</button></div>' +
    '</div></div>';
}

/* ------------------------------------------------------------------- flow */

function viewFlow() {
  var r = R(), list = phases(), idx = r.phaseIdx;
  var cur = list[idx];

  var steps = list.map(function (p, i) {
    // a phase carried over from the captain record counts as already cleared
    var isDone = i < idx || isCarried(r, p.id);
    var cls = i === idx ? "here" : (isDone ? "done" : "");
    var mark = (isDone && i !== idx) ? "✓" : String(i + 1);
    return '<div class="rstep ' + cls + '">' +
             '<div class="dot">' + mark + '</div>' +
             '<div class="txt"><b>' + esc(p.title) + '</b><span>' + esc(p.sub) + '</span></div>' +
           '</div>';
  }).join("");

  var pct = progressPct();

  var rail = '' +
  '<div class="rail">' +
    '<div class="rlogo">' +
      '<div class="mark"><img alt="VALMO" src="' + LOGO + '"></div>' +
      '<span>Captain<br>Onboarding</span>' +
    '</div>' +
    '<div class="rprogress">' +
      '<div class="top"><b>Step ' + (idx + 1) + ' of ' + list.length + '</b>' +
        '<i>' + pct + '% complete</i></div>' +
      '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
    '</div>' +
    '<div class="rsteps">' + steps + '</div>' +
    '<div class="ruser">' +
      '<div class="av">' + esc(initials(r.pd.name, S.phone)) + '</div>' +
      '<div class="who"><span>Logged in as</span><b>' + esc(maskPhone(S.phone)) + '</b></div>' +
    '</div>' +
    '<div class="rfoot">' +
      '<button class="out" id="logout">↩ Log out</button>' +
      '<button class="swap" id="switch-role">⇄ Switch role</button>' +
    '</div>' +
  '</div>';

  var body = renderPhase(cur.id, r);

  var top = '' +
  '<div class="topbar">' +
    '<div class="tt"><span>Captain Onboarding</span><b>' + esc(cur.title) + '</b></div>' +
    '<div class="track"><div style="width:' + pct + '%"></div></div>' +
    '<div class="tr">' +
      '<span class="pill"><span class="led"></span>Phone verified</span>' +
      '<button class="btn btn-ghost" id="save-exit">Save &amp; Exit</button>' +
    '</div>' +
  '</div>';

  return photoLightbox() + '<div class="flow">' + rail +
    '<div class="main">' + top +
      '<div class="content">' +
        '<div class="col-left">' + body.left + '</div>' +
        '<div class="col-side">' + body.side + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function phaseHeader(r, title, lede) {
  var list = phases(), idx = r.phaseIdx;
  return '' +
  '<div class="phead-row">' +
    '<div class="pl">' +
      '<div class="crumb"><span>Step ' + (idx + 1) + ' of ' + list.length + '</span><span>•</span>' +
        '<span>' + esc(list[idx].title) + '</span></div>' +
      '<h2>' + esc(title) + '</h2>' +
      '<p class="lede">' + esc(lede) + '</p>' +
    '</div>' +
    '<span class="saved"><span class="led"></span>All changes saved</span>' +
  '</div>';
}

/* Right-hand column: "what happens next" + application summary. */
function sideDefault(r, extraTop) {
  var list = phases(), idx = r.phaseIdx;
  var nxt = list[idx + 1];

  var s1 = nxt
    ? { b: nxt.title, s: nxt.sub }
    : { b: "Hub goes live", s: "Captain Panel access is unlocked." };

  var rows = [
    ["Mobile", maskPhone(S.phone)],
    ["Role", ROLE_META[r.role].name],
    ["Request ID", r.requestId || "—"],
    ["Status", list[idx].title]
  ];
  /* Hub category and the ceiling it drives are internal — the FM captain is
     never shown either. */
  if (r.hub.hubCode) rows.splice(rows.length - 1, 0, ["Hub code", r.hub.hubCode]);
  if (r.act.partnerId) rows.splice(rows.length - 1, 0, ["Partner ID", r.act.partnerId]);
  if (r.act.vendorId) rows.splice(rows.length - 1, 0, ["Oracle vendor ID", r.act.vendorId]);

  var kv = rows.map(function (x) {
    return '<div class="row"><span class="k">' + esc(x[0]) + '</span>' +
           '<span class="v">' + esc(x[1]) + '</span></div>';
  }).join("");

  return (extraTop || "") +
  '<div class="side-card">' +
    '<b>What happens next?</b>' +
    '<div class="side-step"><div class="n">1</div><div class="sx"><b>' + esc(s1.b) + '</b>' +
      '<span>' + esc(s1.s) + '</span></div></div>' +
    '<div class="side-step"><div class="n">2</div><div class="sx"><b>Progress is saved</b>' +
      '<span>You can exit and resume from this step.</span></div></div>' +
    '<div class="side-step"><div class="n">3</div><div class="sx"><b>Need help?</b>' +
      '<span>Use VALMO Support for onboarding help.</span></div></div>' +
  '</div>' +
  '<div class="side-card">' +
    '<b>Application summary</b>' +
    '<div style="padding-top:16px"><div class="kv">' + kv + '</div></div>' +
  '</div>';
}

function cardWrap(title, sub, inner, chip) {
  return '<div class="card">' +
    '<div class="chead"><div class="ct"><b>' + esc(title) + '</b>' +
      '<span>' + esc(sub) + '</span></div>' +
      '<span class="chip">' + (chip || "🔒 Secure onboarding") + '</span></div>' +
    '<div class="cbody">' + inner + '</div>' +
  '</div>';
}

function statusBlock(kind, title, text) {
  var icons = { ok:"✓", run:"◴", bad:"!", wait:"◷" };
  return '<div class="status-head"><div class="ico ' + kind + '">' + icons[kind] + '</div>' +
    '<div class="st"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></div></div>';
}

function tlRow(state, title, sub) {
  var mark = state === "ok" ? "✓" : (state === "bad" ? "!" : (state === "now" ? "●" : ""));
  return '<div class="tl-row ' + state + '"><div class="m">' + mark + '</div>' +
    '<div class="tx"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div></div>';
}

/* ------------------------------------------------------ phase dispatcher */

function renderPhase(id, r) {
  switch (id) {
    case "pd":  return phasePD(r);
    case "kyc": return phaseKYC(r);
    case "bgv": return phaseBGV(r);
    case "ch":  return phaseCH(r);
    case "sd":  return phaseSD(r);
    case "hub": return phaseHUB(r);
    case "am":  return phaseAM(r);
    case "ag":  return phaseAG(r);
    case "act": return phaseACT(r);
  }
  return { left:"", side:"" };
}

/* --------------------------------------------------- 1. personal details */

function phasePD(r) {
  var pd = r.pd, e = pd.errors || {};

  var chips = pd.pincodes.map(function (p) {
    var cls = "";
    if (pd.checked) cls = SERVICEABLE.indexOf(p) >= 0 ? " ok" : " no";
    var flag = pd.checked ? (SERVICEABLE.indexOf(p) >= 0 ? " ✓" : " ✕") : "";
    return '<span class="pchip' + cls + '">' + esc(p) + flag +
           '<button data-rmpin="' + esc(p) + '" aria-label="Remove">✕</button></span>';
  }).join("");

  var emailBox;
  if (pd.emailVerified) {
    emailBox = '<div class="box"><input id="pd-email" value="' + esc(pd.email) + '" disabled>' +
               '<span class="tag ok">Verified</span></div>';
  } else {
    emailBox = '<div class="box' + (e.email ? ' bad' : '') + '">' +
      '<input id="pd-email" placeholder="you@example.com" value="' + esc(pd.email) + '"' +
        (pd.emailLocked ? ' disabled' : '') + '>' +
      '<button class="btn-sm" id="pd-verify-email"' +
        (V.email(pd.email) && !pd.emailLocked ? '' : ' disabled') + '>Verify</button></div>';
  }

  var otpBlock = "";
  if (pd.emailOtpOpen && !pd.emailVerified && !pd.emailLocked) {
    otpBlock =
      '<div class="notice info"><b>Enter the 6-digit code sent to ' + esc(pd.email) + '</b>' +
      'Demo code: <b style="display:inline">000000</b>' +
      (pd.emailOtpAttempts > 0
        ? '<span style="display:block;color:var(--err);font-weight:700;margin-top:6px">' +
          ERR.otpWrong + ' (' + (3 - pd.emailOtpAttempts) + ' left)</span>'
        : '') +
      '<div style="display:flex;gap:10px;margin-top:12px">' +
        '<input id="pd-email-otp" class="otp-cell" style="width:auto;flex:1;height:44px;' +
          'font-size:15px;letter-spacing:6px;padding:0 12px" maxlength="6" inputmode="numeric" ' +
          'placeholder="000000">' +
        '<button class="btn btn-primary" id="pd-email-otp-go" style="padding:10px 18px">Confirm</button>' +
      '</div></div>';
  }
  if (pd.emailLocked) {
    otpBlock = '<div class="notice bad"><b>Email verification locked</b>' +
      'Three incorrect codes. Contact VALMO Support to unlock this email.</div>';
  }

  var canCheck = pd.pincodes.length > 0 && pd.emailVerified;
  var canContinue = !!pd.name.trim() && pd.emailVerified && pd.checked && !!pd.selected;

  var results = "";
  if (pd.checked) {
    var avail = pd.pincodes.filter(function (p) { return SERVICEABLE.indexOf(p) >= 0; });
    if (avail.length === 0) {
      results = '<div class="notice bad"><b>None of your pincodes are serviceable</b>' +
        'VALMO is not opening hubs in these areas yet. Remove them and try other pincodes.</div>';
    } else {
      results = '<div class="notice ok"><b>' + avail.length + ' of ' + pd.pincodes.length +
        ' pincodes are available</b>Select the pincode you want to run your hub in.</div>' +
        '<div class="toggle-row">' + avail.map(function (p) {
          return '<button data-selpin="' + esc(p) + '"' +
                 (pd.selected === p ? ' class="on"' : '') + '>' + esc(p) + '</button>';
        }).join("") + '</div>';
    }
  }

  var inner =
    '<div class="fl"><label>Vendor / Captain name</label>' +
      '<div class="box' + (e.name ? ' bad' : '') + '">' +
        '<input id="pd-name" placeholder="Full name" value="' + esc(pd.name) + '"></div>' +
      '<div class="hint' + (e.name ? ' err' : '') + '">' +
        (e.name || "Use the name you want VALMO to address you with.") + '</div></div>' +

    '<div class="grid2">' +
      '<div class="fl"><label>Alternate phone number</label>' +
        '<div class="box' + (e.altPhone ? ' bad' : '') + '">' +
          '<input id="pd-alt" inputmode="numeric" maxlength="10" placeholder="10-digit number" ' +
            'value="' + esc(pd.altPhone) + '"></div>' +
        '<div class="hint' + (e.altPhone ? ' err' : '') + '">' +
          (e.altPhone || "Not used for login. We will call here only if your primary phone is unreachable.") +
        '</div></div>' +
      '<div class="fl"><label>Email address</label>' + emailBox +
        '<div class="hint' + (e.email ? ' err' : '') + '">' +
          (e.email || "Verify this email to receive onboarding updates and documents.") +
        '</div></div>' +
    '</div>' +

    otpBlock +

    /* A bulk add that landed some pincodes and skipped others is a partial
       success, not a failure — amber, not red. */
    '<div class="fl" style="margin-bottom:10px"><label>Serviceable pincodes</label>' +
      '<div class="box' + (e.pincode ? (pd.lastAdded ? ' warn' : ' bad') : '') +
        '" style="justify-content:space-between;padding-right:8px">' +
        '<input id="pd-pin" placeholder="Enter or paste pincodes — e.g. 560076, 560034, 110017">' +
        '<button class="addbtn" id="pd-addpin"' +
          (pd.pincodes.length >= 5 ? ' disabled' : '') + '>＋ Add</button></div>' +
      (e.pincode
        ? '<div class="hint ' + (pd.lastAdded ? 'warn' : 'err') + '">' + esc(e.pincode) + '</div>'
        : '') +
    '</div>' +
    '<div class="chips">' + (chips || '<span style="font-size:12px;color:var(--muted)">No pincodes added yet.</span>') + '</div>' +
    '<div class="meta-row"><span class="l">Add up to 5 pincodes where you&rsquo;d like to run a hub — ' +
      'we&rsquo;ll check which are available. Paste a comma-separated list to add several at once.</span>' +
      '<span class="r">' + pd.pincodes.length + ' of 5 added</span></div>' +

    '<div style="margin-top:16px">' +
      '<button class="btn btn-ghost" id="pd-check"' + (canCheck ? '' : ' disabled') + '>' +
        'Check availability</button>' +
      (!pd.emailVerified ? '<span style="font-size:11px;color:var(--muted);margin-left:10px">' +
        'Verify your email first.</span>' : '') +
    '</div>' +
    (results ? '<div style="margin-top:16px">' + results + '</div>' : '') +

    '<div class="cfoot">' +
      backBtn(r) +
      '<span class="note">By continuing, you agree that VALMO can use this information to ' +
        'process your onboarding request.</span>' +
      '<button class="btn btn-primary" id="pd-continue"' + (canContinue ? '' : ' disabled') +
        '>Continue →</button>' +
    '</div>';

  return {
    left: phaseHeader(r, "Personal details", "Tell us who you are and where you want to open the hub.") +
          cardWrap("Personal details",
                   "Email verification is required before pincode availability check.", inner),
    side: sideDefault(r)
  };
}

/* -------------------------------------------------------- 2. KYC (LM/FM) */

/* The designs verify one record at a time — Aadhaar, then PAN, then bank, then
   GST — each on its own card, with a confirmation screen between them
   (KYC-01…KYC-14). Not one long scrollable form. */
var KYC_ORDER = ["aadhaar", "pan", "bank", "gst"];

function kycStep(r) {
  var k = r.kyc;
  if (k.editing) return k.editing;                  // an item reopened for correction
  for (var i = 0; i < KYC_ORDER.length; i++) {
    var id = KYC_ORDER[i];
    if (!k[id].done) return id;                     // still to be entered
    if (id !== "gst" && !k.ack[id]) return id + "-done";   // its confirmation screen
  }
  return "complete";
}

function kycEditBtn(id) {
  return '<button class="btn-link" data-kycedit="' + id + '" ' +
         'style="margin-left:10px;font-size:12px">Edit</button>';
}

/* Footer shared by every entry card. */
function kycFoot(r, btnId, label, enabled) {
  return '<div class="cfoot">' + backBtn(r) +
    '<span class="note">Sensitive details are masked and used only for onboarding ' +
      'verification.</span>' +
    '<button class="btn btn-primary" id="' + btnId + '"' + (enabled ? '' : ' disabled') +
      '>' + esc(label) + '</button></div>';
}

function phaseKYC(r) {
  var k = r.kyc, e = k.errors || {}, fm = r.role === "FM";
  var step = kycStep(r);
  var lede, title, sub, body;

  /* ---------------------------------------------------- Aadhaar (KYC-01…04) */
  if (step === "aadhaar") {
    lede  = "Verify identity to continue.";
    title = "Aadhaar verification";
    sub   = "Enter your Aadhaar number to verify identity.";
    body =
      '<div class="fl"><label>Aadhaar number</label>' +
        '<div class="box' + (e.aadhaar ? ' bad' : '') + '">' +
        '<input id="kyc-aadhaar" inputmode="numeric" maxlength="12" ' +
          'placeholder="12-digit Aadhaar" value="' + esc(k.aadhaar.value) + '"></div>' +
        '<div class="hint' + (e.aadhaar ? ' err' : '') + '">' +
          (e.aadhaar || "Only masked Aadhaar is shown after verification.") + '</div></div>' +
      (k.aadhaar.otpOpen
        ? '<div class="notice info"><b>DigiLocker OTP sent</b>Demo code: ' +
          '<b style="display:inline">000000</b>' +
          '<div style="display:flex;gap:10px;margin-top:12px">' +
          '<input id="kyc-aadhaar-otp" class="otp-cell" style="width:auto;flex:1;height:44px;' +
            'font-size:15px;letter-spacing:6px;padding:0 12px" maxlength="6" placeholder="000000">' +
          '<button class="btn btn-primary" id="kyc-aadhaar-confirm" style="padding:10px 18px">' +
            'Confirm</button></div></div>'
        : "") +
      kycFoot(r, "kyc-aadhaar-go", "Verify Aadhaar →", !k.aadhaar.otpOpen);

  } else if (step === "aadhaar-done") {
    var ad = k.aadhaar.data || {};
    lede  = "Aadhaar verification is complete.";
    title = "KYC verification";
    sub   = "Aadhaar verification is complete.";
    body =
      statusBlock("ok", "Aadhaar verified", "Your Aadhaar has been verified successfully.") +
      '<p style="text-align:center;font-size:13px;font-weight:500;color:var(--muted);' +
        'margin:0 0 16px">You can now continue to PAN verification.</p>' +
      '<div class="kv" data-testid="aadhaar-fetched">' +
        '<div class="row"><span class="k">Fetched from Aadhaar</span><span class="v mute"></span></div>' +
        '<div class="row"><span class="k">Name</span><span class="v">' + esc(ad.name || "—") + '</span></div>' +
        '<div class="row"><span class="k">Date of birth</span><span class="v">' + esc(ad.dob || "—") + '</span></div>' +
        '<div class="row"><span class="k">Aadhaar address</span>' +
          '<span class="v" style="max-width:62%;white-space:normal">' + esc(ad.address || "—") + '</span></div>' +
      '</div>' +
      '<div class="cfoot">' + backBtn(r) +
        kycEditBtn("aadhaar") +
        '<button class="btn btn-primary" id="kyc-ack-aadhaar">Continue to PAN verification →</button>' +
      '</div>';

  /* -------------------------------------------------------- PAN (KYC-05…07) */
  } else if (step === "pan") {
    lede  = "Verify PAN details to continue.";
    title = "PAN verification";
    sub   = "Enter your PAN and father’s name to continue.";
    body =
      '<div class="grid2">' +
        '<div class="fl"><label>PAN number</label>' +
          '<div class="box' + (e.pan ? ' bad' : '') + '">' +
          '<input id="kyc-pan" maxlength="10" style="text-transform:uppercase" ' +
            'placeholder="ABCDE1234F" value="' + esc(k.pan.value) + '"></div>' +
          '<div class="hint' + (e.pan ? ' err' : '') + '">' +
            (e.pan || "10-character PAN format.") + '</div></div>' +
        '<div class="fl"><label>Father’s name</label>' +
          '<div class="box' + (e.panFather ? ' bad' : '') + '">' +
          '<input id="kyc-pan-father" placeholder="Enter father’s name (as on PAN card)" ' +
            'value="' + esc(k.pan.father) + '"></div>' +
          '<div class="hint' + (e.panFather ? ' err' : '') + '">' +
            (e.panFather || "Required — as printed on your PAN card.") + '</div></div>' +
      '</div>' +
      kycFoot(r, "kyc-pan-go", "Verify PAN →", true);

  } else if (step === "pan-done") {
    lede  = "PAN verification is complete.";
    title = "KYC verification";
    sub   = "PAN verification is complete.";
    body =
      statusBlock("ok", "PAN verified", "Your PAN has been verified against your Aadhaar name.") +
      '<p style="text-align:center;font-size:13px;font-weight:500;color:var(--muted);' +
        'margin:0 0 16px">You can now continue to bank verification.</p>' +
      '<div class="kv">' +
        '<div class="row"><span class="k">PAN</span><span class="v">' + esc(k.pan.value) + '</span></div>' +
        '<div class="row"><span class="k">Father’s name</span><span class="v">' +
          esc(k.pan.father) + '</span></div>' +
      '</div>' +
      '<div class="cfoot">' + backBtn(r) + kycEditBtn("pan") +
        '<button class="btn btn-primary" id="kyc-ack-pan">Continue to bank verification →</button>' +
      '</div>';

  /* ------------------------------------------------------- bank (KYC-08…10) */
  } else if (step === "bank") {
    lede  = "Verify payout bank details to continue.";
    title = "Bank account verification";
    sub   = "Add the account where payouts should be credited.";
    body =
      '<div class="grid2">' +
        '<div class="fl"><label>Account number</label>' +
          '<div class="box' + (e.account ? ' bad' : '') + '">' +
          '<input id="kyc-acc" inputmode="numeric" maxlength="18" placeholder="Account number" ' +
            'value="' + esc(k.bank.acc) + '"></div>' +
          '<div class="hint' + (e.account ? ' err' : '') + '">' +
            (e.account || "Enter your active payout account number.") + '</div></div>' +
        '<div class="fl"><label>IFSC code</label>' +
          '<div class="box' + (e.ifsc ? ' bad' : '') + '">' +
          '<input id="kyc-ifsc" maxlength="11" style="text-transform:uppercase" ' +
            'placeholder="HDFC0001234" value="' + esc(k.bank.ifsc) + '"></div>' +
          '<div class="hint' + (e.ifsc ? ' err' : '') + '">' +
            (e.ifsc || "Enter branch IFSC code.") + '</div></div>' +
      '</div>' +
      '<div class="fl"><label>Account holder name</label>' +
        '<div class="box"><input id="kyc-holder" value="' + esc(k.bank.holder || "") + '" disabled></div>' +
        '<div class="hint">Shown after bank verification.</div></div>' +
      (fm ? '<div class="hint" style="padding-bottom:4px">Cancelled cheque is not required for FM — ' +
            'the ₹1 penny-drop is the bank proof.</div>' : '') +
      kycFoot(r, "kyc-bank-go", "Verify bank account →", true);

  } else if (step === "bank-done") {
    lede  = "Bank verification is complete.";
    title = "KYC verification";
    sub   = "Bank verification is complete.";
    body =
      statusBlock("ok", "Bank account verified", "A ₹1 penny-drop confirmed this account.") +
      '<p style="text-align:center;font-size:13px;font-weight:500;color:var(--muted);' +
        'margin:0 0 16px">You can now continue to GST status.</p>' +
      '<div class="kv">' +
        '<div class="row"><span class="k">Account number</span><span class="v">' +
          esc(k.bank.acc.replace(/\d(?=\d{4})/g, "•")) + '</span></div>' +
        '<div class="row"><span class="k">IFSC code</span><span class="v">' + esc(k.bank.ifsc) + '</span></div>' +
        '<div class="row"><span class="k">Account holder name</span><span class="v">' +
          esc(k.bank.holder || "—") + '</span></div>' +
      '</div>' +
      '<div class="cfoot">' + backBtn(r) + kycEditBtn("bank") +
        '<button class="btn btn-primary" id="kyc-ack-bank">Continue to GST status →</button>' +
      '</div>';

  /* -------------------------------------------------------- GST (KYC-11…13) */
  } else if (step === "gst") {
    lede  = "Choose GST status to complete KYC.";
    title = "GST status";
    sub   = fm
      ? "GST registration is mandatory for First Mile hub partners."
      : "Non-GST is selected by default. Choose GST registered only if you have an active GSTIN.";

    var reg = k.gst.registered === true;
    var choice = function (on, id, t, d, dis) {
      return '<div class="choice' + (on ? " on" : "") + (dis ? " off" : "") + '" ' +
        'data-gstchoice="' + id + '" role="radio" aria-checked="' + (on ? "true" : "false") + '" ' +
        'aria-disabled="' + (dis ? "true" : "false") + '"' + (dis ? '' : ' tabindex="0"') + '>' +
        '<span class="radio"></span><span class="ct"><b>' + t + '</b><span>' + d + '</span></span></div>';
    };

    body =
      choice(k.gst.registered === false, "none", "Non-GST",
        fm ? "Not available for FM hubs — GST registration is mandatory for First Mile."
           : "Continue without GSTIN. You can update GST status later from profile settings.",
        fm) +
      choice(reg, "registered", "GST registered",
        "Select this to enter GSTIN and verify GST status.", false) +
      (reg
        ? '<div class="fl" style="margin-top:14px"><label>GSTIN</label>' +
          '<div class="box' + (e.gstin ? ' bad' : '') + '">' +
          '<input id="kyc-gstin" maxlength="15" style="text-transform:uppercase" ' +
            'placeholder="15-character GSTIN" value="' + esc(k.gst.gstin) + '"></div>' +
          '<div class="hint' + (e.gstin ? ' err' : '') + '">' +
            (e.gstin || "15 characters, as printed on your GST certificate.") + '</div></div>'
        : '') +
      kycFoot(r, "kyc-gst-go", reg ? "Verify GSTIN →" : "Continue →",
              k.gst.registered !== null);

  /* ------------------------------------------------------ complete (KYC-14) */
  } else {
    lede  = "Identity and payout details are verified.";
    title = "KYC verification";
    sub   = "Identity and payout details are verified.";
    body =
      statusBlock("ok", "KYC verification complete",
        "Your Aadhaar, PAN, bank account and GST records are complete.") +
      /* each record can be reopened from here, rather than only restarting
         the sequence at Aadhaar */
      '<div class="kv">' +
        '<div class="row"><span class="k">Aadhaar</span><span class="v ok">Verified' +
          kycEditBtn("aadhaar") + '</span></div>' +
        '<div class="row"><span class="k">PAN</span><span class="v ok">Verified' +
          kycEditBtn("pan") + '</span></div>' +
        '<div class="row"><span class="k">Bank account</span><span class="v ok">Verified' +
          kycEditBtn("bank") + '</span></div>' +
        '<div class="row"><span class="k">GST' + (fm ? '' : ' status') + '</span><span class="v' +
          (k.gst.registered ? ' ok' : ' mute') + '">' +
          (k.gst.registered ? "Verified" : "Non-GST") + kycEditBtn("gst") + '</span></div>' +
        (fm ? '<div class="row"><span class="k">MSME certificate</span><span class="v' +
              (k.msme.done ? ' ok">Uploaded' : ' mute">Not provided') + '</span></div>' : '') +
      '</div>' +
      (fm && !k.msme.done
        ? '<div class="upload" style="margin-top:16px" data-testid="msme-optional-upload">' +
          '<div class="ut"><b>MSME registration certificate</b>' +
          '<span>Optional — attach it now, or add it later.</span></div>' +
          '<button class="btn btn-ghost" id="kyc-msme-go">Upload file</button></div>'
        : '') +
      '<div class="cfoot">' + backBtn(r) +
        '<span class="note">Each record can be reopened and redone above.</span>' +
        '<button class="btn btn-primary" id="kyc-continue">' + esc(nextLabel(r)) + '</button>' +
      '</div>';
  }

  return {
    left: phaseHeader(r, "KYC verification", lede) + cardWrap(title, sub, body),
    side: sideDefault(r)
  };
}

/* Rate card panel — FM only. Reads the ceiling from the AM-set hub category. */
function rateCardPanel(r) {
  var cat = r.ch.category;
  if (!cat) return "";

  var rows =
    '<div class="row"><span class="k">Touchpoint rate</span>' +
      '<span class="v">' + money(meta.tp) + '</span></div>';

  if (r.ch.rate != null) {
    // no ceiling annotation either way — the captain is not shown the ceiling
    rows += '<div class="row"><span class="k">Proposed rate</span>' +
      '<span class="v">' + money(r.ch.rate) + '</span></div>';
  }

  var modeBlock = "";
  if (r.ch.rate != null) {
    if (r.ch.rateMode === "combined") {
      modeBlock = '<div class="notice info"><b>Combined rate card</b>' +
        'One blended figure for the hub: slab rate plus touchpoint, billed as a single ' +
        'per-shipment rate of ' + money(r.ch.rate) + '.</div>';
    } else {
      var cap = indicativeCaptainSplit(r);
      modeBlock = '<div class="notice info"><b>Split rate card</b>' +
        'The pilot and the captain are paid on separate lines.' +
        '<div class="kv" style="margin-top:12px;background:#fff">' +
          '<div class="row"><span class="k">Pilot — slab rate + touchpoint</span>' +
            '<span class="v">' + money((r.ch.slab != null ? r.ch.slab : r.ch.rate)) +
            ' + ' + money(meta.tp) + '</span></div>' +
          '<div class="row"><span class="k">Captain — slab net of pilot cut</span>' +
            '<span class="v mute">' + money(cap) + ' (indicative)</span></div>' +
        '</div></div>' +
        '<div class="notice warn" data-testid="split-caveat"><b>Indicative — formula being confirmed</b>' +
        'The captain-side split figure above is a placeholder. The exact formula for netting ' +
        'the pilot&rsquo;s per-shipment cut out of the slab rate is still being confirmed with ' +
        'the payouts team, and this number must not be quoted to a partner.</div>';
    }
  }

  return '<div class="kv" style="margin-bottom:16px">' + rows + '</div>' + modeBlock;
}

function phaseCH(r) {
  var ch = r.ch, fm = r.role === "FM", inner, side;

  if (fm && !ch.category && ch.status !== "approved") {
    inner = '<div data-testid="waiting-category">' +
      statusBlock("run", "Cluster Head review in progress",

        tlRow("", nextRowLabel(r), "Available after approval.") +
      '</div></div>';
    side = sideDefault(r, chContactCard("ch"));
    return {
      left: phaseHeader(r, "Cluster Head review", "Cluster Head is reviewing your request.") +
            cardWrap("Cluster Head review", "Cluster Head is reviewing your request.", inner),
      side: side

        '<div class="row"><span class="k">Forward rate</span><span class="v">₹14.50</span></div>' +
        '<div class="row"><span class="k">Reverse rate</span><span class="v">₹8.00</span></div></div>') +

        '<button class="btn btn-primary" id="ch-continue">' + nxtLabel + '</button></div>';
