};

/* Fan-out animation. Tests call finishActivation() directly instead of waiting. */
var fanTimers = [];
function stopFanout() { fanTimers.forEach(clearTimeout); fanTimers = []; }
function runFanout() {
  stopFanout();
  var r = R(), role = S.activeRole, list = FANOUT[r.role];
  list.forEach(function (f, i) {
    fanTimers.push(setTimeout(function () {
      var rr = S.roles[role];
      if (rr.act.status !== "running") return;
      rr.act.done[f.id] = true;
      if (i === list.length - 1) {
        var keep = S.activeRole; S.activeRole = role;
        A.finishActivation();
        S.activeRole = keep;
      } else { save(); render(); }
    }, 420 * (i + 1)));
  });
}

/* OTP countdown.
   The tick patches just the countdown text. A full render() here would replace
   app.innerHTML every second, destroying the OTP inputs and dropping focus —
   which makes the field untypeable while the countdown is running. */
function paintOtpCountdown() {
  var el = document.getElementById("otp-countdown");
  if (el) el.textContent = "Resend OTP in " + S.otpSeconds + " s";
}
function startOtpTimer() {
  stopOtpTimer();
  otpTimer = setInterval(function () {
    if (S.screen !== "otp") { stopOtpTimer(); return; }
    S.otpSeconds--;
    if (S.otpSeconds <= 0) {
      S.otpSeconds = 0;
      stopOtpTimer();
      render();          // one full render, to swap the countdown for "Resend OTP"
      return;
    }
    paintOtpCountdown();
  }, 1000);
}
function stopOtpTimer() { if (otpTimer) { clearInterval(otpTimer); otpTimer = null; } }

/* =========================================================================
   EVENT BINDING
   ====================================================================== */

function on(id, ev, fn) {
  var el = document.getElementById(id);
  if (el) el.addEventListener(ev, fn);
}
function val(id) {
  var el = document.getElementById(id);
  return el ? el.value : "";
}

/* Checkbox rows are re-bound whenever the filtered list is repainted. */
function bindVehicleRows() {
  Array.prototype.forEach.call(document.querySelectorAll("#veh-list [data-veh]"), function (cb) {
    cb.addEventListener("change", function () { A.toggleVehicle(cb.getAttribute("data-veh")); });
  });
}

/* Document-level listeners close the dropdown on an outside click or Escape.
   Attached once — render() rebuilds #app but leaves document listeners intact. */
var vehGlobalBound = false;
function bindVehicleGlobals() {
  if (vehGlobalBound) return;
  vehGlobalBound = true;
  document.addEventListener("click", function () {
    if (vehUI.open) A.openVehicles(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && vehUI.open) A.openVehicles(false);
  });
}

function bind() {
  /* login */
  on("phone", "input", function (e) {
    S.phone = e.target.value.replace(/\D/g, "").slice(0, 10);
    S.loginError = "";
    var btn = document.getElementById("go-otp");
    if (btn) btn.disabled = !V.phone(S.phone);
    if (e.target.value !== S.phone) e.target.value = S.phone;
  });
  on("phone", "keydown", function (e) { if (e.key === "Enter") A.submitPhone(); });
  on("go-otp", "click", A.submitPhone);

  /* otp */
  /* OTP cells are patched in place rather than re-rendered, so the focused cell
     survives. A full render() here would drop focus and make the row untypeable. */
  function otpCell(i) { return document.querySelector('.otp-cell[data-i="' + i + '"]'); }
  function paintOtpCells() {
    for (var i = 0; i < 6; i++) {
      var c = otpCell(i);
      if (c && c.value !== S.otp[i]) c.value = S.otp[i];
    }
    var vb = document.getElementById("verify-otp");
    if (vb) vb.disabled = !S.otp.every(function (x) { return x !== ""; });
  }
  /* Spread a run of digits across the cells starting at `from`. This is the
     SMS-autofill and paste path: the whole code arrives in a single cell. */
  function fillOtpFrom(from, digits) {
    for (var k = 0; k < digits.length && from + k < 6; k++) S.otp[from + k] = digits[k];
    paintOtpCells();
    var land = otpCell(Math.min(from + digits.length, 5));
    if (land) land.focus();
  }
  A.fillOtpFrom = fillOtpFrom;

  Array.prototype.forEach.call(document.querySelectorAll(".otp-cell[data-i]"), function (el) {
    el.addEventListener("input", function (e) {
      var i = +el.getAttribute("data-i");
      var raw = (e.target.value || "").replace(/\D/g, "");
      S.otpError = "";
      if (raw.length > 1) { fillOtpFrom(i, raw); return; }
      S.otp[i] = raw;
      e.target.value = raw;
      paintOtpCells();
      if (raw && i < 5) { var nx = otpCell(i + 1); if (nx) nx.focus(); }
    });
    el.addEventListener("paste", function (e) {
      var cb = e.clipboardData || window.clipboardData;
      if (!cb) return;
      var digits = (cb.getData("text") || "").replace(/\D/g, "");
      if (!digits) return;
      e.preventDefault();
      fillOtpFrom(+el.getAttribute("data-i"), digits);
    });
    el.addEventListener("keydown", function (e) {
      var i = +el.getAttribute("data-i");
      if (e.key === "Backspace" && !el.value && i > 0) {
        var pv = otpCell(i - 1);
        if (pv) pv.focus();
      }
      if (e.key === "Enter" && S.otp.every(function (x) { return x !== ""; })) A.verifyOtp();
    });
  });
  on("verify-otp", "click", A.verifyOtp);
  on("resend", "click", A.resendOtp);
  on("otp-back", "click", function () { stopOtpTimer(); S.screen = "login"; save(); render(); });

  /* roles */
  Array.prototype.forEach.call(document.querySelectorAll("[data-pick]"), function (el) {
    el.addEventListener("click", function () { A.pickRole(el.getAttribute("data-pick")); });
  });
  on("logout", "click", A.logout);
  on("switch-role", "click", A.switchRole);
  on("save-exit", "click", A.switchRole);

  if (S.screen !== "flow") return;
  var r = R();

  /* personal details */
  on("pd-name", "input", function (e) { r.pd.name = e.target.value; save(); });
  on("pd-alt", "input", function (e) {
    r.pd.altPhone = e.target.value.replace(/\D/g, "").slice(0, 10);
    if (e.target.value !== r.pd.altPhone) e.target.value = r.pd.altPhone;
    save();
  });
  on("pd-email", "input", function (e) {
    r.pd.email = e.target.value;
    var b = document.getElementById("pd-verify-email");
    if (b) b.disabled = !V.email(r.pd.email);
    save();
  });
  on("pd-verify-email", "click", A.sendEmailOtp);
  on("pd-email-otp-go", "click", function () { A.confirmEmailOtp(val("pd-email-otp")); });
  on("pd-addpin", "click", function () { A.addPincodes(val("pd-pin")); });
  on("pd-pin", "keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); A.addPincodes(val("pd-pin")); }
  });
  /* A paste carrying a separator is clearly a bulk paste — add it straight away
     rather than making the captain also press Add. A single value just fills
     the field as normal. */
  on("pd-pin", "paste", function (e) {
    var cb = e.clipboardData || window.clipboardData;
    if (!cb) return;
    var t = cb.getData("text") || "";
    if (!PIN_SPLIT.test(t.trim())) return;
    e.preventDefault();
    A.addPincodes(t);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-rmpin]"), function (el) {
    el.addEventListener("click", function () { A.removePincode(el.getAttribute("data-rmpin")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-selpin]"), function (el) {
    el.addEventListener("click", function () { A.selectPincode(el.getAttribute("data-selpin")); });
  });
  on("pd-check", "click", A.checkAvailability);
  on("pd-continue", "click", A.pdContinue);

  /* kyc */
  on("kyc-aadhaar-go", "click", function () { A.aadhaarStart(val("kyc-aadhaar")); });
  on("kyc-aadhaar-confirm", "click", function () { A.aadhaarConfirm(val("kyc-aadhaar-otp")); });
  on("kyc-pan-go", "click", function () { A.panVerify(val("kyc-pan"), val("kyc-pan-father")); });
  on("kyc-bank-go", "click", function () { A.bankVerify(val("kyc-acc"), val("kyc-ifsc")); });
  on("kyc-gst-yes", "click", function () { A.gstSet(true); });
  on("kyc-gst-no", "click", function () { A.gstSet(false); });
  on("kyc-gst-go", "click", function () { A.gstVerify(val("kyc-gstin")); });
  on("kyc-msme-go", "click", A.uploadMsme);
  on("kyc-cheque-go", "click", A.uploadCheque);
  on("kyc-continue", "click", A.kycContinue);

  /* bgv */
  on("bgv-continue", "click", A.bgvContinue);
  on("bgv-retry", "click", A.bgvRetry);
  on("bgv-back-kyc", "click", function () { goPhase("kyc"); });

  /* cluster head */
  on("ch-continue", "click", A.chContinue);
  on("ch-resubmit", "click", A.chResubmit);
  on("ch-back-pd", "click", function () { goPhase("pd"); });

  /* security deposit */
  on("sd-pay", "click", function () { A.sdSet("paid"); });
  on("sd-retry", "click", function () { A.sdSet("pending"); });
  on("sd-requote", "click", A.sdRequote);
  on("sd-continue", "click", A.sdContinue);

  /* hub */
  on("hub-address", "input", function (e) { r.hub.address = e.target.value; save(); });
  on("hub-map", "input", function (e) { r.hub.mapLink = e.target.value; save(); });
  on("hub-area", "input", function (e) { r.hub.areaSqft = e.target.value; save(); });
  on("hub-manpower", "input", function (e) { r.hub.manpower = e.target.value; save(); });
  bindVehicleRows();
  on("veh-toggle", "click", function (e) { e.stopPropagation(); A.openVehicles(); });
  on("veh-search", "input", function (e) { A.filterVehicles(e.target.value); });
  on("veh-search", "keydown", function (e) {
    if (e.key === "Escape") { e.stopPropagation(); A.openVehicles(false); }
  });
  on("veh-all", "click", function () {
    // "Select all" respects an active search — it picks what is visible
    var vis = Array.prototype.map.call(
      document.querySelectorAll("#veh-list [data-veh]"),
      function (cb) { return cb.getAttribute("data-veh"); });
    var cur = (R().hub.vehicles || []).slice();
    A.setVehicles(cur.concat(vis));
  });
  on("veh-none", "click", function () { A.setVehicles([]); });
  var panel = document.getElementById("veh-panel");
  if (panel) panel.addEventListener("click", function (e) { e.stopPropagation(); });
  on("hub-submit", "click", function () {
    A.hubSubmit({
      address:  val("hub-address"),
      mapLink:  val("hub-map"),
      areaSqft: val("hub-area"),
      manpower: val("hub-manpower"),
      vehicles: (R().hub.vehicles || []).slice()
    });
  });
  on("hub-continue", "click", A.hubContinue);

  /* area manager */
  on("am-continue", "click", A.amContinue);
  on("am-fix-hub", "click", A.hubReopen);

  /* agreements */
  var sc = document.getElementById("ag-scroll");
  if (sc) {
    sc.addEventListener("scroll", function () {
      if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 8) A.markAgreementRead();
    });
  }
  on("ag-rate", "change", function (e) { A.setRateAccepted(e.target.checked); });
  on("ag-service", "change", function (e) { A.setServiceAccepted(e.target.checked); });
  on("ag-activate", "click", A.activate);

  /* activation */
  on("act-retry", "click", A.actRetry);
  on("act-panel", "click", A.switchRole);
}

/* =========================================================================
   DEV PANEL — stands in for the cluster head / area manager / zonal head
   consoles. See README for why this exists.
   ====================================================================== */

var devOpen = true;

function devBtn(label, action, kind, disabled) {
  return '<button class="da' + (kind ? " " + kind : "") + '" data-dev="' + action + '"' +
         (disabled ? ' disabled' : '') + '>' + label + '</button>';
}

function devActions() {
  if (S.screen !== "flow") {
    return { ctx: "Not in an onboarding flow.", groups: [] };
  }
  var r = R(), id = phaseId(), fm = r.role === "FM";
  var ctx = "<b>" + ROLE_META[r.role].name + "</b> · " + phases()[r.phaseIdx].title;
  var groups = [];

  if (id === "bgv") {
    groups.push({ title: "Background verification", html:
      devBtn("Mark BGV passed", "bgv:passed", "ok") +
      devBtn("Mark BGV failed", "bgv:failed", "bad") });
  }

  if (id === "ch") {
    if (fm) {
      if (!r.ch.category) {
        groups.push({ title: "Area Manager · set hub category", html:
          CATEGORY_ORDER.map(function (c) {
            var m = HUB_CATEGORIES[c];
            return devBtn(m.label + " · ceiling " + money(m.ceiling), "cat:" + c);
          }).join("") });
      } else {
        var m = HUB_CATEGORIES[r.ch.category];
        groups.push({ title: "Hub category (AM input)", html:
          '<p class="dnone">' + m.label + " · ceiling " + money(m.ceiling) +
          " · touchpoint " + money(m.tp) + '</p>' +
          devBtn("Clear hub category", "cat:clear") });

        if (r.ch.status === "escalated") {
          groups.push({ title: "Zonal Head decision", html:
            devBtn("Approve as ZH", "zh:approve", "ok") +
            devBtn("Reject as ZH", "zh:reject", "bad") });
        } else if (r.ch.status === "zh_rejected") {
          groups.push({ title: "Cluster Head rework", html:
            devBtn("Approve combined (within ceiling)", "ch:combined", "ok") +
            devBtn("Approve split (within ceiling)", "ch:split", "ok") +
            devBtn("Resubmit above benchmark → ZH", "ch:escalate", "warn") });
        } else if (r.ch.status !== "approved") {
          groups.push({ title: "Cluster Head decision", html:
            devBtn("Approve combined (within ceiling)", "ch:combined", "ok") +
            devBtn("Approve split (within ceiling)", "ch:split", "ok") +
            devBtn("Submit above benchmark → ZH", "ch:escalate", "warn") +
            devBtn("Reject", "ch:reject", "bad") });
        } else {
          groups.push({ title: "Cluster Head decision", html:
            '<p class="dnone">Approved' +
            (r.ch.decidedBy === "zh" ? " by Zonal Head" : " by Cluster Head") + '.</p>' +
            devBtn("Reject (send back)", "ch:reject", "bad") });
        }
      }
    } else {
      groups.push({ title: "Cluster Head decision", html:
        devBtn("Approve", "ch:approve", "ok") +
        devBtn("Reject", "ch:reject", "bad") });
    }
  }

  if (id === "sd" && !fm) {
    groups.push({ title: "Security deposit", html:
      devBtn("Force success", "sd:paid", "ok") +
      devBtn("Force failure", "sd:failed", "bad") +
      devBtn("Force quote expired", "sd:expired", "warn") });
  }

  if (id === "am" && !fm) {
    groups.push({ title: "Area Manager decision", html:
      devBtn("Approve", "am:approve", "ok") +
      devBtn("Reject (" + r.am.rejections + " of 2 used)", "am:reject", "bad") });
  }

  if (id === "act") {
    groups.push({ title: "Activation", html:
      devBtn("Force failure", "act:fail", "bad") +
      devBtn("Force success", "act:done", "ok") });
  }

  if (id === "ag") {
    groups.push({ title: "Agreements", html:
      devBtn("Mark agreement scrolled to end", "ag:read") });
  }

  if (!groups.length) {
    groups.push({ title: "This phase", html:
      '<p class="dnone">No backend actors act on this phase — it is entirely ' +
      'captain-driven.</p>' });
  }
  return { ctx: ctx, groups: groups };
}

function renderDev() {
  var host = document.getElementById("dev");
  if (!host) return;
  var d = devActions();

  var body = devOpen
    ? '<div class="db">' +
        '<p class="dctx">' + d.ctx + '</p>' +
        d.groups.map(function (g) {
          return '<div class="dgrp"><span>' + esc(g.title) + '</span>' + g.html + '</div>';
        }).join("") +
        '<button class="dreset" data-dev="reset">Reset entire demo</button>' +
      '</div>'
    : "";

  host.innerHTML =
    '<div class="dp">' +
      '<button class="dh" id="dev-toggle"><b>⚙ Simulate backend</b>' +
        '<i>' + (devOpen ? "hide" : "show") + '</i></button>' +
      body +
    '</div>';

  on("dev-toggle", "click", function () { devOpen = !devOpen; renderDev(); });
  Array.prototype.forEach.call(host.querySelectorAll("[data-dev]"), function (el) {
    el.addEventListener("click", function () { devDo(el.getAttribute("data-dev")); });
  });
}

function devDo(cmd) {
  var parts = cmd.split(":"), ns = parts[0], arg = parts[1];

  if (cmd === "reset") { A.resetAll(); return; }

  switch (ns) {
    case "bgv": A.bgvSet(arg); break;
    case "cat":
      if (arg === "clear") { R().ch.category = null; save(); render(); }
      else A.chSetCategory(arg);
      break;
    case "ch":
      if (arg === "approve")       A.chApprove("combined");
      else if (arg === "combined") A.chApprove("combined");
      else if (arg === "split")    A.chApprove("split");
      else if (arg === "escalate") A.chEscalate(R().ch.rateMode === "split" ? "split" : "combined");
      else if (arg === "reject")   A.chReject();
      break;
    case "zh":
      if (arg === "approve") A.zhApprove(); else A.zhReject();
      break;
    case "sd": A.sdSet(arg); break;
    case "am":
      if (arg === "approve") A.amApprove(); else A.amReject();
      break;
    case "ag": A.markAgreementRead(); break;
    case "act":
      if (arg === "fail") A.actFail();
      else { stopFanout(); A.finishActivation(); }
      break;
  }
}

/* =========================================================================
   BOOT
   ====================================================================== */

function boot() {
  app = document.getElementById("app");
  bindVehicleGlobals();
  load();
  if (S.screen === "flow" && !S.activeRole) S.screen = "roles";
  render();
  if (S.screen === "otp") startOtpTimer();
}

if (typeof window !== "undefined") {
  // Test surface — lets a headless run drive the app without simulating scroll,
  // timers or file pickers.
  window.__APP__ = {
    get state() { return S; },
    set state(v) { S = v; },
    actions: A,
    validate: V,
    errors: ERR,
    config: { PHASES: PHASES, HUB_CATEGORIES: HUB_CATEGORIES, FANOUT: FANOUT,
              SERVICEABLE: SERVICEABLE, VEHICLE_TYPES: VEHICLE_TYPES,
              VEHICLE_TYPES_RAW: VEHICLE_TYPES_RAW },
    helpers: {
      kycComplete: kycComplete, chCanDecide: chCanDecide, agCanActivate: agCanActivate,
      isAboveCeiling: isAboveCeiling, ceilingFor: ceilingFor, indicativeCaptainSplit: indicativeCaptainSplit,
      vehicleTonnage: vehicleTonnage, largestVehicle: largestVehicle,
      phaseId: phaseId, progressPct: progressPct, R: R, goPhase: goPhase,
      vehUI: function () { return vehUI; }
    },
    render: render,
    reset: resetAll,
    stopTimers: function () { stopOtpTimer(); stopFanout(); },
    STORE_KEY: STORE_KEY
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
</script>
