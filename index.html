  } else if (ch.status === "escalated") {
    inner = statusBlock("run", "Sent for Zonal Head approval",
        "Your proposed rate of " + money(ch.rate) + " needs Zonal Head sign-off. " +
        "We\u2019ll notify you at " + maskPhone(S.phone) + " when there\u2019s an update.") +
      rateCardPanel(r) +
      '<div class="tl">' +
        tlRow("ok", "Cluster Head: " + CH_CONTACT.name, "Reviewed and forwarded for approval.") +
        tlRow("now", "Zonal Head: " + ZH_CONTACT.name, "Above-benchmark rate approval pending.") +
        tlRow("", nextRowLabel(r), "Available once the Zonal Head approves.") +
      '</div>';
    side = sideDefault(r, chContactCard("zh"));

  } else if (ch.status === "zh_rejected") {
    inner = statusBlock("bad", "Zonal Head rejected the rate card",
        ch.reason || "The proposed rate is above what this hub category supports.") +
      rateCardPanel(r) +
      '<div class="notice bad"><b>What happens now</b>' +
        'Your Cluster Head will revise the rate card, or resubmit a revised case to the ' +
        'Zonal Head.</div>' +
      '<div class="tl">' +
        tlRow("bad", "Zonal Head: " + ZH_CONTACT.name, esc(ch.reason || "Rate rejected.")) +
        tlRow("now", "Cluster Head: " + CH_CONTACT.name, "Reworking the rate card.") +
      '</div>';
    side = sideDefault(r, chContactCard("zh"));

  } else if (ch.status === "rejected") {
    inner = statusBlock("bad", "Cluster Head rejected this request",
        ch.reason || "Your Cluster Head needs corrections before this can move forward.") +
      '<div class="notice bad"><b>Reason</b>' + esc(ch.reason || "Details need correction.") + '</div>' +
      '<div style="display:flex;gap:10px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="ch-back-pd">Edit personal details</button>' +
        '<button class="btn btn-primary" id="ch-resubmit">Resubmit for review</button></div>';
    side = sideDefault(r, chContactCard("ch"));

  } else {
    inner = statusBlock("run", "Cluster Head review in progress",
        CH_CONTACT.name.split(" ")[0] + " reviews your request from his panel — usually within 48 hours. " +
        "No need to wait here; we&rsquo;ll notify you at " + maskPhone(S.phone) + " when there&rsquo;s an update.") +
      (fm ? rateCardPanel(r) : "") +
      '<div class="tl">' +
        tlRow("ok", "Background verification passed", "Identity and risk checks cleared.") +
        tlRow("now", "Cluster Head: " + CH_CONTACT.name, "Phone: " + CH_CONTACT.phone) +
        tlRow("", nextRowLabel(r), "Available after approval.") +
      '</div>';
    side = sideDefault(r, chContactCard("ch"));
  }

  return {
    left: phaseHeader(r, "Cluster Head review", "Cluster Head is reviewing your request.") +
          cardWrap("Cluster Head review",
                   fm ? "Rate card review."
                      : "Cluster Head is reviewing your request.", inner),
    side: side
  };
}

var photoOpen = false;

/* Facility spec captured at hub details. For FM these feed the Area Manager's
   survey and, through it, the hub categorisation. */
/* Vehicle-type multi-select. Open/closed and the search text are view state, so
   they live here rather than in the persisted role data. The panel is patched in
   place on every interaction — a full render() would replace the search input and
   drop focus mid-typing. */
var vehUI = { open:false, filter:"" };

function vehSummaryHtml(max) {
  if (!max) return '<span class="ph">Select the largest vehicle</span>';
  return '<span class="ms-tok">' + esc(max) + '</span>' +
         '<span class="ms-more">' + vehicleTonnage(max) + ' MT</span>';
}

function vehCountText(max) {
  var n = smallerThan(max).length;
  if (!max) return VEHICLE_TYPES.length + " types, smallest first";
  return n ? n + " smaller " + (n === 1 ? "type" : "types") + " also fit" : "Smallest type";
}

function vehHintText(max, err) {
  if (err) return err;
  if (!max) {
    return "Pick only the largest vehicle that can reach, turn and dock here. " +
           "Everything smaller is assumed to fit.";
  }
  var n = smallerThan(max).length;
  return n
    ? "Max " + max + ". The " + n + " smaller " + (n === 1 ? "type" : "types") +
      " in the list are assumed to fit too."
    : "Max " + max + " — the smallest type on the list.";
}

/* Rows are ordered smallest to largest. Everything at or below the chosen row
   is shown as included, so the "and all smaller" rule is visible, not implied. */
function vehRows(max) {
  var q = vehUI.filter.trim().toLowerCase();
  var chosen = vehicleRank(max);
  var list = VEHICLE_TYPES.filter(function (v) {
    return !q || v.toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) {
    return '<div class="ms-empty">No vehicle type matches &ldquo;' + esc(vehUI.filter) + '&rdquo;.</div>';
  }
  return list.map(function (v) {
    var rank = vehicleRank(v);
    var isMax = chosen >= 0 && rank === chosen;
    var included = chosen >= 0 && rank < chosen;
    return '<button type="button" class="ms-row pick' +
             (isMax ? " on" : "") + (included ? " inc" : "") + '" ' +
             'data-veh="' + esc(v) + '" role="option" ' +
             'aria-selected="' + (isMax ? "true" : "false") + '">' +
             '<span class="mark">' + (isMax ? "●" : (included ? "✓" : "")) + '</span>' +
             '<span>' + esc(v) + '</span>' +
             '<i>' + (isMax ? "max" : (included ? "fits" : vehicleTonnage(v) + " MT")) + '</i>' +
           '</button>';
  }).join("");
}

function vehicleField(max, err) {
  return '<div class="fl"><label>Max vehicle size the location can accommodate</label>' +
    '<div class="ms" id="veh-ms">' +
      '<button type="button" id="veh-toggle" aria-expanded="' + (vehUI.open ? "true" : "false") + '" ' +
        'class="ms-control' + (err ? ' bad' : '') + (vehUI.open ? ' open' : '') + '">' +
        '<span class="ms-val">' + vehSummaryHtml(max) + '</span>' +
      '</button>' +
      '<div class="ms-panel" id="veh-panel"' + (vehUI.open ? '' : ' hidden') + '>' +
        '<input class="ms-search" id="veh-search" placeholder="Search vehicle types" ' +
          'value="' + esc(vehUI.filter) + '">' +
        '<div class="ms-list" id="veh-list" role="listbox">' + vehRows(max) + '</div>' +
        '<div class="ms-foot">' +
          '<button type="button" id="veh-none"' + (max ? '' : ' disabled') + '>Clear</button>' +
          '<span class="cnt" id="veh-count">' + esc(vehCountText(max)) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="hint' + (err ? ' err' : '') + '" id="veh-hint">' +
      esc(vehHintText(max, err)) + '</div></div>';
}

function paintVehicleOpen() {
  var ctrl = document.getElementById("veh-toggle");
  var panel = document.getElementById("veh-panel");
  if (!ctrl || !panel) return;
  panel.hidden = !vehUI.open;
  ctrl.classList.toggle("open", vehUI.open);
  ctrl.setAttribute("aria-expanded", vehUI.open ? "true" : "false");
  if (vehUI.open) {
    var sx = document.getElementById("veh-search");
    if (sx) sx.focus();
  }
}

function paintVehicleList() {
  var list = document.getElementById("veh-list");
  if (!list) return;
  list.innerHTML = vehRows(R().hub.maxVehicle || "");
  bindVehicleRows();
}

function hubSpecRows(h) {
  var area = h.areaSqft ? Number(h.areaSqft).toLocaleString("en-IN") + " sq ft" : "—";
  var maxV = h.maxVehicle || "";

         '<div class="row"><span class="k">Smaller types also accommodated</span>' +

           (maxV ? alsoFits + " of " + (VEHICLE_TYPES.length - 1) : "—") + '</span></div>';

function phaseHUB(r) {

/* =========================================================================
   ACTIONS
   ====================================================================== */

var A = {

  /* ---- auth ---- */
  submitPhone: function () {
    if (!V.phone(S.phone)) { S.loginError = ERR.phone; save(); render(); return; }
    S.loginError = ""; S.screen = "otp"; S.otp = ["","","","","",""];
    S.otpAttempts = 0; S.otpLocked = false; S.otpError = ""; S.otpSeconds = 25;
    save(); render(); startOtpTimer();
  },
  verifyOtp: function () {
    if (S.otpLocked) return;
    var code = S.otp.join("");
    if (code === "000000") {
      S.otpError = ""; stopOtpTimer();
      // An existing captain lands in the Captain Hub; a new one starts onboarding.
      S.screen = S.hubs.length ? "panel" : "roles";
      if (S.screen === "panel") { S.panel.section = "hubs"; S.panel.tab = "hubs"; }
      save(); render(); return;
    }
    S.otpAttempts++;
    if (S.otpAttempts >= 3) { S.otpLocked = true; S.otpError = ERR.otpLocked; }
    else S.otpError = ERR.otpWrong + " (" + (3 - S.otpAttempts) + " left)";
    S.otp = ["","","","","",""];
    save(); render();
  },
  resendOtp: function () {
    S.otpSeconds = 25; S.otpError = ""; S.otpAttempts = 0; S.otpLocked = false;
    save(); render(); startOtpTimer();
  },
  logout: function () {
    stopOtpTimer();
    S.screen = "login"; S.activeRole = null;
    S.otp = ["","","","","",""]; S.otpAttempts = 0; S.otpLocked = false; S.otpError = "";
    save(); render();
  },

  /* ---- role selection ---- */
  pickRole: function (code) {
    S.activeRole = code;
    var r = S.roles[code];
    if (!r.started) { r.started = true; r.requestId = makeRequestId(); }
    S.screen = "flow";
    save(); render();
  },
  switchRole: function () { S.screen = "roles"; save(); render(); },

  /* ---- personal details ---- */
  /* Accepts one pincode or many — comma, semicolon, pipe, slash or whitespace
     separated — so a captain can paste a list instead of adding them one at a
     time. Partial success is the normal case: valid entries are added and the
     rest are reported by reason. */
  addPincodes: function (raw) {
    var r = R(), pd = r.pd;
    pd.errors = {};
    pd.lastAdded = 0;

    var tokens = String(raw == null ? "" : raw).split(PIN_SPLIT)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });

    if (!tokens.length) { pd.errors.pincode = ERR.pincodeFormat; save(); render(); return; }

    var added = [], invalid = [], dupes = [], overflow = [], seen = {};
    tokens.forEach(function (t) {
      if (!V.pincode(t))                                   { invalid.push(t);  return; }
      if (seen[t] || pd.pincodes.indexOf(t) >= 0)          { dupes.push(t);    return; }
      if (pd.pincodes.length + added.length >= 5)          { overflow.push(t); return; }
      seen[t] = true;
      added.push(t);
    });

    if (added.length) {
      pd.pincodes = pd.pincodes.concat(added);
      // any new pincode invalidates a previous availability check
      pd.checked = false;
      pd.selected = null;
      pd.lastAdded = added.length;
    }

    if (invalid.length || dupes.length || overflow.length) {
      if (tokens.length === 1) {
        // one entry in, one precise message out
        pd.errors.pincode = invalid.length ? ERR.pincodeFormat
                          : dupes.length   ? ERR.pincodeDupe
                          :                  ERR.pincodeMax;
      } else {
        var why = [];
        if (invalid.length) {
          why.push(invalid.length + " not a valid pincode (" +
                   invalid.slice(0, 3).join(", ") + (invalid.length > 3 ? ", …" : "") + ")");
        }
        if (dupes.length)    why.push(dupes.length + " already added");
        if (overflow.length) why.push(overflow.length + " beyond the 5-pincode limit");
        pd.errors.pincode =
          (added.length ? "Added " + added.length + ". Skipped " : "Skipped ") + why.join("; ") + ".";
      }
    }
    save(); render();
  },
  /* Kept so single-value callers read naturally. */
  addPincode: function (val) { A.addPincodes(val); },
  removePincode: function (p) {
    var pd = R().pd;
    pd.pincodes = pd.pincodes.filter(function (x) { return x !== p; });
    if (pd.selected === p) pd.selected = null;
    pd.checked = false; pd.errors = {};
    save(); render();
  },
  checkAvailability: function () {
    var pd = R().pd;
    pd.checked = true; pd.selected = null;
    save(); render();
  },
  selectPincode: function (p) { R().pd.selected = p; save(); render(); },

  sendEmailOtp: function () {
    var pd = R().pd;
    pd.errors = {};
    if (!V.email(pd.email)) { pd.errors.email = ERR.email; save(); render(); return; }
    pd.emailOtpOpen = true; pd.emailOtpAttempts = 0;
    save(); render();
  },
  confirmEmailOtp: function (code) {
    var pd = R().pd;
    if (code === "000000") {
      pd.emailVerified = true; pd.emailOtpOpen = false; pd.errors = {};
    } else {
      pd.emailOtpAttempts++;
      if (pd.emailOtpAttempts >= 3) { pd.emailLocked = true; pd.emailOtpOpen = false; }
    }
    save(); render();
  },
  pdContinue: function () {
    var r = R(), pd = r.pd;
    pd.errors = {};
    if (!pd.name.trim())   pd.errors.name = "Name is required.";
    if (pd.altPhone && !V.phone(pd.altPhone)) pd.errors.altPhone = ERR.phone;
    if (!pd.emailVerified) pd.errors.email = "Verify your email before continuing.";
    if (!pd.selected)      pd.errors.pincode = "Select an available pincode.";
    if (Object.keys(pd.errors).length) { save(); render(); return; }
    r.hub.pincode = pd.selected;
    r.hub.city = cityFor(pd.selected);
    nextPhase();
  },

  /* ---- KYC ---- */
  aadhaarStart: function (val) {
    var k = R().kyc; k.errors = {};
    if (!V.aadhaar(val)) { k.errors.aadhaar = ERR.aadhaar; save(); render(); return; }
    k.aadhaar.value = val; k.aadhaar.otpOpen = true;
    save(); render();
  },
  aadhaarConfirm: function (code) {
    var k = R().kyc; k.errors = {};
    if (code !== "000000") { k.errors.aadhaar = ERR.otpWrong; save(); render(); return; }
    k.aadhaar.done = true; k.aadhaar.otpOpen = false;
    k.aadhaar.data = {
      name: R().pd.name || "Karan Verma",
      dob: "14 Aug 1990",
      address: "No. 42, 4th Cross, Koramangala, Bengaluru, Karnataka 560034"
    };
    k.ack.aadhaar = false;
    k.editing = null;
    save(); render();
  },
  panVerify: function (pan, father) {
    var k = R().kyc; k.errors = {};
    pan = (pan || "").toUpperCase().trim();
    if (!V.pan(pan))            k.errors.pan = ERR.pan;
    if (!(father || "").trim()) k.errors.panFather = ERR.panFather;
    if (Object.keys(k.errors).length) { k.pan.value = pan; k.pan.father = father || ""; save(); render(); return; }
    k.pan.value = pan; k.pan.father = father.trim(); k.pan.done = true;
    k.ack.pan = false; k.editing = null;
    save(); render();
  },
  bankVerify: function (acc, ifsc) {
    var k = R().kyc; k.errors = {};
    ifsc = (ifsc || "").toUpperCase().trim();
    if (!V.account(acc)) k.errors.account = ERR.account;
    if (!V.ifsc(ifsc))   k.errors.ifsc = ERR.ifsc;
    if (Object.keys(k.errors).length) { k.bank.acc = acc || ""; k.bank.ifsc = ifsc; save(); render(); return; }
    k.bank.acc = acc; k.bank.ifsc = ifsc; k.bank.pennyDone = true; k.bank.done = true;
    k.bank.holder = R().pd.name || "Karan Verma";      // returned by the penny-drop
    k.ack.bank = false; k.editing = null;
    save(); render();
  },
  gstSet: function (registered) {
    var k = R().kyc; k.errors = {};
    k.gst.registered = registered;
    if (registered === false) k.gst.done = false;
    save(); render();
  },
  gstVerify: function (gstin) {
    var r = R(), k = r.kyc; k.errors = {};

      k.gst.done = true; k.editing = null; save(); render(); return;

    k.gst.gstin = gstin; k.gst.registered = true; k.gst.done = true;

  uploadMsme: function () {

  },
  uploadCheque: function () {

  kycContinue: function () {

  /* ---- stepping back through the opening phases ---- */
  goBack: function () { prevPhase(); },
  /* Move past a confirmation screen onto the next record. */
  kycAck: function (id) {

  /* Jump back to the first record from the completed card. */
  kycShowBlocks: function () { A.kycReopen("aadhaar"); },
  /* Reopen one record for correction, keeping its values so the form prefills. */
  kycReopen: function (id) {

  /* GST is a two-way radio on KYC-11; the GSTIN field only appears once

  gstChoose: function (which) {

  },
  /* Optional location photo. Stored as a downscaled data URL — a full-size
     phone photo would blow the localStorage quota on its own. */
  setHubPhoto: function (dataUrl, name) {
    var h = R().hub;
    h.errors = h.errors || {};
    delete h.errors.photo;
    if (!dataUrl) { h.photo = ""; h.photoName = ""; save(); render(); return; }
    if (!/^data:image\//.test(dataUrl)) {
      h.errors.photo = ERR.photoType; save(); render(); return;
    }
    if (dataUrl.length > 2000000) {          // ~1.5 MB of image
      h.errors.photo = ERR.photoSize; save(); render(); return;

    h.photo = dataUrl;
    h.photoName = name || "location-photo.jpg";
    save(); render();
  },
  /* An image we cannot decode is refused rather than stored — otherwise the
     thumbnail renders as a broken image and the captain has no idea why. */
  rejectHubPhoto: function (msg) {

  },
  viewHubPhoto: function (open) { photoOpen = !!open; render(); },

  /* Reopen submitted hub details for correction. */
  hubEdit: function () {

    save(); render();
  },

  /* ---- BGV ---- */
  bgvSet: function (status) { R().bgv.status = status; save(); render(); },
  bgvContinue: function () {
    var r = R();

  bgvRetry: function () { R().bgv.status = "pending"; save(); render(); },

  /* ---- Cluster Head ---- */
  chSetCategory: function (cat) {

    save(); render();
  },
  chApprove: function (mode) {
    var r = R();
    if (!chCanDecide(r)) return;
    if (r.role === "FM") {
      var ceil = ceilingFor(r);
      r.ch.rateMode = mode || "combined";
      // A within-benchmark approval books the rate at the ceiling.
      if (r.ch.rate == null || r.ch.rate > ceil) r.ch.rate = ceil;
      r.ch.slab = r.ch.rate;
    }
    r.ch.status = "approved"; r.ch.decidedBy = "ch"; r.ch.reason = "";
    save(); render();
  },
  chEscalate: function (mode, rate) {
    var r = R();
    if (r.role !== "FM" || !chCanDecide(r)) return;
    var ceil = ceilingFor(r);
    r.ch.rateMode = mode || "combined";
    r.ch.rate = rate != null ? rate : +(ceil + 1.5).toFixed(2);
    r.ch.slab = r.ch.rate;
    r.ch.status = "escalated"; r.ch.decidedBy = null;
    save(); render();
  },
  chReject: function (reason) {
    var r = R();
    r.ch.status = "rejected";

  },
  chResubmit: function () {
    var r = R();

  },
  zhApprove: function () {

  zhReject: function (reason) {

  /* ---- security deposit (LM) ---- */
  sdSet: function (status) { R().sd.status = status; save(); render(); },

  sdRequote: function () { R().sd.status = "pending"; save(); render(); },

  /* ---- hub details ---- */
  /* Takes a field bag; anything omitted falls back to what is already in state,
     so callers can submit a partial update. */
  hubSubmit: function (f) {
    var r = R(), h = r.hub;
    f = f || {};
    var pick = function (k) { return f[k] !== undefined ? f[k] : h[k]; };
    var address  = pick("address"),  mapLink  = pick("mapLink"),
        areaSqft = pick("areaSqft"), manpower = pick("manpower"),
        maxVehicle = pick("maxVehicle");
    if (Array.isArray(maxVehicle)) {           // tolerate the older list shape
      maxVehicle = maxVehicle.reduce(function (b, v) {
        return vehicleRank(v) > vehicleRank(b) ? v : b; }, "");
    }

    h.errors = {};
    if (!String(address == null ? "" : address).trim()) h.errors.address = ERR.hubAddress;
    if (!V.mapLink(mapLink))      h.errors.mapLink  = ERR.mapLink;
    if (!V.hubArea(areaSqft))     h.errors.areaSqft = ERR.hubArea;
    if (!V.hubManpower(manpower)) h.errors.manpower = ERR.hubManpower;
    if (!V.vehicle(maxVehicle))   h.errors.maxVehicle = ERR.hubVehicle;

    // keep what was entered so the form redraws with the captain's own input
    h.address = address == null ? "" : address;
    h.mapLink = mapLink == null ? "" : mapLink;
    h.areaSqft = areaSqft == null ? "" : String(areaSqft).trim();
    h.manpower = manpower == null ? "" : String(manpower).trim();
    h.maxVehicle = String(maxVehicle == null ? "" : maxVehicle).trim();

    if (Object.keys(h.errors).length) { save(); render(); return; }
    h.pincode = r.pd.selected || h.pincode;
    h.city = cityFor(h.pincode);
    h.submitted = true;
    // LM gets its hub code at submit. FM does not — it is issued during
    // design & hub-code mapping at activation.
    if (r.role === "LM") h.hubCode = h.hubCode || makeHubCode();
    save(); render();
  },
  /* Vehicle picker. Selection is kept in VEHICLE_TYPES order so the summary and
     the derived largest type never depend on click order. */
  /* One input: the largest vehicle the hub can take. Everything below it in
     the ascending list is implied, so there is nothing else to tick. */
  setMaxVehicle: function (v) {
    var h = R().hub;
    if (v && !V.vehicle(v)) return;

    save(); render();
  },
  openVehicles: function (open) {

  },
  hubContinue: function () {
    var r = R();
    if (!r.hub.submitted) return;
    /* Hub details now sits early in the flow, so a captain sent back here by an
       Area Manager rejection must return to the AM — not walk forward through
       phases they have already cleared. */
    if (r.hub.returnTo) {
      var back = r.hub.returnTo;

  },

  /* ---- Area Manager (LM) ---- */
  amApprove: function () {
    var r = R();
    if (r.role !== "LM") return;
    r.am.status = "approved"; r.am.reason = "";
    save(); render();
  },
  amReject: function (reason) {
    var r = R();
    if (r.role !== "LM") return;
    r.am.rejections++;
    r.am.reason = reason || "Facility did not meet requirements.";
    // Two-strike rule: the second rejection leaves the AM and goes to the CH.
    if (r.am.rejections >= 2) { r.am.status = "escalated"; r.am.escalated = true; }
    else r.am.status = "rejected";
    save(); render();
  },
  amContinue: function () {
    var r = R();
    if (r.am.status !== "approved") return;
    nextPhase();
  },

  /* ---- agreements ---- */
  markAgreementRead: function () {

    save(); render();
  },
  setRateAccepted: function (v) { R().ag.rateAccepted = !!v; save(); render(); },
  setServiceAccepted: function (v) {

  activate: function () {

    nextPhase();
    runFanout();

  /* ---- activation ---- */
  actFail: function () {
    var r = R();
    if (r.act.status === "active") return;
    stopFanout();
    r.act.status = "failed"; r.act.failed = true;
    save(); render();
  },
  actRetry: function () {
    var r = R();
    r.act.status = "running"; r.act.failed = false; r.act.done = {};
    save(); render();
    runFanout();
  },
  finishActivation: function () {
    var r = R();
    var list = FANOUT[r.role];
    list.forEach(function (f) { r.act.done[f.id] = true; });
    if (r.role === "FM") {
      r.act.partnerId = r.act.partnerId || makePartnerId();
      // FM hub code is minted by design & hub-code mapping, not at hub submit.
      r.hub.hubCode = r.hub.hubCode || makeHubCode();
    } else {
      r.act.vendorId = r.act.vendorId || makeVendorId();
    }
    r.act.status = "active";
    r.act.failed = false;
    r.act.activatedOn = new Date().toLocaleString("en-IN",
      { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
    r.complete = true;

    /* Onboarding produces a hub the captain then owns, and fills in the
       captain-level record the Captain Hub reads from. */
    if (!S.profile.name) {
      S.profile = {
        name: r.pd.name, email: r.pd.email, altPhone: r.pd.altPhone,
        aadhaar: r.kyc.aadhaar.value, pan: r.kyc.pan.value,
        bank: { bankName:"HDFC Bank", acc:r.kyc.bank.acc, ifsc:r.kyc.bank.ifsc,
                holder:r.pd.name, verified:true }
      };
    }
    var gst = r.newHubGst || { registered: !!r.kyc.gst.registered, gstin: r.kyc.gst.gstin || "" };
    var hub = makeHub({
      code: r.hub.hubCode, name: (r.pd.selected || "New") + " Hub", role: r.role,
      address: r.hub.address, pincode: r.hub.pincode, city: r.hub.city,
      status: "active", gst: gst,
      areaSqft: r.hub.areaSqft, manpower: r.hub.manpower,
      maxVehicle: r.hub.maxVehicle || "",
      photo: r.hub.photo || "", photoName: r.hub.photoName || "",
      category: r.ch.category, activatedOn: r.act.activatedOn
    });
    // replace the in-progress placeholder for this role, if one was listed
    S.hubs = S.hubs.filter(function (h) {
      return !(h.status === "in_progress" && h.role === r.role);
    });
    S.hubs.push(hub);
    S.activeHubId = hub.id;

    save(); render();
  },

  /* ---- Captain Hub: navigation ---- */
  openPanel: function (section, tab) {

  bankEditStart: function () {

  },
  bankCancel: function () { S.panel.bank = blankPanel().bank; save(); render(); },
  bankOtp: function (code) {

      bk.step = "form"; bk.error = ""; bk.otp = "";
      bk.draft = { acc:"", ifsc:"", holder:S.profile.name || "" };
    } else {

  bankSubmit: function (acc, ifsc, holder) {

    bk.error = ""; bk.errField = "";
    if (!V.account(bk.draft.acc))      { bk.errField = "acc";    bk.error = ERR.account; }
    else if (!V.ifsc(bk.draft.ifsc))   { bk.errField = "ifsc";   bk.error = ERR.ifsc; }
    else if (!bk.draft.holder.trim())  { bk.errField = "holder"; bk.error = "Account holder name is required."; }
    if (bk.error) { save(); render(); return; }
    bk.step = "verifying";

  },
  /* Dev panel drives the penny-drop outcome — there is no real bank here. */
  bankPennyResult: function (ok, reason) {

    if (bk.step !== "verifying") return;
    if (ok) {
      S.profile.bank = {
        bankName:"HDFC Bank", acc:bk.draft.acc, ifsc:bk.draft.ifsc,

      bk.step = "failed";

  bankBackToForm: function () { S.panel.bank.step = "form"; save(); render(); },

  /* ---- HB-02…HB-06: per-hub GSTIN ---- */
  gstOpen: function (hubId) {
    var h = hubById(hubId);
    if (!h) return;
    S.panel.gst = { hubId:hubId, mode:"edit", value:h.gst.gstin || "", error:"" };

  gstCancel: function () { S.panel.gst = blankPanel().gst; save(); render(); },
  gstSave: function (value) {

  addHubOpen: function () {

    S.panel.section = "addhub";
    S.panel.addHub = Object.assign(blankPanel().addHub, {
      role:"LM",
      choice: known.length ? "existing" : "new",

    });

  addHubRole: function (role) {
    var a = S.panel.addHub;
    a.role = role;
    // FM hubs must be GST registered — drop a Non-GST choice if the role flips.
    if (role === "FM" && a.choice === "none") a.choice = knownGstins().length ? "existing" : "new";
    a.error = "";
    save(); render();
  },
  addHubChoice: function (choice) {
    var a = S.panel.addHub;
    if (choice === "none" && a.role === "FM") return;     // not offered for FM
    if (choice === "existing" && !knownGstins().length) return;
    if (a.choice === choice) return;                      // no needless re-render
    a.choice = choice; a.error = "";
    save(); render();
  },
  addHubExisting: function (g) { S.panel.addHub.existing = g; save(); },

  /* Create the draft hub and drop the captain into the ORIGINAL onboarding flow.
     Personal details, KYC and BGV are captain-level and already done, so they are
     carried over and marked complete; the journey starts at Cluster Head review,
     which is the first hub-specific phase for both roles. */
  addHubContinue: function () {
    var a = S.panel.addHub, pr = S.profile;
    a.error = "";

    var gst;
    if (a.choice === "existing") {
      if (!a.existing) { a.error = "Pick a GSTIN to map to this hub."; save(); render(); return; }
      gst = { registered:true, gstin:a.existing };
    } else if (a.choice === "new") {
      var g = (a.gstin || "").toUpperCase().trim();
      if (!V.gstin(g)) { a.error = ERR.gstin; save(); render(); return; }
      gst = { registered:true, gstin:g };
    } else {
      if (a.role === "FM") { a.error = ERR.gstRequired; save(); render(); return; }
      gst = { registered:false, gstin:"" };
    }

    var role = a.role;
    var r = blankRole(role);
    r.started = true;
    r.requestId = makeRequestId();
    r.addingHub = true;

    // carry the captain-level record forward
    r.pd = Object.assign(r.pd, {
      name: pr.name, email: pr.email, altPhone: pr.altPhone,
      emailVerified: true, pincodes: [], checked: false, selected: null
    });
    r.kyc.aadhaar = { done:true, value:pr.aadhaar, otpOpen:false };
    r.kyc.pan     = { done:true, value:pr.pan, father:"Suresh Verma" };
    r.kyc.bank    = { done:true, acc:pr.bank.acc, ifsc:pr.bank.ifsc, pennyDone:true };
    r.kyc.gst     = { registered:gst.registered, gstin:gst.gstin, done:true };
    r.kyc.msme    = { done:false, fileName:"" };          // optional, not carried
    r.bgv.status  = "passed";
    r.newHubGst   = gst;
    // these are captain-level and already done — never walk them again
    r.carried     = { pd:true, kyc:true, bgv:true };

    // start at hub details — the first phase that is about this hub
    var idx = 0;
    PHASES[role].forEach(function (p, i) { if (p.id === "hub") idx = i; });
    r.phaseIdx = idx;

    S.roles[role] = r;
    S.activeRole = role;
    S.screen = "flow";
    save(); render();
  },

  /* HB-08 — resume a hub still mid-onboarding. */
  resumeHub: function (hubId) {
    var h = hubById(hubId);
    if (!h || h.status !== "in_progress") return;
    S.activeRole = h.role;
    S.screen = "flow";
    save(); render();
  },

  resetAll: resetAll
};

/* Fan-out animation. Tests call finishActivation() directly instead of waiting. */
var fanTimers = [];
function stopFanout() { fanTimers.forEach(clearTimeout); fanTimers = []; }
function runFanout() {
  stopFanout();
  var r = R(), role = S.activeRole, list = FANOUT[r.role];
  list.forEach(function (f, i) {
    fanTimers.push(setTimeout(function () {
      var rr = S.roles[role];
      if (rr.act.status !== "running") return;
      rr.act.done[f.id] = true;
      if (i === list.length - 1) {
        var keep = S.activeRole; S.activeRole = role;
        A.finishActivation();
        S.activeRole = keep;
      } else { save(); render(); }
    }, 420 * (i + 1)));
  });
}

/* OTP countdown.
   The tick patches just the countdown text. A full render() here would replace
   app.innerHTML every second, destroying the OTP inputs and dropping focus —
   which makes the field untypeable while the countdown is running. */
function paintOtpCountdown() {
  var el = document.getElementById("otp-countdown");
  if (el) el.textContent = "Resend OTP in " + S.otpSeconds + " s";
}
function startOtpTimer() {
  stopOtpTimer();
  otpTimer = setInterval(function () {
    if (S.screen !== "otp") { stopOtpTimer(); return; }
    S.otpSeconds--;
    if (S.otpSeconds <= 0) {
      S.otpSeconds = 0;
      stopOtpTimer();
      render();          // one full render, to swap the countdown for "Resend OTP"
      return;
    }
    paintOtpCountdown();
  }, 1000);
}
function stopOtpTimer() { if (otpTimer) { clearInterval(otpTimer); otpTimer = null; } }

  on("go-otp", "click", A.submitPhone);

  /* otp */
  /* OTP cells are patched in place rather than re-rendered, so the focused cell
     survives. A full render() here would drop focus and make the row untypeable. */
  function otpCell(i) { return document.querySelector('.otp-cell[data-i="' + i + '"]'); }
  function paintOtpCells() {
    for (var i = 0; i < 6; i++) {
      var c = otpCell(i);
      if (c && c.value !== S.otp[i]) c.value = S.otp[i];
    }
    var vb = document.getElementById("verify-otp");
    if (vb) vb.disabled = !S.otp.every(function (x) { return x !== ""; });
  }
  /* Spread a run of digits across the cells starting at `from`. This is the
     SMS-autofill and paste path: the whole code arrives in a single cell. */
  function fillOtpFrom(from, digits) {
    for (var k = 0; k < digits.length && from + k < 6; k++) S.otp[from + k] = digits[k];
    paintOtpCells();
    var land = otpCell(Math.min(from + digits.length, 5));
    if (land) land.focus();
  }
  A.fillOtpFrom = fillOtpFrom;

  Array.prototype.forEach.call(document.querySelectorAll(".otp-cell[data-i]"), function (el) {
    el.addEventListener("input", function (e) {
      var i = +el.getAttribute("data-i");
      var raw = (e.target.value || "").replace(/\D/g, "");
      S.otpError = "";
      if (raw.length > 1) { fillOtpFrom(i, raw); return; }
      S.otp[i] = raw;
      e.target.value = raw;
      paintOtpCells();
      if (raw && i < 5) { var nx = otpCell(i + 1); if (nx) nx.focus(); }
    });
    el.addEventListener("paste", function (e) {
      var cb = e.clipboardData || window.clipboardData;
      if (!cb) return;
      var digits = (cb.getData("text") || "").replace(/\D/g, "");
      if (!digits) return;
      e.preventDefault();
      fillOtpFrom(+el.getAttribute("data-i"), digits);
    });
    el.addEventListener("keydown", function (e) {
      var i = +el.getAttribute("data-i");
      if (e.key === "Backspace" && !el.value && i > 0) {
        var pv = otpCell(i - 1);

    });

/* Read a picked image and hand a downscaled data URL to the action. Falls back
   to the raw result if canvas is unavailable. */
function readHubPhoto(file) {
  if (!/^image\//.test(file.type || "")) { A.rejectHubPhoto(ERR.photoType); return; }
  var reader = new FileReader();
  reader.onerror = function () { A.rejectHubPhoto(ERR.photoUnreadable); };
  reader.onload = function (ev) {
    var raw = ev.target.result;
    var img = new Image();
    img.onload = function () {
      try {
        var max = 640, scale = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        A.setHubPhoto(c.toDataURL("image/jpeg", 0.72), file.name);
      } catch (err) {
        // canvas unavailable — keep the original, it decoded fine
        A.setHubPhoto(raw, file.name);
      }
    };
    // decoded nothing: refuse it rather than showing a broken thumbnail
    img.onerror = function () { A.rejectHubPhoto(ERR.photoUnreadable); };
    img.src = raw;
  };
  reader.readAsDataURL(file);
}

var devOpen = true;

function devBtn(label, action, kind, disabled) {
  return '<button class="da' + (kind ? " " + kind : "") + '" data-dev="' + action + '"' +
         (disabled ? ' disabled' : '') + '>' + label + '</button>';
}

function devActions() {
  /* Login / OTP: choose who is signing in. This is the only place the prototype
     decides between a first-time captain and one who already operates hubs. */
  if (S.screen === "login" || S.screen === "otp") {
    return {
      ctx: "Signing in · <b>" + (S.loginAs === "existing" ? "existing captain" : "new captain") + "</b>",
      groups: [{
        title: "Log in as",
        html:
          devBtn("New captain · no hubs yet", "as:new", S.loginAs === "new" ? "ok" : "") +
          devBtn("Existing captain · 3 hubs", "as:existing", S.loginAs === "existing" ? "ok" : "") +
          '<p class="dnone">A new captain lands on role selection and onboards. ' +
          'An existing captain lands in the Captain Hub with hubs already active.</p>'
      }]
    };
  }

  if (S.screen === "roles") {
    return { ctx: "Choosing a role.", groups: [] };
  }

  /* Captain Hub */
  if (S.screen === "panel") {
    var bk = S.panel.bank, groups = [];
    if (bk.open && bk.step === "verifying") {
      groups.push({ title: "Bank penny-drop", html:
        devBtn("Penny-drop succeeded", "bank:ok", "ok") +
        devBtn("Penny-drop failed", "bank:fail", "bad") });
    } else if (bk.open) {

        '<p class="dnone">Step: ' + esc(bk.step) + '. The penny-drop outcome is simulated ' +
        'once the new account is submitted.</p>' });
    } else {

        '<p class="dnone">No backend actors act here — profile and hub edits are ' +
        'captain-driven. Add a hub to re-enter onboarding.</p>' });
    }
    return { ctx: "<b>Captain Hub</b> · " + esc(S.panel.section), groups: groups };
  }

    return { ctx: "Not in an onboarding flow.", groups: [] };
  }
  var r = R(), id = phaseId(), fm = r.role === "FM";
  var ctx = "<b>" + ROLE_META[r.role].name + "</b> · " + phases()[r.phaseIdx].title;
  var groups = [];

function devDo(cmd) {
  var parts = cmd.split(":"), ns = parts[0], arg = parts[1];

  if (cmd === "reset") { A.resetAll(); return; }

  switch (ns) {
    case "as":
      S.loginAs = arg;
      if (arg === "existing") { seedExistingCaptain(); }
      else { S.profile = blankProfile(); S.hubs = []; S.activeHubId = null;
             S.roles = { LM: blankRole("LM"), FM: blankRole("FM") }; }
      save(); render();
      break;
    case "bank":
      A.bankPennyResult(arg === "ok", arg === "ok" ? "" :
        "Name on the account did not match your KYC records.");
      break;
    case "bgv": A.bgvSet(arg); break;
    case "cat":
      if (arg === "clear") { R().ch.category = null; save(); render(); }
      else A.chSetCategory(arg);
      break;
    case "ch":
      if (arg === "approve")       A.chApprove("combined");
      else if (arg === "combined") A.chApprove("combined");
      else if (arg === "split")    A.chApprove("split");
      else if (arg === "escalate") A.chEscalate(R().ch.rateMode === "split" ? "split" : "combined");
      else if (arg === "reject")   A.chReject();
      break;
    case "zh":
      if (arg === "approve") A.zhApprove(); else A.zhReject();
      break;
    case "sd": A.sdSet(arg); break;
    case "am":
      if (arg === "approve") A.amApprove(); else A.amReject();
      break;
    case "ag": A.markAgreementRead(); break;
    case "act":
      if (arg === "fail") A.actFail();
      else { stopFanout(); A.finishActivation(); }
      break;
  }
}

/* =========================================================================
   BOOT
   ====================================================================== */

function boot() {
  app = document.getElementById("app");
  bindVehicleGlobals();
  load();
  if (S.screen === "flow" && !S.activeRole) S.screen = "roles";
  render();
  if (S.screen === "otp") startOtpTimer();
}

if (typeof window !== "undefined") {
  // Test surface — lets a headless run drive the app without simulating scroll,
  // timers or file pickers.
  window.__APP__ = {
    get state() { return S; },
    set state(v) { S = v; },
    actions: A,
    validate: V,
    errors: ERR,
    config: { PHASES: PHASES, HUB_CATEGORIES: HUB_CATEGORIES, FANOUT: FANOUT,
              SERVICEABLE: SERVICEABLE, VEHICLE_TYPES: VEHICLE_TYPES,
              VEHICLE_TYPES_RAW: VEHICLE_TYPES_RAW },
    helpers: {
      kycComplete: kycComplete, chCanDecide: chCanDecide, agCanActivate: agCanActivate,
      isAboveCeiling: isAboveCeiling, ceilingFor: ceilingFor, indicativeCaptainSplit: indicativeCaptainSplit,
      vehicleTonnage: vehicleTonnage, vehicleRank: vehicleRank,
      impliedVehicles: impliedVehicles, smallerThan: smallerThan,
      phaseId: phaseId, progressPct: progressPct, R: R, goPhase: goPhase,
      canGoBack: canGoBack, backLabel: backLabel, kycStep: kycStep,
      vehUI: function () { return vehUI; },
      activeHub: activeHub, hubById: hubById, knownGstins: knownGstins,
      seedExistingCaptain: seedExistingCaptain
    },
    render: render,
    reset: resetAll,
    stopTimers: function () { stopOtpTimer(); stopFanout(); },
    STORE_KEY: STORE_KEY
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
}
</script>
