                       : a.tab === "bulk" ? apBulkUpdate()
                       : apList());
  return apShell(body);
}

/* An update set out for review: the card in force against the proposed one,

function ruCompareHtml(u) {
  var cm = HUB_CATEGORIES[u.toCategory], fromCm = HUB_CATEGORIES[u.fromCategory], above = ruAbove(u);
  var phase = ruPhase(u), typeOnly = sameRateCard(u.from, u.to);

  };

    '<div class="kv" style="margin-bottom:16px" data-testid="ru-checks">' +
      row("Hub type", u.toCategory !== u.fromCategory
        ? esc(fromCm ? fromCm.label : "-") + ' → <b>' + esc(cm ? cm.label : "-") + '</b>' +
          ' <span class="mute">· takes effect on ' + esc(fmtIso(u.effectiveFrom)) + '</span>'
        : esc(cm ? cm.label : "-") + ' <span class="mute">· unchanged</span>') +
      row("Ceilings", cm ? (above ? 'Above the ' + esc(cm.label) + ' ceilings' : 'Within the ' + esc(cm.label) +
          ' ceilings') + ' <span class="mute">· slabs ' + esc(ceilingText(u.toCategory, hubCity(h))) +
          ' in ' + esc(cityKey(hubCity(h)) || "-") + ', touchpoint fixed at ₹' + esc(fixedTp(u.toCategory, hubCity(h))) +
          '</span>' : '-', above ? 'bad' : 'ok') +
      row("Rates", typeOnly ? 'Unchanged. Only the hub type moves, so the captain isn’t asked to agree'
                            : 'Changed. The captain agrees before it applies') +
      row("Applies from", esc(fmtIso(u.effectiveFrom)) +
        (phase === "scheduled" ? ' <span class="mute">· scheduled</span>'

         : phase === "past" ? ' <span class="mute">· since superseded</span>'

      (u.status === "captain" && u.notice

/* Slab settings ----------------------------------------------------------------
   The slab structure for each hub type. FM Central Ops proposes a change and
   BizFin approves it; BizFin can save one directly. New rate cards and updates
   are priced on it from then; cards already priced keep their slabs. */
function apSlabSettings() {
  var a = S.admin, ss = S.slabSettings, biz = a.central === "bizfin";
  var type = HUB_CATEGORIES[a.slabType] ? a.slabType : CATEGORY_ORDER[0];
  var d = a.slabDraft && a.slabDraft.type === type ? a.slabDraft : { type:type, breaks:slabBreaks(type).slice(), all:false };
  var pending = ss.requests.filter(function (x) { return x.status === "pending"; });
  var mine = pending[0];
  var typeBtns = CATEGORY_ORDER.map(function (k) {
    return '<button data-slabtype="' + k + '"' + (k === type ? ' class="on"' : '') + '>' +
      esc(HUB_CATEGORIES[k].label) + '</button>';
  }).join("");
  var n = d.breaks.length;
  var rows = bandsFor(d.breaks.map(function (b) { return +b || 0; })).map(function (b, i) {
    var last = i === n;
    return '<tr data-testid="slab-set-row"><td class="id">Slab ' + (i + 1) + '</td>' +
      '<td>' + esc(fmtOrders(b.from)) + '</td>' +
      '<td>' + (last ? '<span class="mute">and above</span>'

/* Bulk rate card update --------------------------------------------------------
   FM Central Ops lists FM hub codes and sets one rate card for them all. Within
   each hub's ceilings it publishes at once, no approval needed; above them it
   goes to BizFin. Hubs not onboarded through the tool — no signed onboarding
   agreement — are left out, along with anything else that can't take it. */
function blankBulk() {
  return { codes:"", rates:[], effectiveFrom:addDaysIso(todayIso(), 1) };
}
function bulkPlan(b) {
  var codes = [];
  parseCodes(b.codes).forEach(function (c) { if (codes.indexOf(c) < 0) codes.push(c); });
  var hubs = amHubs(true), bands = null;
  var rows = codes.map(function (code) {
    var h = hubs.filter(function (x) { return x.code === code; })[0], why = "", open;
    if (!h) why = LEGACY_FM_HUBS[code] ? "Not onboarded through the tool yet, so its onboarding agreement isn’t signed"
                                       : "No hub with this code";
    else if (h.role !== "FM") why = "Not an FM hub";
    else if (h.status !== "active") why = "The hub isn’t active";
    else if (!h.rateCard) why = "No rate card yet";
    else if ((open = rateUpdateFor(h.id))) {
      why = (ruPhase(open) === "scheduled" ? "An update is already scheduled (" : "An update is already in review (") +
            open.id + ")";
    }
    if (!why) {
      var hb = slabBands(h.category);
      if (!bands) bands = hb;
      else if (!sameBands(bands, hb)) why = "Its hub type is on a different slab structure";
    }
    return { code:code, h:h || null, name:h ? h.name : (LEGACY_FM_HUBS[code] || ""), why:why };
  });
  bands = bands || slabBands(null);
  var complete = bands.every(function (bd, i) { return rateOk(b.rates[i]); });
  rows.forEach(function (row) {
    if (row.why) return;
    /* the touchpoint isn't part of a bulk update — each hub keeps its type's */
    row.card = { slabs:bands.map(function (bd, i) {
                   return { from:bd.from, to:bd.to, rate:String(b.rates[i] == null ? "" : b.rates[i]).trim() }; }),
                 touchpoint:fixedTp(row.h.category, hubCity(row.h)) };
    if (complete && sameRateCard(row.card, row.h.rateCard)) { row.why = "Same as its rates today"; return; }
    row.above = cardAbove(row.h.category, hubCity(row.h), row.card);
  });
  return { codes:codes, rows:rows, bands:bands, complete:complete,
           publish:rows.filter(function (x) { return !x.why && !x.above; }),
           bizfin:rows.filter(function (x) { return !x.why && x.above; }),
           out:rows.filter(function (x) { return !!x.why; }) };
}

  return '<div class="ap-panel" data-testid="ap-bulk" style="margin-bottom:20px">' +

/* Every live FM hub under the Area Manager and where its rate card stands —
   anything sent back to them first, then what is in review or scheduled. */
function apRateList() {
  var a = S.admin, q = String(a.rateSearch || "").trim().toLowerCase(), f = a.rateFilter || "all";
  var all = rateHubs().map(function (h) { return { h:h, u:rateUpdateFor(h.id), o:hubOwner(h) }; });
  var st = function (x) { return x.u ? ruPhase(x.u) : "live"; };
  var cnt = function (list) { return all.filter(function (x) { return list.indexOf(st(x)) >= 0; }).length; };
  var rank = { revision:0, ch:1, zh:1, central:1, captain:2, scheduled:3, live:4 };
  var shown = all.filter(function (x) {
    var s0 = st(x);
    if (f === "revision" && s0 !== "revision") return false;
    if (f === "review" && s0 !== "ch" && s0 !== "zh" && s0 !== "central") return false;
    if (f === "captain" && s0 !== "captain") return false;
    if (f === "scheduled" && s0 !== "scheduled") return false;
    if (f === "live" && s0 !== "live") return false;
    var cat = HUB_CATEGORIES[x.h.category];
    return apMatches(q, [x.h.code, x.h.name, x.o.name, x.o.phone, x.h.pincode, cat ? cat.label : ""], x.o.phone);
  }).sort(function (x, y) { return (rank[st(x)] - rank[st(y)]) || (x.h.code < y.h.code ? -1 : 1); });

  var body = shown.length
    ? shown.map(function (x) {
        var h = x.h, u = x.u, cat = HUB_CATEGORIES[h.category];
        return '<tr data-testid="ap-rate-row" data-ratehub="' + esc(h.id) + '" data-status="' + st(x) + '">' +
          '<td class="id">Hub ' + esc(h.code) + apSub(esc(h.name)) + '</td>' +
          '<td>' + esc(x.o.name) + apSub(esc(x.o.phone)) + '</td>' +
          '<td>' + esc(cat ? cat.label : "-") + '</td>' +
          '<td style="max-width:260px;white-space:normal">' + esc(rateSummary(h.rateCard)) +
            apSub('v' + (h.rateCard.version || 1) + ' · in force since ' + esc(fmtIso(h.rateCard.effectiveFrom))) + '</td>' +
          '<td>' + (u ? ruStatusCell(u) : '<span class="st green">In force</span>') + '</td>' +
          '<td style="text-align:right"><button class="btn ' + (u && u.status !== "revision" ? 'btn-ghost' : 'btn-primary') +
            '" data-aprate="' + esc(h.id) + '">' +
            (!u ? "Update rate card" : u.status === "revision" ? "Revise" : "View") + '</button></td></tr>';
      }).join("")
    : '<tr><td class="empty" colspan="6">' +
        (all.length ? 'No hubs match this filter.' : 'No live FM hubs with a rate card yet.') + '</td></tr>';

  var opt = function (v, label) {
    return '<option value="' + v + '"' + (f === v ? ' selected' : '') + '>' + label + '</option>';
  };
  return '<div class="ap-stats" data-testid="ap-rate-stats">' +
      apStatTile("blue", "FM hubs under you", all.length, "Each with a rate card in force") +
      apStatTile("blue", "In review", cnt(["ch", "zh", "central"]), "With the CH, the ZH or BizFin") +
      apStatTile("amber", "With captains", cnt(["captain"]), "Approved, waiting for them to agree") +
      apStatTile("amber", "Scheduled", cnt(["scheduled"]), "Agreed, applying from a later day") +
      apStatTile("red", "Sent back to you", cnt(["revision"]), cnt(["revision"]) ? "Revise or withdraw" : "Nothing to revise") +
    '</div>' +
    '<div class="ap-panel">' +
      '<div class="ph"><div><b>Rate card updates</b>' +
        '<span>Change a hub’s rates, or its hub type, from a day you pick. Every update goes to the Cluster Head ' +
        'and the Zonal Head (and on to BizFin above the ceilings). Once approved it goes to the captain, in the app and by SMS and ' +
        'email; when they agree it’s published, and it applies from that day.</span></div>' +
        '<div class="ap-filters">' +
          '<input id="ap-rate-search" placeholder="Search hub, captain, phone, hub type" value="' +
            esc(a.rateSearch || "") + '">' +
          '<select id="ap-rate-filter">' + opt("all", "All FM hubs") + opt("revision", "Sent back to you") +
            opt("review", "In review") + opt("captain", "With the captain") + opt("scheduled", "Scheduled") +
            opt("live", "No open update") +
          '</select>' +
        '</div></div>' +
      '<table class="ap-table"><thead><tr>' +
        '<th>Hub</th><th>Captain</th><th>Hub type</th><th>Rate card in force</th><th>Status</th>' +
        '<th style="text-align:right">Action</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table>' +
    '</div>';
}

/* A desk's rate card updates: what is waiting on it, and what it decided that
   is still pending further along. FM Central Ops works the Cluster Head's. */
/* The desk an update is waiting on, who sits there, and since when. */
function ruWaitingOn(u) {
  var c = ruChain(u), p = ruPhase(u);
  return p === "ch" ? { desk:"ch", label:"With CH", tone:"blue", name:c.ch.name, since:u.sentOn }
       : p === "zh" ? { desk:"zh", label:"With ZH", tone:"blue", name:c.zh.name, since:u.chApprovedOn || u.sentOn }
       : p === "central" ? { desk:"bizfin", label:"With BizFin", tone:"amber", name:"BizFin", since:u.raisedOn || u.sentOn }
       : p === "revision" ? { desk:"am", label:"With AM", tone:"red", name:c.am.name, since:u.rejectedOn }
       : p === "captain" ? { desk:"captain", label:"With captain", tone:"amber", name:u.captain,
                             since:u.sentToCaptainOn || u.approvedOn }
       : null;
}
function daysSince(day) {
  var iso = isoFromDay(day);
  if (!iso) return "";
  var n = Math.round((new Date(todayIso() + "T00:00:00") - new Date(iso + "T00:00:00")) / 864e5);
  return n <= 0 ? "today" : n === 1 ? "1 day" : n + " days";
}
/* Design A: the Status cell names the one person who has to act. */
function ruWaitingCell(u) {
  var w = ruWaitingOn(u);
  if (!w) return ruStatusCell(u);
  var age = daysSince(w.since);
  return '<span class="st ' + w.tone + '">' + w.label + '</span>' +
    apSub(esc(w.name) + (age ? ' · ' + esc(age) : ''));
}
function apRateQueue(desks) {
  var a = S.admin, ops = a.role === "central" && a.central === "ops", biz = desks.indexOf("central") >= 0;
  var f = { am:a.ruAm, ch:a.ruCh, zh:a.ruZh };
  var shown = function (u) { var c = ruChain(u); return onMyPatch(c.amId) && chainMatches(c, f); };
  var waiting = S.rateUpdates.filter(function (u) { return desks.indexOf(u.status) >= 0 && shown(u); });
  var actor = rateActor();
  /* decided here and still pending further along; published, withdrawn and
     declined ones drop off (they stay in the data, with their trail) */
  var decided = S.rateUpdates.filter(function (u) {
    return desks.indexOf(u.status) < 0 && ruOpen(u) && shown(u) &&
           (u.trail || []).some(function (t) { return t.by === actor; });
  }).slice().reverse();
  var change = function (u) {
    var bits = [];
    if (!sameRateCard(u.from, u.to)) bits.push("Rates");
    if (u.toCategory !== u.fromCategory) bits.push("Hub type → " + ((HUB_CATEGORIES[u.toCategory] || {}).label || ""));
    return (bits.join(" · ") || "-") + (u.source === "bulk" ? " · bulk " + (u.bulkId || "") : "");
  };
  /* Design D: a chevron opens the row onto its AM, CH and ZH */
  var line = function (u, act) {
    var open = a.ruExpand === u.id, w = ruWaitingOn(u);
    return '<tr data-testid="ap-ru-row" data-ru="' + esc(u.id) + '">' +
      '<td class="id"><button class="ru-exp" data-ruexp="' + esc(u.id) + '" aria-expanded="' + open + '" ' +
        'aria-label="' + (open ? 'Hide' : 'Show') + ' the AM, CH and ZH">' + (open ? '▾' : '▸') + '</button>' +
        esc(u.id) + apSub('Hub ' + esc(u.hubCode) + ' · ' + esc(u.hubName)) + '</td>' +
      '<td>' + esc(u.captain) + apSub(esc(u.phone)) + '</td>' +
      '<td style="white-space:normal">' + esc(change(u)) + apSub('from ' + esc(fmtIso(u.effectiveFrom))) + '</td>' +
      '<td>' + (ruAbove(u) ? '<span class="st red">Above ceiling</span>' : '<span class="st green">Within ceiling</span>') + '</td>' +
      '<td data-testid="ru-waiting-on">' + ruWaitingCell(u) + '</td>' +
      '<td style="text-align:right"><button class="btn ' + (act ? 'btn-primary' : 'btn-ghost') + '" data-apru="' +
        esc(u.id) + '">' + (act ? "Review" : "View") + '</button></td></tr>' +
      (open ? '<tr data-testid="ap-ru-expanded" data-ru="' + esc(u.id) + '"><td colspan="6" ' +
              'style="background:var(--sum-bg)">' + hierarchyHtml(ruChain(u), w && w.desk) + '</td></tr>' : '');
  };
  var table = function (title, sub, rows, empty) {
    return '<div class="ap-panel" style="margin-bottom:20px"><div class="ph"><div><b>' + title + '</b><span>' + sub +
      '</span></div></div><table class="ap-table"><thead><tr><th>Update</th><th>Captain</th><th>Change</th>' +
      '<th>Ceilings</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>' +
      (rows || '<tr><td class="empty" colspan="6">' + empty + '</td></tr>') + '</tbody></table></div>';
  };
  var above = waiting.filter(ruAbove).length;
  var filters = deskFilter("ap-ru-am", "am", a.ruAm) + deskFilter("ap-ru-ch", "ch", a.ruCh) +
                deskFilter("ap-ru-zh", "zh", a.ruZh);
  return (filters ? '<div class="ap-filters" data-testid="ap-ru-filters" style="margin:0 0 16px">' + filters + '</div>' : '') +
    '<div class="ap-stats" data-testid="ap-ru-stats">' +
      apStatTile("amber", "Waiting for you", waiting.length, waiting.length ? "Rate card updates to review" : "All caught up") +
      (biz
        ? apStatTile("red", "Raised to you", waiting.length, "Above their hub type’s ceilings")
        : apStatTile("red", "Above ceiling", above, above ? "BizFin approves these after the ZH" : "None above")) +
      apStatTile("green", "Decided by you", decided.length, "Still pending further along") +
    '</div>' +
    table("Waiting for your review",
      biz
        ? "Updates above their hub type’s ceilings, approved by the Cluster Head and the Zonal Head, or sent by " +
          "FM Central Ops in bulk. Approving sends it to the captain to agree."
        : ops
        ? "Updates with the Cluster Head or the Zonal Head. As FM Central Ops you can decide them at either step. " +
          "Every change goes from the CH to the ZH; above the ceilings it goes on to BizFin; then the captain agrees."
        : a.role === "zh"
        ? "Rate card changes your Cluster Heads have approved. Within the ceilings, approving sends it to the captain " +
          "to agree; above them, it goes on to BizFin first."
        : "Area Managers’ changes to rate cards and hub types. Approving sends it to the Zonal Head; above the " +
          "ceilings it then goes on to BizFin, and the captain agrees last.",
      waiting.map(function (u) { return line(u, true); }).join(""), "Nothing waiting for you.") +
    table("Decided by you", "Still pending further along, the captain included. Once agreed, it drops off here.",
      decided.map(function (u) { return line(u, false); }).join(""), "Nothing still pending.");
}

/* A desk's review of one update. */
function apRateReview(u) {
  var mine = rateDesks().indexOf(u.status) >= 0, desk = mine ? u.status : null;
  var above = ruAbove(u), m = ruMeta(u), p = ruPhase(u);
  var typeOnly = sameRateCard(u.from, u.to), bulk = u.source === "bulk";
  var actions = "";
  if (mine) {
    actions = '<div class="fl" style="margin-top:4px"><label>Reason (needed to send it back)</label>' +
        '<div class="box' + (S.admin.ruError ? ' bad' : '') + '"><input id="ap-ru-reason" placeholder="e.g. Keep the ' +
        'first slab as it is" value="' + esc(S.admin.ruReason) + '"></div>' +
        '<div class="hint' + (S.admin.ruError ? ' err' : '') + '">' +
          esc(S.admin.ruError || (bulk ? "FM Central Ops sees this if you don’t approve it."
                                       : "The Area Manager sees this if you send it back.")) + '</div></div>' +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="ap-ru-reject" style="color:var(--err)">' +
          (bulk ? 'Don’t approve' : 'Send back to the Area Manager') + '</button>' +
        '<button class="btn btn-primary" id="ap-ru-approve">' +
          (desk === "ch" ? 'Approve and send to the Zonal Head'
           : desk === "zh" && above ? 'Approve and send to BizFin'
           : typeOnly ? 'Approve and publish the hub type' : 'Approve and send to the captain to agree') + '</button>' +
      '</div>';
  } else {
    var ver = u.version && rateVersions(allHubById(u.hubId)).filter(function (x) { return x.v === u.version; })[0];
    actions = '<div class="notice ' + (p === "revision" ? 'bad' : 'info') + '" style="margin:0">' +
      '<b>' + esc(m.label) + '</b>' +
      (u.status === "published"
        ? 'Approved by ' + esc(DESK[u.approvedBy] || u.approvedBy || "") + ' and published on ' + esc(u.publishedOn) +
          ' as v' + esc(u.version) + ', applying from ' + esc(fmtIso(u.effectiveFrom)) + '. ' +
          (ver && ver.agreedOn ? 'The captain agreed on ' + esc(ver.agreedOn) + '.'
                               : 'Only the hub type changed, so the captain wasn’t asked.')
       : p === "revision" ? 'Sent back by the ' + esc(DESK[u.rejectedBy] || "") + ': ' + esc(u.rejectReason)
       : p === "rejected" ? 'BizFin didn’t approve it: ' + esc(u.rejectReason)
       : p === "central" ? 'Raised to BizFin on ' + esc(u.raisedOn || u.sentOn) + '.'
       : p === "captain" ? 'Approved by the ' + esc(DESK[u.approvedBy] || "") + ' on ' + esc(u.approvedOn) +
         '. Waiting for ' + esc(u.captain) + ' to agree. Asked ' + esc((u.notice || {}).at || u.sentToCaptainOn || "") +
         ' in the app, by SMS and email.'
       : p === "withdrawn" ? 'The Area Manager withdrew it.'
       : p === "zh" ? 'Approved by the Cluster Head on ' + esc(u.chApprovedOn || "") + '. It’s with the Zonal Head.'
       : 'With the Cluster Head.') + '</div>';
  }
  return '<div class="ap-detail" data-testid="ap-ru-review">' +
    '<button class="btn-link" id="ap-ru-back" style="margin-bottom:12px">‹ Back to rate card updates</button>' +
    '<div class="ap-panel"><div class="ph"><div>' +
      '<span class="hubcode">Hub ' + esc(u.hubCode) + '</span>' +
      '<b>' + esc(u.hubName) + ' · rate card update ' + esc(u.id) + '</b>' +
      '<span>' + esc(u.captain) + ' · ' + esc(u.phone) + ' · from ' + esc(u.by) +
        (bulk ? ' (bulk update)' : ', Area Manager') + ' · sent ' + esc(u.sentOn) + '</span></div>' +
      '<span class="st ' + m.tone + '">' + m.label + '</span></div>' +
    '<div class="ap-form">' +
      '<div style="margin-bottom:16px" data-testid="ru-review-hierarchy">' +
        hierarchyHtml(ruChain(u), (ruWaitingOn(u) || {}).desk) + '</div>' +
      ruCompareHtml(u) + ruTrailHtml(u) +
      '<div style="margin-top:16px">' + actions + '</div>' +

/* Updating one hub's rate card: the card in force, the new one, and from when. */

/* Captains' requests to change a live hub, newest first. */
function apSub(t) {
  return '<span style="display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:4px;line-height:16px">' +
         t + '</span>';
}
function apStatTile(cls, k, v, sub) {
  return '<div class="ap-stat ' + cls + '"><span class="k">' + k + '</span><b>' + v + '</b>' +
         '<span class="s">' + sub + '</span></div>';
}
function editChanges(e) { return hubEditChanged(e).map(function (f) { return f.label; }).join(", "); }
function apMatches(q, parts, phone) {
  if (!q) return true;
  if (parts.join(" ").toLowerCase().indexOf(q) >= 0) return true;
  var d = q.replace(/\D/g, "").replace(/^(?:91|0)/, "");
  return d.length >= 3 && String(phone || "").replace(/\D/g, "").replace(/^91/, "").indexOf(d) >= 0;
}

/* Every hub under the Area Manager and where its latest edit request stands —
   anything waiting for review first. */
function apEditList() {
  var a = S.admin, q = String(a.hubSearch || "").trim().toLowerCase(), f = a.hubFilter || "all";
  var rows = amHubs().map(function (h) {
    var e = hubEditOf(h.id);
    return { h:h, e:e, o:hubOwner(h), st:h.status === "inactive" ? "inactive" : (e ? e.status : "none") };
  });
  var count = function (st) { return rows.filter(function (x) { return x.st === st; }).length; };
  var captains = {};
  rows.forEach(function (x) { captains[x.o.name] = true; });
  var rank = { pending:0, approved:1, rejected:1, none:2, inactive:3 };
  var shown = rows.filter(function (x) {
    if (f !== "all" && x.st !== f) return false;
    var area = PIN_AREAS[x.h.pincode];
    return apMatches(q, [x.h.code, x.h.name, x.o.name, x.o.phone, x.h.pincode, area ? area.name : ""], x.o.phone);
  }).sort(function (x, y) { return (rank[x.st] - rank[y.st]) || (x.h.code < y.h.code ? -1 : 1); });

  var body = shown.length
    ? shown.map(function (x) {
        var h = x.h, e = x.e, area = PIN_AREAS[h.pincode];
        var status = x.st === "pending"  ? '<span class="st blue">Edit to review</span>' +
                                           apSub(esc(editChanges(e)) + ' · sent ' + esc(e.submittedOn))
                   : x.st === "approved" ? '<span class="st green">Edit approved</span>' +
                                           apSub(esc(editChanges(e)) + ' · ' + esc(e.decidedOn))
                   : x.st === "rejected" ? '<span class="st red">Edit rejected</span>' +
                                           apSub(esc(editChanges(e)) + ' · ' + esc(e.decidedOn))
                   : x.st === "inactive" ? '<span class="st grey">Hub inactive</span>'
                   :                       '<span class="st grey">No open request</span>';
        var act = x.st === "pending"
          ? '<button class="btn btn-primary" data-apedit="' + esc(e.id) + '">Review</button>' +
            '<button class="btn-link" data-aphub="' + esc(h.id) + '" style="display:block;margin:6px 0 0 auto;' +
            'font-size:12px;line-height:16px">View hub</button>'
          : '<button class="btn btn-ghost" data-aphub="' + esc(h.id) + '">View hub</button>';
        return '<tr data-testid="ap-hub-row" data-hubrow="' + esc(h.id) + '" data-status="' + x.st + '">' +
          '<td class="id">Hub ' + esc(h.code) + apSub(esc(h.name) + ' · ' + esc(h.role)) + '</td>' +
          '<td>' + esc(x.o.name) + apSub(esc(x.o.phone)) + '</td>' +
          '<td>' + esc(h.pincode || "-") + apSub(esc(area ? area.name : (h.city || ""))) + '</td>' +
          '<td>' + status + '</td>' +
          '<td style="text-align:right">' + act + '</td></tr>';
      }).join("")
    : '<tr><td class="empty" colspan="5">No hubs match this filter.</td></tr>';

  var opt = function (v, label) {
    return '<option value="' + v + '"' + (f === v ? ' selected' : '') + '>' + label + '</option>';
  };
  return '<div class="ap-stats" data-testid="ap-hub-stats">' +
      apStatTile("blue", "Hubs under you", rows.length, Object.keys(captains).length + " captains") +
      apStatTile("amber", "Edits to review", count("pending"), count("pending") ? "Waiting on you" : "All caught up") +
      apStatTile("green", "Edits approved", count("approved"), "Live on the hub") +
      apStatTile("red", "Edits rejected", count("rejected"), "The hub kept its details") +
    '</div>' +
    '<div class="ap-panel">' +
      '<div class="ph"><div><b>Hub edits</b>' +
        '<span>Every hub under you. A captain asking to change a live hub\u2019s address, pincode, map ' +
        'pin or area waits here. Approving applies it; rejecting keeps the hub as it is.</span></div>' +
        '<div class="ap-filters">' +
          '<input id="ap-hub-search" placeholder="Search hub, captain, phone, pincode" value="' +
            esc(a.hubSearch || "") + '">' +
          '<select id="ap-hub-filter">' + opt("all", "All hubs") + opt("pending", "Edit to review") +
            opt("approved", "Edit approved") + opt("rejected", "Edit rejected") +
            opt("none", "No open request") + opt("inactive", "Hub inactive") + '</select>' +
        '</div></div>' +
      '<table class="ap-table"><thead><tr>' +
        '<th>Hub</th><th>Captain</th><th>Pincode</th><th>Latest edit request</th>' +
        '<th style="text-align:right">Action</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table>' +
    '</div>';
}

/* One hub under the Area Manager: what it runs on now, and every edit asked of it. */
/* Coordinates typed straight in ("12.9346, 77.6262") or a Google Maps link. */
var AH_MAP_HINT = "Tap the map to move the pin, or enter coordinates (12.9346, 77.6262) or a Google " +
                  "Maps link. Saved straight to the hub, and the captain is notified, with nothing to verify.";
var AH_COORDS_ERR = "Enter coordinates like 12.9346, 77.6262, or a Google Maps link.";
function parseCoords(t) {
  var m = String(t || "").trim().match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
  return m ? { lat:+m[1], lng:+m[2] } : null;
}
function linkFromCoords(t) {
  var c = parseCoords(t);
  return c ? "https://maps.google.com/?q=" + c.lat + "," + c.lng : String(t || "").trim();
}
function coordsText(link) {
  var c = parseMapLink(link);
  return c ? c.lat + ", " + c.lng : String(link || "");
}
function samePin(a, b) {
  if (a === b) return true;
  var x = parseMapLink(a), y = parseMapLink(b);
  return !!x && !!y && Math.abs(x.lat - y.lat) < 1e-6 && Math.abs(x.lng - y.lng) < 1e-6;
}

/* ------------------------------------------------------------------- flow */

function viewFlow() {
  var r = R(), list = phases(), idx = r.phaseIdx;
  var cur = list[idx];

  var steps = list.map(function (p, i) {
    // a phase carried over from the captain record counts as already cleared
    var isDone = i < idx || isCarried(r, p.id);
    var cls = i === idx ? "here" : (isDone ? "done" : "");
    var mark = (isDone && i !== idx) ? "✓" : String(i + 1);
    return '<div class="rstep ' + cls + '">' +
             '<div class="dot">' + mark + '</div>' +
             '<div class="txt"><b>' + esc(p.title) + '</b><span>' + esc(p.sub) + '</span></div>' +
           '</div>';
  }).join("");

  var pct = progressPct();

  var rail = '' +
  '<div class="rail">' +
    '<div class="rlogo">' +
      '<div class="mark"><img alt="VALMO" src="' + LOGO + '"></div>' +
      '<span>Captain<br>Onboarding</span>' +
    '</div>' +
    '<div class="rprogress">' +
      '<div class="top"><b>Step ' + (idx + 1) + ' of ' + list.length + '</b>' +
        '<i>' + pct + '% complete</i></div>' +
      '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
    '</div>' +
    '<div class="rsteps">' + steps + '</div>' +
    '<div class="ruser">' +
      '<div class="av">' + esc(initials(r.pd.name, S.phone)) + '</div>' +
      '<div class="who"><span>Logged in as</span><b>' + esc(maskPhone(S.phone)) + '</b></div>' +
    '</div>' +
  '</div>';

  var body = renderPhase(cur.id, r);

  var top = '' +
  '<div class="topbar">' +
    '<div class="tt"><span>Captain Onboarding</span><b>' + esc(cur.title) + '</b></div>' +
    '<div class="track"><div style="width:' + pct + '%"></div></div>' +
    '<div class="tr">' +
      (S.hubs.some(function (h) { return h.status === "active"; }) ? bellHtml() : '') +
      '<span class="pill"><span class="led"></span>Phone verified</span>' +
      '<button class="btn btn-ghost" id="save-exit">Save &amp; Exit</button>' +
    '</div>' +
  '</div>';

  return '<div class="flow">' + rail +
    '<div class="main">' + top +
      '<div class="content">' +
        '<div class="col-left">' + body.left + '</div>' +
        '<div class="col-side">' + body.side + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* Right-hand column: "what happens next" + application summary. */
function sideDefault(r, extraTop) {
  var list = phases(), idx = r.phaseIdx;
  var nxt = list[idx + 1];

  var s1 = nxt
    ? { b: nxt.title, s: nxt.sub }
    : { b: "Hub goes live", s: "You can start using the Captain Panel." };

  var rows = [
    ["Mobile", maskPhone(S.phone)],
    ["Role", ROLE_META[r.role].name],
    ["Request ID", r.requestId || "-"],
    ["Status", r.amRejected ? "Rejected" : list[idx].title]
  ];
  /* Hub category and the ceiling it drives are internal — the FM captain is
     never shown either. */
  if (r.hub.hubCode) rows.splice(rows.length - 1, 0, ["Hub code", r.hub.hubCode]);
  if (r.act.partnerId) rows.splice(rows.length - 1, 0, ["Partner ID", r.act.partnerId]);
  if (r.act.vendorId) rows.splice(rows.length - 1, 0, ["Oracle vendor ID", r.act.vendorId]);

  var kv = rows.map(function (x) {
    return '<div class="row"><span class="k">' + esc(x[0]) + '</span>' +
           '<span class="v">' + esc(x[1]) + '</span></div>';
  }).join("");

  var s2 = { b: "Progress is saved", s: "You can leave and continue from here later." };
  if (r.amRejected) {                 // a closed application: only who to call
    s1 = { b: "Contact your Area Manager", s: r.amRejected.by + ", " + r.amRejected.phone + ", for any details." };
    s2 = null;
  }

  return (extraTop || "") +
  '<div class="side-card">' +
    '<b>What happens next?</b>' +
    '<div class="side-step"><div class="n">1</div><div class="sx"><b>' + esc(s1.b) + '</b>' +
      '<span>' + esc(s1.s) + '</span></div></div>' +
    (s2 ? '<div class="side-step"><div class="n">2</div><div class="sx"><b>' + esc(s2.b) + '</b>' +
      '<span>' + esc(s2.s) + '</span></div></div>' : '') +
    '<div class="side-step"><div class="n">' + (s2 ? 3 : 2) + '</div><div class="sx"><b>Need help?</b>' +
      '<span>Contact VALMO Support for help.</span></div></div>' +
  '</div>' +
  '<div class="side-card">' +
    '<b>Application summary</b>' +
    '<div style="padding-top:16px"><div class="kv">' + kv + '</div></div>' +
  '</div>';
}

function cardWrap(title, sub, inner, chip) {
  return '<div class="card">' +
    '<div class="chead"><div class="ct"><b>' + esc(title) + '</b>' +
      '<span>' + esc(sub) + '</span></div>' +
      '<span class="chip">' + (chip || "🔒 Secure onboarding") + '</span></div>' +
    '<div class="cbody">' + inner + '</div>' +
  '</div>';
}

function statusBlock(kind, title, text) {
  var icons = { ok:"✓", run:"◴", bad:"!", wait:"◷" };
  return '<div class="status-head"><div class="ico ' + kind + '">' + icons[kind] + '</div>' +
    '<div class="st"><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p></div></div>';
}

function tlRow(state, title, sub) {
  var mark = state === "ok" ? "✓" : (state === "bad" ? "!" : (state === "now" ? "●" : ""));
  return '<div class="tl-row ' + state + '"><div class="m">' + mark + '</div>' +
    '<div class="tx"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div></div>';
}

/* ------------------------------------------------------ phase dispatcher */

function renderPhase(id, r) {
  switch (id) {
    case "pd":  return phasePD(r);
    case "kyc": return phaseKYC(r);
    case "bgv": return phaseBGV(r);
    case "ch":  return phaseCH(r);
    case "sd":  return phaseSD(r);
    case "hub": return phaseHUB(r);
    case "am":  return phaseAM(r);
    case "ag":  return phaseAG(r);
    case "act": return phaseACT(r);
  }
  return { left:"", side:"" };
}

/* --------------------------------------------------- 1. personal details */

function phasePD(r) {
  var pd = r.pd, e = pd.errors || {};

  var emailBox;
  if (pd.emailVerified) {
    emailBox = '<div class="box"><input id="pd-email" value="' + esc(pd.email) + '" disabled>' +
               '<span class="tag ok">Verified</span></div>';
  } else {
    emailBox = '<div class="box' + (e.email ? ' bad' : '') + '">' +
      '<input id="pd-email" placeholder="you@example.com" value="' + esc(pd.email) + '"' +
        (pd.emailLocked ? ' disabled' : '') + '>' +
      '<button class="btn-sm" id="pd-verify-email"' +
        (V.email(pd.email) && !pd.emailLocked ? '' : ' disabled') + '>' +
        (failOf(r, "email") ? "Resume" : "Verify") + '</button></div>';
  }

  var otpBlock = "";
  if (pd.emailOtpOpen && !pd.emailVerified && !pd.emailLocked) {
    otpBlock =
      '<div class="notice info"><b>Enter the 6-digit code sent to ' + esc(pd.email) + '</b>' +
      'Demo code: <b style="display:inline">000000</b>' +
      (pd.emailOtpAttempts > 0
        ? '<span style="display:block;color:var(--err);font-weight:700;margin-top:8px">' +
          ERR.otpWrong + ' (' + (3 - pd.emailOtpAttempts) + ' left)</span>'
        : '') +
      '<div style="display:flex;gap:12px;margin-top:12px">' +
        '<input id="pd-email-otp" class="otp-cell" style="width:auto;flex:1;height:44px;' +
          'font-size:15px;letter-spacing:6px;padding:0 12px;line-height:20px" maxlength="6" inputmode="numeric" ' +
          'placeholder="000000">' +
        '<button class="btn btn-primary" id="pd-email-otp-go" style="padding:12px 20px">Confirm</button>' +
      '</div></div>';
  }
  if (pd.emailLocked) {
    otpBlock = '<div class="notice bad"><b>Email verification locked</b>' +
      'Three incorrect codes. Contact VALMO Support to unlock this email.</div>';
  }

  var canContinue = !!pd.name.trim() && pd.emailVerified && !!pd.tncAgreed;

  var inner =
    '<div class="fl"><label>Vendor / Captain name</label>' +
      '<div class="box' + (e.name ? ' bad' : '') + '">' +
        '<input id="pd-name" placeholder="Full name" value="' + esc(pd.name) + '"></div>' +
      '<div class="hint' + (e.name ? ' err' : '') + '">' +
        (e.name || "Your full name, as you’d like us to call you.") + '</div></div>' +

    '<div class="grid2">' +
      '<div class="fl"><label>Alternate phone number</label>' +
        '<div class="box' + (e.altPhone ? ' bad' : '') + '">' +
          '<input id="pd-alt" inputmode="numeric" maxlength="10" placeholder="10-digit number" ' +
            'value="' + esc(pd.altPhone) + '"></div>' +
        '<div class="hint' + (e.altPhone ? ' err' : '') + '">' +
          (e.altPhone || "We’ll call this number only if we can’t reach your main number.") +
        '</div></div>' +
      '<div class="fl"><label>Email address</label>' + emailBox +
        '<div class="hint' + (e.email ? ' err' : '') + '">' +
          (e.email || "We’ll send your updates and documents here.") +
        '</div></div>' +
    '</div>' +

    (pd.emailVerified ? "" : failNotice(failOf(r, "email"))) +
    otpBlock +

    '<label class="check-row tnc-row" for="pd-tnc">' +
      '<input type="checkbox" id="pd-tnc"' + (pd.tncAgreed ? ' checked' : '') + '>' +
      '<span class="cl"><b>I agree to VALMO&rsquo;s <a href="#" class="tnc-link">Terms &amp; Conditions</a> and ' +
        '<a href="#" class="tnc-link">Privacy Policy</a></b>' +
      '<span>We use these details only for your onboarding.</span></span></label>' +
    (e.tnc ? '<div class="hint err tnc-err">' + esc(e.tnc) + '</div>' : '') +
    '<div class="cfoot">' +
      backBtn(r) +
      '<button class="btn btn-primary" id="pd-continue"' + (canContinue ? '' : ' disabled') +
        '>Continue →</button>' +
    '</div>';

  return {
    left: phaseHeader(r, "Personal details", "Tell us who you are and how to reach you.") +
          cardWrap("Personal details",
                   "Verify your email to get updates and documents.", inner),
    side: sideDefault(r)
  };
}

/* -------------------------------------------------------- 2. KYC (LM/FM) */

/* The designs verify one record at a time — Aadhaar, then PAN, then bank, then
   GST — each on its own card, with a confirmation screen between them
   (KYC-01…KYC-14). Not one long scrollable form. */
var KYC_ORDER = ["aadhaar", "pan", "bank", "gst"];

function kycStep(r) {
  var k = r.kyc;
  if (k.editing) return k.editing;                  // an item reopened for correction
  for (var i = 0; i < KYC_ORDER.length; i++) {
    var id = KYC_ORDER[i];
    if (!k[id].done) return id;                     // still to be entered
    if (id !== "gst" && !k.ack[id]) return id + "-done";   // its confirmation screen
  }
  return "complete";
}

function kycEditBtn(id, tert) {
  return '<button class="btn ' + (tert ? 'btn-tert' : 'btn-ghost') + ' btn-edit" data-kycedit="' + id + '"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.6 3.9l3.5 3.5M3.5 16.5l.9-4.1 9.4-9.4a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1l-9.4 9.4-4.1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Edit</button>';
}

/* Footer shared by every entry card. */
function kycFoot(r, btnId, label, enabled) {
  return '<div class="cfoot">' + backBtn(r) +
    '<span class="note">Your details are kept safe and used only for onboarding.</span>' +
    '<button class="btn btn-primary" id="' + btnId + '"' + (enabled ? '' : ' disabled') +
      '>' + esc(label) + '</button></div>';
}

function phaseKYC(r) {
  var k = r.kyc, e = k.errors || {}, fm = r.role === "FM";
  var step = kycStep(r);
  var lede, title, sub, body;

  /* ---------------------------------------------------- Aadhaar (KYC-01…04) */
  if (step === "aadhaar") {
    lede  = "Verify identity to continue.";
    title = "Aadhaar verification";
    sub   = "Enter your Aadhaar number to confirm it’s you.";
    body =
      '<div class="fl"><label>Aadhaar number</label>' +
        '<div class="box' + (e.aadhaar ? ' bad' : '') + '">' +
        '<input id="kyc-aadhaar" inputmode="numeric" maxlength="12" ' +
          'placeholder="12-digit Aadhaar" value="' + esc(k.aadhaar.value) + '"></div>' +
        '<div class="hint' + (e.aadhaar ? ' err' : '') + '">' +
          (e.aadhaar || "Only the last 4 digits are shown after verification.") + '</div></div>' +
      (k.aadhaar.otpOpen
        ? '<div class="notice info"><b>DigiLocker OTP sent</b>Demo code: ' +
          '<b style="display:inline">000000</b>' +
          '<div style="display:flex;gap:12px;margin-top:12px">' +
          '<input id="kyc-aadhaar-otp" class="otp-cell" style="width:auto;flex:1;height:44px;' +
            'font-size:15px;letter-spacing:6px;padding:0 12px;line-height:20px" maxlength="6" placeholder="000000">' +
          '<button class="btn btn-primary" id="kyc-aadhaar-confirm" style="padding:12px 20px">' +
            'Confirm</button></div></div>'
        : "") +
      failNotice(failOf(r, "aadhaar")) +
      kycFoot(r, "kyc-aadhaar-go", failOf(r, "aadhaar") ? "Resume verification →" : "Verify Aadhaar →",
              !k.aadhaar.otpOpen);

  } else if (step === "aadhaar-done") {
    var ad = k.aadhaar.data || {};
    lede  = "Aadhaar verification is complete.";
    title = "KYC verification";
    sub   = "Aadhaar verification is complete.";
    body =
      statusBlock("ok", "Aadhaar verified", "Your Aadhaar has been verified successfully.") +
      '<p style="text-align:center;font-size:13px;font-weight:500;color:var(--muted);' +
        'margin:0 0 16px;line-height:20px">You can now continue to PAN verification.</p>' +
      '<div class="kv" data-testid="aadhaar-fetched">' +
        '<div class="row"><span class="k">Fetched from Aadhaar</span><span class="v mute"></span></div>' +
        '<div class="row"><span class="k">Name</span><span class="v">' + esc(ad.name || "-") + '</span></div>' +
        '<div class="row"><span class="k">Date of birth</span><span class="v">' + esc(ad.dob || "-") + '</span></div>' +
        '<div class="row"><span class="k">Aadhaar address</span>' +
          '<span class="v" style="max-width:62%;white-space:normal">' + esc(ad.address || "-") + '</span></div>' +
      '</div>' +
      '<div class="cfoot">' + backBtn(r) +
        kycEditBtn("aadhaar") +
        '<button class="btn btn-primary" id="kyc-ack-aadhaar">Continue to PAN verification →</button>' +
      '</div>';

  /* -------------------------------------------------------- PAN (KYC-05…07) */
  } else if (step === "pan") {
    lede  = "Verify PAN details to continue.";
    title = "PAN verification";
    sub   = "Enter your PAN and father’s name to continue.";
    body =
      '<div class="grid2">' +
        '<div class="fl"><label>PAN number</label>' +
          '<div class="box' + (e.pan ? ' bad' : '') + '">' +
          '<input id="kyc-pan" maxlength="10" style="text-transform:uppercase" ' +
            'placeholder="ABCDE1234F" value="' + esc(k.pan.value) + '"></div>' +
          '<div class="hint' + (e.pan ? ' err' : '') + '">' +
            (e.pan || "10-character PAN format.") + '</div></div>' +
        '<div class="fl"><label>Father’s name</label>' +
          '<div class="box' + (e.panFather ? ' bad' : '') + '">' +
          '<input id="kyc-pan-father" placeholder="Enter father’s name (as on PAN card)" ' +
            'value="' + esc(k.pan.father) + '"></div>' +
          '<div class="hint' + (e.panFather ? ' err' : '') + '">' +
            (e.panFather || "As written on your PAN card.") + '</div></div>' +
      '</div>' +
      failNotice(failOf(r, "pan")) +
      kycFoot(r, "kyc-pan-go", failOf(r, "pan") ? "Resume verification →" : "Verify PAN →", true);

  } else if (step === "pan-done") {
    lede  = "PAN verification is complete.";
    title = "KYC verification";
    sub   = "PAN verification is complete.";
    body =
      statusBlock("ok", "PAN verified", "Your PAN matches your Aadhaar name.") +
      '<p style="text-align:center;font-size:13px;font-weight:500;color:var(--muted);' +
        'margin:0 0 16px;line-height:20px">You can now continue to bank verification.</p>' +
      '<div class="kv">' +
        '<div class="row"><span class="k">PAN</span><span class="v">' + esc(k.pan.value) + '</span></div>' +
        '<div class="row"><span class="k">Father’s name</span><span class="v">' +
          esc(k.pan.father) + '</span></div>' +
      '</div>' +
      '<div class="cfoot">' + backBtn(r) + kycEditBtn("pan") +
        '<button class="btn btn-primary" id="kyc-ack-pan">Continue to bank verification →</button>' +
      '</div>';

  /* ------------------------------------------------------- bank (KYC-08…10) */
  } else if (step === "bank") {
    lede  = "Add the bank account where you’ll get paid.";
    title = "Bank account verification";
    sub   = "Your earnings will be paid to this account.";
    body =
      '<div class="grid2">' +
        '<div class="fl"><label>Account number</label>' +
          '<div class="box' + (e.account ? ' bad' : '') + '">' +
          '<input id="kyc-acc" inputmode="numeric" maxlength="18" placeholder="Account number" ' +
            'value="' + esc(k.bank.acc) + '"></div>' +
          '<div class="hint' + (e.account ? ' err' : '') + '">' +
            (e.account || "The account where you want your payments.") + '</div></div>' +
        '<div class="fl"><label>IFSC code</label>' +
          '<div class="box' + (e.ifsc ? ' bad' : '') + '">' +
          '<input id="kyc-ifsc" maxlength="11" style="text-transform:uppercase" ' +
            'placeholder="HDFC0001234" value="' + esc(k.bank.ifsc) + '"></div>' +
          '<div class="hint' + (e.ifsc ? ' err' : '') + '">' +
            (e.ifsc || "You’ll find it on your cheque book.") + '</div></div>' +
      '</div>' +
      (fm ? '<div class="hint" style="padding-bottom:4px">No cancelled cheque needed. ₹1 will be deducted from this account to check it’s yours and refunded instantly.</div>' : '') +
      failNotice(failOf(r, "bank")) +
      kycFoot(r, "kyc-bank-go", failOf(r, "bank") ? "Resume verification →" : "Verify bank account →", true);

  } else if (step === "bank-done") {
    lede  = "Bank verification is complete.";
    title = "KYC verification";
    sub   = "Bank verification is complete.";
    body =
      statusBlock("ok", "Bank account verified", "₹1 was deducted to check this account and has been refunded to you.") +
      '<p style="text-align:center;font-size:13px;font-weight:500;color:var(--muted);' +
        'margin:0 0 16px;line-height:20px">You can now continue to GST status.</p>' +
      '<div class="kv">' +
        '<div class="row"><span class="k">Account number</span><span class="v">' +
          esc(k.bank.acc.replace(/\d(?=\d{4})/g, "•")) + '</span></div>' +
        '<div class="row"><span class="k">IFSC code</span><span class="v">' + esc(k.bank.ifsc) + '</span></div>' +
        '<div class="row"><span class="k">Account holder name</span><span class="v">' +
          esc(k.bank.holder || "-") + '</span></div>' +
      '</div>' +
      '<div class="cfoot">' + backBtn(r) + kycEditBtn("bank") +
        '<button class="btn btn-primary" id="kyc-ack-bank">Continue to GST status →</button>' +
      '</div>';

  /* -------------------------------------------------------- GST (KYC-11…13) */
  } else if (step === "gst") {
    lede  = "Choose GST status to complete KYC.";
    title = "GST status";
    sub   = fm
      ? "FM hubs need a GSTIN. Enter yours to verify it."
      : "Choose GST registered only if you have an active GSTIN.";

    var reg = k.gst.registered === true || fm;
    var choice = function (on, id, t, d, dis) {
      return '<div class="choice' + (on ? " on" : "") + (dis ? " off" : "") + '" ' +
        'data-gstchoice="' + id + '" role="radio" aria-checked="' + (on ? "true" : "false") + '" ' +
        'aria-disabled="' + (dis ? "true" : "false") + '"' + (dis ? '' : ' tabindex="0"') + '>' +
        '<span class="radio"></span><span class="ct"><b>' + t + '</b><span>' + d + '</span></span></div>';
    };

    var gstinField =
      '<div class="fl"' + (fm ? '' : ' style="margin-top:16px"') + '><label>GSTIN</label>' +
        '<div class="box' + (e.gstin ? ' bad' : '') + '">' +
        '<input id="kyc-gstin" maxlength="15" style="text-transform:uppercase" ' +
          'placeholder="15-character GSTIN" value="' + esc(k.gst.gstin) + '"></div>' +
        '<div class="hint' + (e.gstin ? ' err' : '') + '">' +
          (e.gstin || "15 characters, as on your GST certificate. It should be in the same name as your bank account.") + '</div></div>' +
      (e.gstin && k.gst.check ? gstCheckHtml(k.gst.check) : '');

    if (fm && k.gst.noGstOpen) {
      /* the deliberate path: a reason and a confirmation, then on */
      title = "Continue without GST";
      sub   = "Tell us why you don’t have GST, and confirm it.";
      body =
        noGstForm("kyc", k.gst.noGstDraft, e) +
        '<div class="cfoot">' + backBtn(r) +
          '<button class="btn btn-ghost" id="kyc-nogst-cancel">I have a GSTIN</button>' +
          '<button class="btn btn-primary" id="kyc-nogst-go">Continue without GST →</button></div>';
    } else if (fm) {
      body =
        gstinField +
        failNotice(failOf(r, "gst")) +
        '<button class="btn-link" id="kyc-nogst-open" data-testid="kyc-nogst-open" ' +
          'style="font-size:12px;margin:4px 0 8px;line-height:16px">Don’t have GST?</button>' +
        kycFoot(r, "kyc-gst-go", failOf(r, "gst") ? "Resume verification →" : "Verify GSTIN →", true);
    } else {
      body =
        choice(k.gst.registered === false, "none", "Non-GST",
          "Continue without a GSTIN. You can add one later from your profile.", false) +
        choice(reg, "registered", "GST registered",
          "Choose this if you have a GSTIN.", false) +
        (reg ? gstinField + failNotice(failOf(r, "gst")) : '') +
        kycFoot(r, "kyc-gst-go",
                reg ? (failOf(r, "gst") ? "Resume verification →" : "Verify GSTIN →") : "Continue →",
                k.gst.registered !== null);
    }

  /* ------------------------------------------------------ complete (KYC-14) */
  } else {
    lede  = "Identity and payout details are verified.";
    title = "KYC verification";
    sub   = "Identity and payout details are verified.";
    body =
      statusBlock("ok", "KYC verification complete",
        "Your Aadhaar, PAN, bank account and GST are all verified.") +
      /* each record can be reopened from here, rather than only restarting
         the sequence at Aadhaar */
      '<div class="kv">' +
        '<div class="row"><span class="k">Aadhaar</span><span class="v ok">Verified' +
          kycEditBtn("aadhaar", true) + '</span></div>' +
        '<div class="row"><span class="k">PAN</span><span class="v ok">Verified' +
          kycEditBtn("pan", true) + '</span></div>' +
        '<div class="row"><span class="k">Bank account</span><span class="v ok">Verified' +
          kycEditBtn("bank", true) + '</span></div>' +
        '<div class="row" data-testid="kyc-gst-row"><span class="k">GST' + (fm ? '' : ' status') +
          '</span><span class="v' + (k.gst.registered ? ' ok' : ' mute') + '">' +
          (k.gst.registered ? "Verified"
            : noGstState(k.gst) ? "No GST · " + NO_GST_LABEL[noGstState(k.gst)] : "Non-GST") +
          kycEditBtn("gst", true) + '</span></div>' +
        (k.gst.registered && k.gst.check && k.gst.check.match
          ? '<div class="row" data-testid="kyc-gst-name"><span class="k">GST name check</span>' +
            '<span class="v ' + GST_TONE[k.gst.check.match.level] + '">' +
            esc(GST_VERDICT[k.gst.check.match.level] + " · " + k.gst.check.match.pct + "%") +
            '</span></div>'
          : '') +
        (fm ? '<div class="row"><span class="k">MSME certificate</span><span class="v' +
              (k.msme.done ? ' ok">Uploaded' : ' mute">Not provided') + '</span></div>' : '') +
      '</div>' +
      (fm && !k.msme.done
        ? '<div class="upload" style="margin-top:16px" data-testid="msme-optional-upload">' +
          '<div class="ut"><b>MSME registration certificate</b>' +
          '<span>Optional. Attach it now, or add it later.</span></div>' +
          '<button class="btn btn-ghost" id="kyc-msme-go">Upload file</button></div>'
        : '') +
      '<div class="cfoot">' + backBtn(r) +
        '<span class="note">Each record can be reopened and redone above.</span>' +
        '<button class="btn btn-primary" id="kyc-continue">' + esc(nextLabel(r)) + '</button>' +
      '</div>';
  }

  return {
    left: phaseHeader(r, "KYC verification", lede) + cardWrap(title, sub, body),
    side: sideDefault(r)
  };
}


/* ------------------------------------------------ 3. background verification */

function phaseBGV(r) {
  var b = r.bgv, inner;

  if (b.status === "passed") {
    inner = statusBlock("ok", "Background verification passed", "Your identity and records are clear.") +
      '<div class="tl">' +
        tlRow("ok", "Identity check", "Aadhaar and PAN records matched.") +
        tlRow("ok", "Risk screening", "No issues found.") +
      '</div>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:20px">' +
        '<button class="btn btn-primary" id="bgv-continue">' + esc(nextLabel(r)) + '</button></div>';
  } else if (b.status === "failed") {
    inner = statusBlock("bad", "Background verification failed",
        "Your background check didn’t pass. Check your KYC details and submit again.") +
      '<div class="notice bad"><b>What you can do</b>' +
        'Make sure your Aadhaar and PAN details match, then submit again. If you think this is a mistake, contact VALMO Support.</div>' +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="bgv-back-kyc">Back to KYC</button>' +
        '<button class="btn btn-primary" id="bgv-retry">Resubmit for verification</button></div>';
  } else if (failOf(r, "bgv")) {
    inner = statusBlock("bad", "Background verification paused",
        "We couldn’t start your background check. It hasn’t failed. Tap resume to try again.") +
      failNotice(failOf(r, "bgv"), "bgv-resume", "Resume verification") +
      '<div class="tl">' +
        tlRow("ok", "KYC submitted", "We’ve received your KYC and bank details.") +
        tlRow("bad", "Background check paused", "Waiting to restart.") +
        tlRow("", nextRowLabel(r), "Available once the check clears.") +
      '</div>';
  } else {
    inner = statusBlock("run", "Background verification in progress",
        "This usually takes a few minutes. You can close this page. We’ll message you at " + maskPhone(S.phone) + " when it’s done.") +
      '<div class="tl">' +
        tlRow("ok", "KYC submitted", "We’ve received your KYC and bank details.") +
        tlRow("now", "Background check running", "Checking your identity and records.") +
        tlRow("", nextRowLabel(r), "Available once the check clears.") +
      '</div>';
  }

  return {
    left: phaseHeader(r, "Background verification", "We check your identity and records.") +
          cardWrap("Background verification", "We check your identity and records.", inner),
    side: sideDefault(r)
  };
}

/* ------------------------------------------------------ 4. Cluster Head review */

var CH_CONTACT = { name:"Rakesh Sharma", cluster:"Bengaluru Urban Cluster", phone:"+91 98765 43210" };
/* The captain's Area Manager, named only when they reject an application. */
var AM_CONTACT = { name:"Priya Sharma", phone:"+91 98450 11223" };

/* The Cluster Head is the captain's only named contact through this phase.
   Sign-off desks above them are internal and are never surfaced here. */
function chContactCard() {
  return '<div class="side-card"><b>Cluster Head assigned</b>' +
    '<div class="contact"><div class="ci">👤</div><div class="cx"><b>' + esc(CH_CONTACT.name) + '</b>' +
      '<span>' + esc(CH_CONTACT.cluster) + '</span></div></div>' +
    '<div class="contact"><div class="ci">📞</div><div class="cx">' +
      '<a href="tel:' + esc(CH_CONTACT.phone) + '">' + esc(CH_CONTACT.phone) + '</a>' +
      '<span>Tap to call anytime</span></div></div>' +
    '<div class="contact"><div class="ci">⏱</div><div class="cx"><b>48 hours</b>' +
      '<span>Typical review time. Call ' + esc(CH_CONTACT.name.split(" ")[0]) +
      ' if it&rsquo;s urgent.</span></div></div></div>';
}

/* The approved rate card as the captain sees it: one row per volume slab, plus
   the touchpoint rate. No benchmark ceiling and no hub category. */
function captainRateRows(ch) {
  var slabs = (ch.slabs || []);
  if (!slabs.length) return "";
  return slabs.map(function (sl) {
    return '<div class="row"><span class="k">' + esc(slabLabel(sl)) + '</span>' +
           '<span class="v">₹' + esc(sl.rate) + ' / shipment</span></div>';
  }).join("") +
  (ch.touchpoint
    ? '<div class="row"><span class="k">Touchpoint rate</span>' +
      '<span class="v">₹' + esc(ch.touchpoint) + ' / touchpoint</span></div>'
    : "");
}

/* Rate card panel, FM only. The approved card: one row per volume slab plus
   the touchpoint rate. Those are the only figures shown; there is no blended
   per-shipment number, and nothing is read off the ceiling. The captain sees
   it only once it is final, approved by the Cluster Head or BizFin, never
   while it is still being reviewed. */
function rateCardPanel(r) {
  if (!r.ch.category || r.ch.status !== "approved") return "";

  var rows = captainRateRows(r.ch);
  if (!rows) return "";                       // no card authored yet

  /* Combined is the only payout type there is. */
  var modeBlock = '<div class="notice info" data-testid="combined-blurb">' +
    '<b>Combined rate card</b>' +
    'You get your order rate plus the touchpoint rate, paid together.</div>';

  return '<p style="margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);line-height:16px">' +
      'Approved rate card</p>' +
    '<div class="kv" style="margin-bottom:16px" data-testid="captain-rate-card">' + rows +
    '</div>' + modeBlock;
}

/* One line describing where the request actually is, so an approved request
   does not keep saying the Cluster Head is reviewing it. */
function chPhaseSub(r) {
  if (r.ch.status === "approved") return "Your rate card is approved.";
  if (r.ch.status === "central")  return "Your rate card is awaiting sign-off.";
  if (r.ch.status === "revision") return "Your rate card is being revised.";
  return "Cluster Head is reviewing your request.";
}

function phaseCH(r) {
  var ch = r.ch, fm = r.role === "FM", inner, side;
  var ng = fm ? noGstState(r.kyc.gst) : null;

  /* The Area Manager rejected the application. Nothing more happens on it: the
     captain is told, pointed to the Area Manager for why, and starts again. */
  if (r.amRejected) {
    inner = '<div data-testid="am-app-rejected">' +
      '<div data-testid="am-app-rejected-contact">' +
        statusBlock("bad", "Your application was rejected", "Contact your Area Manager, " + r.amRejected.by + ", on " +
          r.amRejected.phone + " for any details.") + '</div>' +
      '<div style="display:flex;justify-content:flex-end;margin-top:20px">' +
        '<button class="btn btn-primary" id="am-app-rejected-ok">Acknowledged</button></div></div>';
    return {
      left: phaseHeader(r, "Application rejected", "") + cardWrap("Application rejected", "", inner),
      side: sideDefault(r)
    };
  }

  /* FM, no GST, and the Area Manager declined it: a GSTIN before anything else. */
  if (ng === "declined") {
    var k = r.kyc, e = k.errors || {};
    inner = '<div data-testid="nogst-declined">' +
      '<div class="notice bad"><b>Your Area Manager needs a GSTIN for this hub</b>' +
        'They need a GSTIN for this hub. Add it to continue. Everything else you entered is saved.</div>' +
      '<div class="fl"><label>GSTIN</label>' +
        '<div class="box' + (e.gstin ? ' bad' : '') + '">' +
        '<input id="ch-gstin" maxlength="15" style="text-transform:uppercase" ' +
          'placeholder="15-character GSTIN" value="' + esc(k.gst.gstin) + '"></div>' +
        '<div class="hint' + (e.gstin ? ' err' : '') + '">' +
          esc(e.gstin || "It should be in the same name as your bank account.") + '</div></div>' +
      (e.gstin && k.gst.check ? gstCheckHtml(k.gst.check) : '') +
      failNotice(failOf(r, "gst")) +
      '<div class="cfoot">' + backBtn(r) +
        '<button class="btn btn-primary" id="ch-gstin-go">' +
          (failOf(r, "gst") ? "Resume verification →" : "Verify GSTIN →") + '</button></div>' +
    '</div>';
    return {
      left: phaseHeader(r, "Cluster Head review", "Add your GSTIN to continue.") +
            cardWrap("Add your GSTIN", "Your Area Manager needs a GSTIN for this hub.", inner),
      side: sideDefault(r, chContactCard())
    };
  }

  /* FM blocks on hub classification before anything else can be judged. */
  if (fm && !ch.category && ch.status !== "approved") {
    inner = '<div data-testid="waiting-category">' +
      statusBlock("run", "Cluster Head review in progress",
        CH_CONTACT.name.split(" ")[0] + " is reviewing your request. This usually takes up to 48 hours. You don’t need to wait here. We’ll message you at " + maskPhone(S.phone) + " when there’s an update.") +
      '<div class="tl">' +
        tlRow("ok", "Background verification passed", "Your identity and records are clear.") +
        (ng === "pending"
          ? tlRow("now", "Area Manager is checking your request to continue without GST",
                  "Reason given: " + r.kyc.gst.noGst.reason + ".")
          : ng === "approved"
          ? tlRow("ok", "Continuing without GST approved", "By your Area Manager on " + r.kyc.gst.noGst.decidedOn + ".")
          : "") +
        tlRow(ng === "pending" ? "" : "now", "Cluster Head: " + CH_CONTACT.name, "Phone: " + CH_CONTACT.phone) +
        tlRow("", nextRowLabel(r), "Available after approval.") +
      '</div></div>';
    side = sideDefault(r, chContactCard());
    return {
      left: phaseHeader(r, "Cluster Head review", "Cluster Head is reviewing your request.") +
            cardWrap("Cluster Head review", "Cluster Head is reviewing your request.", inner),
      side: side
    };
  }

  if (ch.status === "approved") {
    inner = statusBlock("ok", "Cluster Head review approved",
        ch.decidedBy === "central"
          ? "Your request and rate card were approved."
          : "Your request and rate card were approved by the Cluster Head.") +
      (fm ? rateCardPanel(r) : '<div class="kv" style="margin-bottom:16px">' +
        '<div class="row"><span class="k">Forward rate</span><span class="v">₹14.50</span></div>' +
        '<div class="row"><span class="k">Reverse rate</span><span class="v">₹8.00</span></div></div>') +
      '<div class="tl">' +
        tlRow("ok", "Cluster Head: " + CH_CONTACT.name, "Approved on " + fmtDay(new Date())) +
      '</div>' +
      /* Just "Continue": the button names no next step, so neither flow is
         pointed at a security deposit from here. */
      '<div style="display:flex;justify-content:flex-end;margin-top:20px">' +
        '<button class="btn btn-primary" id="ch-continue">Continue →</button></div>';
    side = sideDefault(r, chContactCard());

  } else if (ch.status === "central") {
    /* Raised for a further sign-off. Which desk, and why, is internal. */
    inner = '<div data-testid="ch-signoff">' +
      statusBlock("run", "Rate card pending sign-off",
        "Your rates need one more approval. We\u2019ll message you at " +
        maskPhone(S.phone) + " when there\u2019s an update.") +
      '<div class="tl">' +
        tlRow("ok", "Cluster Head: " + CH_CONTACT.name, "Reviewed and sent for sign-off.") +
        tlRow("now", "Sign-off pending", "We\u2019ll update you here once it\u2019s approved.") +
        tlRow("", nextRowLabel(r), "Available once sign-off is complete.") +
      '</div></div>';
    side = sideDefault(r, chContactCard());

  } else if (ch.status === "revision") {
    /* The rate card is the Area Manager's to revise. The captain is told that
       much and no more — no reason, no desk, no hub category. */
    inner = '<div data-testid="ch-revision">' +
      statusBlock("run", "Rate card being revised",
        "Your Area Manager is updating your rates.") +
      '<div class="tl">' +
        tlRow("now", "Area Manager", "Revising the rate card.") +
        tlRow("", nextRowLabel(r), "Available after your new rates are approved.") +
      '</div></div>';
    side = sideDefault(r, chContactCard());

  } else if (ch.status === "rejected") {
    inner = statusBlock("bad", "Cluster Head rejected this request",
        ch.reason || "Your Cluster Head needs a few changes before this can move ahead.") +
      '<div class="notice bad"><b>Reason</b>' + esc(ch.reason || "Details need correction.") + '</div>' +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="ch-back-pd">Edit personal details</button>' +
        '<button class="btn btn-primary" id="ch-resubmit">Resubmit for review</button></div>';
    side = sideDefault(r, chContactCard());

  } else {
    inner = statusBlock("run", "Cluster Head review in progress",
        CH_CONTACT.name.split(" ")[0] + " is reviewing your request. This usually takes up to 48 hours. You don&rsquo;t need to wait here. We&rsquo;ll message you at " + maskPhone(S.phone) + " when there&rsquo;s an update.") +
      '<div class="tl">' +
        tlRow("ok", "Background verification passed", "Your identity and records are clear.") +
        tlRow("now", "Cluster Head: " + CH_CONTACT.name, "Phone: " + CH_CONTACT.phone) +
        tlRow("", nextRowLabel(r), "Available after approval.") +
      '</div>';
    side = sideDefault(r, chContactCard());
  }

  return {
    left: phaseHeader(r, "Cluster Head review", chPhaseSub(r)) +
          cardWrap("Cluster Head review",
                   fm ? "Rate card review."
                      : chPhaseSub(r), inner),
    side: side
  };
}

/* ----------------------------------------------- 5. security deposit (LM) */

function phaseSD(r) {
  var sd = r.sd, inner;

  if (sd.status === "paid") {

        '<button class="btn btn-primary" id="sd-continue">' + esc(nextLabel(r)) + '</button></div>';
  } else if (sd.status === "failed") {

      '<div class="notice bad"><b>Try again</b>Use a different payment method if the problem repeats.</div>' +

        '<div class="row"><span class="k">Refundable</span><span class="v">Yes, on exit</span></div>' +

  };
}

/* ------------------------------------------------------------ 6. hub details */

/* Facility spec captured at hub details. For FM these feed the Area Manager's
   survey and, through it, the hub categorisation. */
/* Vehicle-type multi-select. Open/closed and the search text are view state, so
   they live here rather than in the persisted role data. The panel is patched in
   place on every interaction — a full render() would replace the search input and
   drop focus mid-typing. */
var vehUI = { open:false, filter:"" };

function vehSummaryHtml(max) {
  if (!max) return '<span class="ph">Select the largest vehicle</span>';
  return '<span class="ms-tok">' + esc(max) + '</span>' +
         '<span class="ms-more">' + vehicleTonnage(max) + ' MT</span>';
}

/* The same framing the submitted summary uses, so the count does not change
   shape between picking a vehicle and reading it back. */
function vehCountText(max) {
  var n = smallerThan(max).length;
  if (!max) return VEHICLE_TYPES.length + " types, smallest first";
  return n ? alsoFitsText(n) : "Smallest type";
}
function alsoFitsText(n) {
  return "Also fits " + n + " smaller " + (n === 1 ? "type" : "types");
}

function vehHintText(max, err) {
  if (err) return err;
  if (!max) {
    return "Pick the biggest vehicle that can reach and park at your hub. We’ll assume smaller ones fit too.";
  }
  var n = smallerThan(max).length;
  return n
    ? "Max " + max + ". The " + n + " smaller " + (n === 1 ? "type" : "types") +
      " in the list are assumed to fit too."
    : "Max " + max + ", the smallest type on the list.";
}

/* Rows are ordered smallest to largest. Everything at or below the chosen row
   is shown as included, so the "and all smaller" rule is visible, not implied. */
function vehRows(max) {
  var q = vehUI.filter.trim().toLowerCase();
  var chosen = vehicleRank(max);
  var list = VEHICLE_TYPES.filter(function (v) {
    return !q || v.toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) {
    return '<div class="ms-empty">No vehicle type matches &ldquo;' + esc(vehUI.filter) + '&rdquo;.</div>';
  }
  return list.map(function (v) {
    var rank = vehicleRank(v);
    var isMax = chosen >= 0 && rank === chosen;
    var included = chosen >= 0 && rank < chosen;
    return '<button type="button" class="ms-row pick' +
             (isMax ? " on" : "") + (included ? " inc" : "") + '" ' +
             'data-veh="' + esc(v) + '" role="option" ' +
             'aria-selected="' + (isMax ? "true" : "false") + '">' +
             '<span class="mark">' + (isMax ? "●" : (included ? "✓" : "")) + '</span>' +
             '<span>' + esc(v) + '</span>' +
             '<i>' + (isMax ? "max" : (included ? "fits" : vehicleTonnage(v) + " MT")) + '</i>' +
           '</button>';
  }).join("");
}

function vehicleField(max, err) {
  return '<div class="fl"><label>Max vehicle size the location can accommodate</label>' +
    '<div class="ms" id="veh-ms">' +
      '<button type="button" id="veh-toggle" aria-expanded="' + (vehUI.open ? "true" : "false") + '" ' +
        'class="ms-control' + (err ? ' bad' : '') + (vehUI.open ? ' open' : '') + '">' +
        '<span class="ms-val">' + vehSummaryHtml(max) + '</span>' +
      '</button>' +
      '<div class="ms-panel" id="veh-panel"' + (vehUI.open ? '' : ' hidden') + '>' +
        '<input class="ms-search" id="veh-search" placeholder="Search vehicle types" ' +
          'value="' + esc(vehUI.filter) + '">' +
        '<div class="ms-list" id="veh-list" role="listbox">' + vehRows(max) + '</div>' +
        '<div class="ms-foot">' +
          '<button type="button" id="veh-none"' + (max ? '' : ' disabled') + '>Clear</button>' +
          '<span class="cnt" id="veh-count">' + esc(vehCountText(max)) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="hint' + (err ? ' err' : '') + '" id="veh-hint">' +
      esc(vehHintText(max, err)) + '</div></div>';
}

function paintVehicleOpen() {
  var ctrl = document.getElementById("veh-toggle");
  var panel = document.getElementById("veh-panel");
  if (!ctrl || !panel) return;
  panel.hidden = !vehUI.open;
  ctrl.classList.toggle("open", vehUI.open);
  ctrl.setAttribute("aria-expanded", vehUI.open ? "true" : "false");
  if (vehUI.open) {
    var sx = document.getElementById("veh-search");
    if (sx) sx.focus();
  }
}

/* The same picker serves the captain's hub details and the Area Manager's
   correction, so it reads and writes whichever field is currently on screen. */
function vehicleCtx() {
  if (S.screen === "admin" && S.admin.selected) {
    var req = apById(S.admin.selected);
    if (req) {
      return { get: function () { return req.am.maxVehicle || ""; },
               set: function (v) { req.am.maxVehicle = v; if (v) req.am.vehicleEditing = false; } };
    }
  }
  return { get: function () { return R().hub.maxVehicle || ""; },
           set: function (v) { R().hub.maxVehicle = v; } };
}

function paintVehicleList() {
  var list = document.getElementById("veh-list");
  if (!list) return;
  list.innerHTML = vehRows(vehicleCtx().get());
  bindVehicleRows();
}

function mapRow(link) {
  var c = parseMapLink(link), shared = !c && isShortMapLink(link);
  return '<div class="row"><span class="k">Map location</span><span class="v">' +
    (c || shared
      ? '<a href="' + esc(c ? gmapsUrl(c) : String(link).trim()) + '" target="_blank" rel="noopener" ' +
        'style="color:var(--cyan-ink);text-decoration:none">' +
        (c ? c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) : 'Google Maps share link') + ' ↗</a>'
      : '-') + '</span></div>';
}

function servicedRow(h) {
  return '<div class="row" data-testid="hub-serviced"><span class="k">Pincodes serviced</span>' +
    '<span class="v">' + esc((h.pincodes || []).join(", ") || "-") + '</span></div>';
}
function hubSpecRows(h) {
  var area = h.areaSqft ? Number(h.areaSqft).toLocaleString("en-IN") + " sq ft" : "-";
  var maxV = h.maxVehicle || "";
  var alsoFits = smallerThan(maxV).length;
  return '<div class="row"><span class="k">Area of the hub</span>' +
           '<span class="v">' + esc(area) + '</span></div>' +
         '<div class="row"><span class="k">Estimated manpower</span>' +
           '<span class="v">' + esc(h.manpower || "-") + '</span></div>' +
         '<div class="row"><span class="k">Max vehicle size</span>' +
           '<span class="v">' + esc(maxV || "-") + '</span></div>' +
         '<div class="row"><span class="k">Smaller types also accommodated</span>' +
           '<span class="v' + (maxV ? '' : ' mute') + '">' +
           (maxV ? alsoFitsText(alsoFits) : "-") + '</span></div>';
}

/* The pincodes this hub will service: up to five, typed or pasted. There is no
   availability check — the captain lists where they want to operate, and the
   Area Manager sees the list. It sits on hub details because the pincodes are
   a property of the hub — an existing captain adding a second hub skips
   personal details entirely, and would otherwise never list any. */
function pincodePicker(h) {
  var e = h.errors || {};
  var chips = h.pincodes.map(function (p) {
    return '<span class="pchip">' + esc(p) +
           '<button data-rmpin="' + esc(p) + '" aria-label="Remove">✕</button></span>';
  }).join("");

  /* A bulk add that landed some pincodes and skipped others is a partial
     success, not a failure — amber, not red. */
  return '<div data-testid="pincode-picker">' +
    '<div class="fl" style="margin-bottom:12px"><label>Pincodes this hub will service</label>' +
      '<div class="box' + (e.pincode ? (h.lastAdded ? ' warn' : ' bad') : '') +
        '" style="justify-content:space-between;padding-right:8px">' +
        '<input id="hub-pins" placeholder="Enter or paste pincodes, e.g. 560076, 560034, 560102">' +
        '<button class="addbtn" id="hub-addpin"' +
          (h.pincodes.length >= 5 ? ' disabled' : '') + '>＋ Add</button></div>' +
      (e.pincode
        ? '<div class="hint ' + (h.lastAdded ? 'warn' : 'err') + '">' + esc(e.pincode) + '</div>'
        : '') +
    '</div>' +
    '<div class="chips">' + (chips || '<span style="font-size:12px;color:var(--muted);line-height:16px">No pincodes added yet.</span>') + '</div>' +
    '<div class="meta-row"><span class="l">Add up to 5 pincodes this hub will cover. You can paste many at once, separated by commas.</span>' +
      '<span class="r">' + h.pincodes.length + ' of 5 added</span></div>' +
  '</div>';
}

/* A pincode the captain has mentioned that the map can open on before the hub
   pincode is complete: one being typed, else one they will service. */
function hubMapNear(h) {
  var known = [h.pinEntry].concat(h.pincodes || []).filter(function (p) { return !!PIN_AREAS[p]; });
  return known[0] || "";
}

/* The Hub pincode field: the pincode the hub sits in, typed straight in. While
   it is part-typed or malformed it shows what was typed. */
var HUB_PIN_HINT = "The 6-digit pincode the hub sits in.";
function hubPinHint(h) {
  var e = h.errors || {};
  if (e.hubPin) return { err:true, text:e.hubPin };
  return { err:false, text:HUB_PIN_HINT };
}
function hubPinField(h) {

/* Re-render, then put the caret back where the captain was typing — a full
   render() replaces the field and would otherwise drop focus mid-entry. */
function renderKeepingFocus(id) {
  var el = document.getElementById(id), had = !!el && document.activeElement === el;
  var pos = had && typeof el.selectionStart === "number" ? el.selectionStart : null;
  render();
  if (!had) return;
  var again = document.getElementById(id);
  if (!again) return;
  again.focus();
  if (pos != null) { try { again.setSelectionRange(pos, pos); } catch (e) {} }
}

/* ------------------------------------------------------------ 9. activation */

function phaseACT(r) {
  var a = r.act, fm = r.role === "FM", list = FANOUT[r.role], inner;

  var actFailed = failOf(r, "act");
  var fan = list.map(function (f) {
    var st = a.done[f.id] ? "ok" : (a.status === "running" ? "now" : "");
    /* only the system that failed is marked — the rest are simply still to run */
    if (a.failed && !a.done[f.id]) st = (!actFailed || actFailed.system === f.id) ? "bad" : "";
    var sub = f.desc + (f.passive ? "" : "");
    return tlRow(st, f.label, sub);
  }).join("");

  if (a.status === "active") {
    inner = statusBlock("ok", "Your hub is active",
        "Your hub is live. You can now use the Captain Panel and start " +
        (fm ? "receiving first mile pickups." : "receiving orders.")) +
      '<div class="kv" style="margin-bottom:16px">' +
        '<div class="row"><span class="k">Hub code</span><span class="v">' +
          esc(r.hub.hubCode || "-") + '</span></div>' +
        '<div class="row"><span class="k">Hub name</span><span class="v">' +
          esc(defaultHubName(r)) + '</span></div>' +
        (fm
          ? '<div class="row"><span class="k">Partner ID</span><span class="v">' +
            esc(a.partnerId || "-") + '</span></div>'
          : '<div class="row"><span class="k">Oracle vendor ID</span><span class="v">' +
            esc(a.vendorId || "-") + '</span></div>') +
        '<div class="row"><span class="k">Activated on</span><span class="v">' +
          esc(a.activatedOn || "-") + '</span></div>' +
        '<div class="row"><span class="k">Captain Panel access</span>' +
          '<span class="v ok">Unlocked</span></div>' +
      '</div>' +
      (fm
        ? '<div class="notice info" data-testid="fm-partner-id"><b>Your payments use your Partner ID</b>' +
          'All your payments are linked to your Partner ID (' + esc(a.partnerId || "-") + ').</div>'
        : '') +
      '<div class="tl">' + fan + '</div>' +
      '<div style="display:flex;justify-content:center;margin-top:20px">' +
        '<button class="btn btn-primary" id="act-panel">Open Captain Panel →</button></div>';

  } else if (a.failed) {
    inner = statusBlock("bad", "Activation paused",
        "Some setup steps didn’t finish. Finished steps are saved. Tap resume to continue.") +
      (actFailed
        ? failNotice(actFailed, "act-retry", "Resume activation")
        : '<div style="display:flex;justify-content:flex-end;margin-bottom:16px">' +
          '<button class="btn btn-primary" id="act-retry">Resume activation</button></div>') +
      '<div class="tl">' + fan + '</div>';

  } else {
    inner = statusBlock("run", "Activation in progress",
        "We’re setting up your hub and Captain Panel. This can take up to 30 minutes. You can close this page. We’ll message you at " +
        maskPhone(S.phone) + " as soon as your hub is live.") +
      (fm
        ? '<div class="notice info" data-testid="fm-design-passive"><b>Your hub code comes a little later</b>It&rsquo;s created once your Area Manager&rsquo;s site visit is processed.</div>'
        : '') +
      '<div class="tl">' + fan + '</div>';
  }

  var lede = a.status === "active" ? "Your hub is active."
           : (a.failed ? "Activation paused." : "Activation in progress.");
  return {
    left: phaseHeader(r, "Activation", lede) + cardWrap("Activation", lede, inner),
    side: sideDefault(r)
  };
}
