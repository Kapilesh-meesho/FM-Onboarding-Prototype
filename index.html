var A = {

  /* ---- auth ---- */
  submitPhone: function () {
    var vxp = vxPhone(S.phone);
    if (vxp) { S.loginError = vxp; save(); render(); return; }
    if (!V.phone(S.phone)) { S.loginError = ERR.phone; save(); render(); return; }
    S.loginError = ""; S.screen = "otp"; S.otp = ["","","","","",""];
    S.otpAttempts = 0; S.otpLocked = false; S.otpError = ""; S.otpSeconds = 25;
    save(); render(); startOtpTimer();
  },
  verifyOtp: function () {
    if (S.otpLocked) return;
    var code = S.otp.join("");
    if (code === "000000") {
      S.otpError = ""; stopOtpTimer();
      if (S.loginAs === "admin") {
        seedAdmin();
        S.screen = "adminselect";
        save(); render(); return;
      }
      /* a sample captain signs in on their own number, whatever was typed */
      if (S.sampleCaptain && S.loginAs === "sample") {
        var sh = hubById(S.sampleCaptain);
        if (sh) S.phone = digitsOf(sh.phone);
      }
      // An existing captain lands in the Captain Hub; a new one starts onboarding.
      S.screen = S.hubs.length ? "panel" : "roles";
      if (S.screen === "panel") { S.panel.section = "hubs"; S.panel.tab = "hubs"; }
      save(); render(); return;
    }
    S.otpAttempts++;
    if (S.otpAttempts >= 3) { S.otpLocked = true; S.otpError = ERR.otpLocked; }
    else S.otpError = ERR.otpWrong + " (" + (3 - S.otpAttempts) + " left)";
    S.otp = ["","","","","",""];
    save(); render();
  },
  resendOtp: function () {
    S.otpSeconds = 25; S.otpError = ""; S.otpAttempts = 0; S.otpLocked = false;
    save(); render(); startOtpTimer();
  },
  logout: function () {
    stopOtpTimer();
    S.screen = "login"; S.activeRole = null;
    S.otp = ["","","","","",""]; S.otpAttempts = 0; S.otpLocked = false; S.otpError = "";
    save(); render();
  },

  /* ---- role selection ---- */
  pickRole: function (code) {
    S.activeRole = code;
    var r = S.roles[code];
    if (!r.started) { r.started = true; r.requestId = makeRequestId(); }
    S.screen = "flow";
    save(); render();
  },
  switchRole: function () { S.screen = "roles"; save(); render(); },

  /* ---- personal details ---- */
  /* Accepts one pincode or many — comma, semicolon, pipe, slash or whitespace
     separated — so a captain can paste a list instead of adding them one at a
     time. Partial success is the normal case: valid entries are added and the
     rest are reported by reason. */
  addPincodes: function (raw) {
    var h = R().hub;             // the picker lives on hub details
    h.errors = h.errors || {};
    delete h.errors.pincode;    // leave any address or map error in place
    h.lastAdded = 0;

    var tokens = String(raw == null ? "" : raw).split(PIN_SPLIT)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });

    if (!tokens.length) { h.errors.pincode = ERR.pincodeFormat; save(); render(); return; }

    var added = [], invalid = [], dupes = [], overflow = [], seen = {};
    tokens.forEach(function (t) {
      if (!V.pincode(t))                                   { invalid.push(t);  return; }
      if (seen[t] || h.pincodes.indexOf(t) >= 0)          { dupes.push(t);    return; }
      if (h.pincodes.length + added.length >= 5)          { overflow.push(t); return; }
      seen[t] = true;
      added.push(t);
    });

    if (added.length) {
      h.pincodes = h.pincodes.concat(added);
      h.lastAdded = added.length;
    }

    if (invalid.length || dupes.length || overflow.length) {
      if (tokens.length === 1) {
        // one entry in, one precise message out
        h.errors.pincode = invalid.length ? ERR.pincodeFormat
                          : dupes.length   ? ERR.pincodeDupe
                          :                  ERR.pincodeMax;
      } else {
        var why = [];
        if (invalid.length) {
          why.push(invalid.length + " not a valid pincode (" +
                   invalid.slice(0, 3).join(", ") + (invalid.length > 3 ? ", …" : "") + ")");
        }
        if (dupes.length)    why.push(dupes.length + " already added");
        if (overflow.length) why.push(overflow.length + " beyond the 5-pincode limit");
        h.errors.pincode =
          (added.length ? "Added " + added.length + ". Skipped " : "Skipped ") + why.join("; ") + ".";
      }
    }
    save(); render();
  },
  /* Kept so single-value callers read naturally. */
  addPincode: function (val) { A.addPincodes(val); },
  removePincode: function (p) {
    var h = R().hub;
    h.pincodes = h.pincodes.filter(function (x) { return x !== p; });
    if (h.errors) delete h.errors.pincode;
    save(); render();
  },
  /* The Hub pincode field takes the pincode the hub sits in. A complete, valid
     one is the hub's pincode straight away — the map and city follow it.
     Nothing is redrawn while the captain is part-way through typing. */
  typeHubPincode: function (v) {
    var h = R().hub;
    h.errors = h.errors || {};
    v = String(v == null ? "" : v).replace(/\D/g, "").slice(0, 6);
    var redraw = !!h.selected || !!h.errors.hubPin;
    h.pinEntry = v;
    delete h.errors.hubPin;
    h.selected = null;
    if (v.length === 6) {

  /* ---- hub details ---- */
  /* Takes a field bag; anything omitted falls back to what is already in state,
     so callers can submit a partial update. */
  hubSubmit: function (f) {
    var r = R(), h = r.hub;
    f = f || {};
    var pick = function (k) { return f[k] !== undefined ? f[k] : h[k]; };
    var address  = pick("address"),  mapLink  = pick("mapLink"),
        areaSqft = pick("areaSqft"), manpower = pick("manpower"),
        maxVehicle = pick("maxVehicle");
    if (Array.isArray(maxVehicle)) {           // tolerate the older list shape
      maxVehicle = maxVehicle.reduce(function (b, v) {
        return vehicleRank(v) > vehicleRank(b) ? v : b; }, "");
    }

    h.errors = {};
    if (!h.selected) h.errors.hubPin = ERR.pincodeSelect;
    if (!h.pincodes.length) h.errors.pincode = ERR.pincodeNone;
    var addrT = String(address == null ? "" : address).trim();
    if (!addrT) h.errors.address = ERR.hubAddress;
    else if (/\b(p\.?\s?o\.?\s*box|c\/o|care\s+of)\b|c\/o/i.test(addrT)) h.errors.address = VX.addrPo;
    else if (addrT.length < 15) h.errors.address = VX.addrShort;
    var pinCheck = checkMapPin(mapLink, h.selected);
    if (!pinCheck.ok) h.errors.mapLink = pinCheck.msg;
    if (pinCheck.code === "format" && /^https?:\/\//i.test(String(mapLink || "").trim()))
      h.errors.mapLink = VX.mapNotGoogle;
    var areaT = String(areaSqft == null ? "" : areaSqft).trim(),
        manT = String(manpower == null ? "" : manpower).trim();
    if (/^[\d,.]+$/.test(areaT) && /[,.]/.test(areaT)) h.errors.areaSqft = VX.areaDec;
    else if (/^\d+$/.test(areaT) && +areaT > 1000000) h.errors.areaSqft = VX.areaMax;
    else if (!V.hubArea(areaSqft))     h.errors.areaSqft = ERR.hubArea;
    if (/^[\d,.]+$/.test(manT) && /[,.]/.test(manT)) h.errors.manpower = VX.manDec;
    else if (/^\d+$/.test(manT) && +manT > 5000) h.errors.manpower = VX.manMax;
    else if (!V.hubManpower(manpower)) h.errors.manpower = ERR.hubManpower;
    if (!V.vehicle(maxVehicle))   h.errors.maxVehicle = ERR.hubVehicle;

    // keep what was entered so the form redraws with the captain's own input
    h.address = address == null ? "" : address;
    h.mapLink = mapLink == null ? "" : mapLink;
    h.areaSqft = areaSqft == null ? "" : String(areaSqft).trim();
    h.manpower = manpower == null ? "" : String(manpower).trim();
    h.maxVehicle = String(maxVehicle == null ? "" : maxVehicle).trim();

    if (Object.keys(h.errors).length) { save(); render(); return; }
    h.pincode = h.selected;
    h.city = cityFor(h.pincode);
    h.submitted = true;
    // LM gets its hub code at submit. FM does not — it is issued during
    // design & hub-code mapping at activation.
    if (r.role === "LM") h.hubCode = h.hubCode || makeHubCode();
    save(); render();

  hubContinue: function () {

  /* ---- Area Manager (LM) ---- */

  amReject: function (reason) {
    var r = R();
    if (r.role !== "LM") return;
    r.am.rejections++;
    r.am.reason = reason || "Facility did not meet requirements.";
    // Two-strike rule: the second rejection leaves the AM and goes to the CH.
    if (r.am.rejections >= 2) { r.am.status = "escalated"; r.am.escalated = true; }
    else r.am.status = "rejected";

  amRejectApp: function () {

  /* The captain has read it. The application is closed and its details are
     deprecated: kept only as a record, never read again, so a new application
     with the same Aadhaar, PAN, bank account, GSTIN or pincodes isn't caught
     as a duplicate of it. A new captain goes back to picking a role; a captain
     adding a hub goes back to My Hubs, their own account untouched. */
  amRejectedAck: function () {
    var role = S.activeRole, r = role && S.roles[role];

    S.closedApps = (S.closedApps || []).concat([{

    }]);
    S.roles[role] = blankRole(role);
    S.hubs = S.hubs.filter(function (h) { return !(h.status === "in_progress" && h.role === role); });
    S.activeRole = null;
    if (r.addingHub && S.hubs.length) {
      S.screen = "panel"; S.panel.section = "hubs"; S.panel.tab = "hubs";

  /* ---- agreements ---- */
  markAgreementRead: function () {

    save(); render();
  },
  setRateAccepted: function (v) { R().ag.rateAccepted = !!v; save(); render(); },

  activate: function () {
    var r = R();

    r.act.status = "running"; r.act.failed = false; r.act.done = {};
    nextPhase();
    runFanout();

  /* ---- activation ---- */
  actFail: function () {
    var r = R();
    if (r.act.status === "active") return;
    stopFanout();
    var sys = FANOUT[r.role].filter(function (f) { return !r.act.done[f.id]; })[0];
    if (!sys) return;
    r.act.status = "failed"; r.act.failed = true;
    r.fail = makeFail("act", "timeout", sys);
    save(); render();
  },
  /* Resume carries on from the system that failed — the ones that finished
     stay finished. */
  actRetry: function () {
    var r = R();
    r.act.status = "running"; r.act.failed = false;
    if (failOf(r, "act")) r.fail = null;
    save(); render();
    runFanout();
  },
  finishActivation: function () {
    var r = R();
    var list = FANOUT[r.role];
    list.forEach(function (f) { r.act.done[f.id] = true; });
    if (r.role === "FM") {
      r.act.partnerId = r.act.partnerId || makePartnerId();
      // FM hub code is minted by design & hub-code mapping, not at hub submit.
      r.hub.hubCode = r.hub.hubCode || makeHubCode();
    } else {
      r.act.vendorId = r.act.vendorId || makeVendorId();
    }
    r.act.status = "active";
    r.act.failed = false;
    r.act.activatedOn = new Date().toLocaleString("en-IN",
      { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });
    r.complete = true;

    /* Onboarding produces a hub the captain then owns, and fills in the
       captain-level record the Captain Hub reads from. */
    if (!S.profile.name) {
      S.profile = {
        name: r.pd.name, email: r.pd.email, altPhone: r.pd.altPhone,
        aadhaar: r.kyc.aadhaar.value, pan: r.kyc.pan.value,
        bank: { bankName:"HDFC Bank", acc:r.kyc.bank.acc, ifsc:r.kyc.bank.ifsc,
                holder:r.pd.name, verified:true }
      };
    }
    var gst = r.newHubGst || { registered: !!r.kyc.gst.registered, gstin: r.kyc.gst.gstin || "" };
    // a hub that went live without GST keeps the Area Manager's approval of it
    if (!gst.registered && r.kyc.gst.noGst) gst.noGst = r.kyc.gst.noGst;
    var hub = makeHub({
      code: r.hub.hubCode, name: defaultHubName(r), role: r.role,
      address: r.hub.address, pincode: r.hub.pincode, city: r.hub.city,
      status: "active", gst: gst,
      areaSqft: r.hub.areaSqft, manpower: r.hub.manpower, mapLink: r.hub.mapLink || "",
      rateCard: r.role === "FM" && chRateSubmitted(r)
        ? { slabs: JSON.parse(JSON.stringify(r.ch.slabs)), touchpoint: r.ch.touchpoint || "",
            agreedOn: fmtDay(new Date()), version: 1 }
        : null,
      maxVehicle: r.hub.maxVehicle || "",
      category: r.ch.category, activatedOn: r.act.activatedOn
    });
    // replace the in-progress placeholder for this role, if one was listed
    S.hubs = S.hubs.filter(function (h) {
      return !(h.status === "in_progress" && h.role === r.role);
    });
    S.hubs.push(hub);
    S.activeHubId = hub.id;

    save(); render();
  },

    S.panel.gst = blankPanel().gst;                     // one editor per card at a time

  hubEditCancel: function () { S.panel.hubEdit = blankPanel().hubEdit; save(); render(); },
  hubEditField: function (k, v) {

  hubEditSubmit: function () {
    var he = S.panel.hubEdit, h = hubById(he.hubId);
    if (!h || !he.draft) return;
    var d = he.draft, e = {};
    d.address = String(d.address || "").trim(); d.pincode = String(d.pincode || "").trim();
    d.mapLink = String(d.mapLink || "").trim(); d.areaSqft = String(d.areaSqft || "").trim();
    if (!d.address) e.address = "Enter the hub address.";
    if (!V.pincode(d.pincode)) e.pincode = ERR.pincodeFormat;
    var chk = checkMapPin(d.mapLink, V.pincode(d.pincode) ? d.pincode : null);
    if (!chk.ok) e.mapLink = chk.msg;
    if (!V.hubArea(d.areaSqft)) e.areaSqft = ERR.hubArea;
    var before = hubDetailsOf(h), after = { address:d.address, pincode:d.pincode,
                                            mapLink:d.mapLink, areaSqft:d.areaSqft };
    if (!Object.keys(e).length &&
        !HUB_EDIT_FIELDS.some(function (f) { return before[f.id] !== after[f.id]; })) {
      e.form = "Nothing has changed yet. Edit at least one detail to send a request.";
    }
    he.errors = e;
    if (Object.keys(e).length) { save(); render(); return; }
    S.hubEdits.push({
      id:"HE-" + String(10000 + Math.floor(Math.random() * 90000)),
      hubId:h.id, hubCode:h.code, hubName:h.name, role:h.role,
      captain:S.profile.name || "Captain", phone:fmtPhone(S.phone),
      before:before, after:after, note:"",
      status:"pending", submittedOn:fmtDay(new Date()), decidedOn:"", reason:"", seen:false
    });

    save(); render();
  },

  /* The Area Manager's decision. Approving writes the requested details onto
     the hub; rejecting needs a reason and leaves the hub untouched. */
  hubEditDecide: function (id, approve, reason) {
    var e = hubEditById(id), h = e && allHubById(e.hubId);
    if (!e || e.status !== "pending") return false;
    if (!approve && !String(reason || "").trim()) return false;

      h.city = knownCity(e.after.pincode) || h.city;

    e.status = approve ? "approved" : "rejected";

  /* Create the draft hub and drop the captain into the ORIGINAL onboarding flow.
     Personal details, KYC and BGV are captain-level and already done, so they are
     carried over and marked complete; the journey starts at Cluster Head review,
     which is the first hub-specific phase for both roles. */
  addHubContinue: function (noGst) {
    var a = S.panel.addHub, pr = S.profile;
    a.error = "";

    var gst;
    if (a.choice === "existing") {
      if (!a.existing) { a.error = "Pick a GSTIN to map to this hub."; save(); render(); return; }
      gst = { registered:true, gstin:a.existing };
    } else if (a.choice === "new") {
      var g = (a.gstin || "").toUpperCase().trim();
      a.result = null;
      var res = verifyGstin(a, g, pr.bank && pr.bank.holder, { pan:pr.pan, name:pr.name });
      if (res.code === "api") { save(); render(); return; }
      if (!res.ok) { a.error = res.error; a.result = res; save(); render(); return; }
      gst = { registered:true, gstin:g };
    } else if (a.role === "FM") {
      noGst = noGst || {};
      a.noGstDraft = { reason:noGst.reason || "", confirm:!!noGst.confirm };
      a.noGstErrors = noGstCheck(noGst.reason, noGst.confirm);
      if (Object.keys(a.noGstErrors).length) { save(); render(); return; }
      gst = { registered:false, gstin:"", noGst:{ reason:noGst.reason, on:fmtDay(new Date()), decision:null } };
      a.noGstDraft = null; a.noGstErrors = null;
    } else {
      gst = { registered:false, gstin:"" };
    }

    var role = a.role;
    var r = blankRole(role);
    r.started = true;
    r.requestId = makeRequestId();
    r.addingHub = true;

    // carry the captain-level record forward
    r.pd = Object.assign(r.pd, {
      name: pr.name, email: pr.email, altPhone: pr.altPhone,
      emailVerified: true
    });
    r.kyc.aadhaar = { done:true, value:pr.aadhaar, otpOpen:false };
    r.kyc.pan     = { done:true, value:pr.pan, father:"Suresh Verma" };
    r.kyc.bank    = { done:true, acc:pr.bank.acc, ifsc:pr.bank.ifsc, pennyDone:true };
    r.kyc.gst     = { registered:gst.registered, gstin:gst.gstin, done:true };
    if (gst.noGst) r.kyc.gst.noGst = gst.noGst;           // the Area Manager reviews it
    r.kyc.msme    = { done:false, fileName:"" };          // optional, not carried
    r.bgv.status  = "passed";
    r.newHubGst   = gst;
    // these are captain-level and already done — never walk them again
    r.carried     = { pd:true, kyc:true, bgv:true };

    // start at hub details — the first phase that is about this hub
    var idx = 0;
    PHASES[role].forEach(function (p, i) { if (p.id === "hub") idx = i; });
    r.phaseIdx = idx;

    S.roles[role] = r;
    /* List it under "Onboarding in progress" so the captain can leave and
       resume it from My Hubs. Activation replaces this placeholder. */
    S.hubs = S.hubs.filter(function (h) { return !(h.status === "in_progress" && h.role === role); });
    S.hubs.push(makeHub({ id:"hub-new-" + role.toLowerCase(), role:role, status:"in_progress", gst:gst }));
    S.activeRole = role;

/* Fan-out animation. Tests call finishActivation() directly instead of waiting. */
var fanTimers = [];
function stopFanout() { fanTimers.forEach(clearTimeout); fanTimers = []; }
function runFanout() {
  stopFanout();
  var r = R(), role = S.activeRole;
  var list = FANOUT[r.role].filter(function (f) { return !r.act.done[f.id]; });   // resume skips finished systems
  list.forEach(function (f, i) {
    fanTimers.push(setTimeout(function () {
      var rr = S.roles[role];
      if (rr.act.status !== "running") return;
      rr.act.done[f.id] = true;
      if (i === list.length - 1) {
        var keep = S.activeRole; S.activeRole = role;
        A.finishActivation();
        S.activeRole = keep;
      } else { save(); render(); }
    }, 420 * (i + 1)));
  });
}

   The tick patches just the countdown text. A full render() here would replace

   which makes the field untypeable while the countdown is running. */

      S.otpSeconds = 0;
      stopOtpTimer();
      render();          // one full render, to swap the countdown for "Resend OTP"

var blurDefHint = {};

  });
  on("phone", "keydown", function (e) { if (e.key === "Enter") A.submitPhone(); });
  on("go-otp", "click", A.submitPhone);

  /* otp */
  /* OTP cells are patched in place rather than re-rendered, so the focused cell
     survives. A full render() here would drop focus and make the row untypeable. */
  function otpCell(i) { return document.querySelector('.otp-cell[data-i="' + i + '"]'); }
  function paintOtpCells() {
    for (var i = 0; i < 6; i++) {
      var c = otpCell(i);
      if (c && c.value !== S.otp[i]) c.value = S.otp[i];
    }
    var vb = document.getElementById("verify-otp");
    if (vb) vb.disabled = !S.otp.every(function (x) { return x !== ""; });
  }
  /* Spread a run of digits across the cells starting at `from`. This is the
     SMS-autofill and paste path: the whole code arrives in a single cell. */
  function fillOtpFrom(from, digits) {
    for (var k = 0; k < digits.length && from + k < 6; k++) S.otp[from + k] = digits[k];
    paintOtpCells();
    var land = otpCell(Math.min(from + digits.length, 5));
    if (land) land.focus();
  }
  A.fillOtpFrom = fillOtpFrom;

  Array.prototype.forEach.call(document.querySelectorAll(".otp-cell[data-i]"), function (el) {
    el.addEventListener("input", function (e) {
      var i = +el.getAttribute("data-i");
      var raw = (e.target.value || "").replace(/\D/g, "");
      S.otpError = "";
      if (raw.length > 1) { fillOtpFrom(i, raw); return; }
      S.otp[i] = raw;
      e.target.value = raw;
      paintOtpCells();
      if (raw && i < 5) { var nx = otpCell(i + 1); if (nx) nx.focus(); }
    });
    el.addEventListener("paste", function (e) {
      var cb = e.clipboardData || window.clipboardData;
      if (!cb) return;
      var digits = (cb.getData("text") || "").replace(/\D/g, "");
      if (!digits) return;
      e.preventDefault();
      fillOtpFrom(+el.getAttribute("data-i"), digits);
    });
    el.addEventListener("keydown", function (e) {
      var i = +el.getAttribute("data-i");
      if (e.key === "Backspace" && !el.value && i > 0) {
        var pv = otpCell(i - 1);
        if (pv) pv.focus();
      }
      if (e.key === "Enter" && S.otp.every(function (x) { return x !== ""; })) A.verifyOtp();
    });
  });
  on("verify-otp", "click", A.verifyOtp);
  on("resend", "click", A.resendOtp);

/* Reflect slab validity without re-rendering the row being typed into. */
function paintSlabState() {
  var r = apById(S.admin.selected);
  if (!r) return;
  Array.prototype.forEach.call(document.querySelectorAll("[data-slabrow]"), function (row) {
    var sl = r.rate.slabs[+row.getAttribute("data-slabrow")];
    if (!sl) return;
    var bad = String(sl.rate).trim() !== "" && !slabValid(sl);
    row.classList.toggle("bad", bad);
    row.classList.toggle("over", !bad && slabOverCeiling(r, sl));
  });
  if (r.stage !== "am") return;

  var complete = !!r.hubCategory && rateCardValid(r.rate);
  var over = complete && !apWithinThreshold(r);

  Array.prototype.forEach.call(document.querySelectorAll("[data-slabrow]"), function (row) {
    var sl = r.rate.slabs[+row.getAttribute("data-slabrow")];
    var cv = row.querySelector(".cv");
    if (!sl || !cv) return;
    var o = slabOverCeiling(r, sl);
    cv.textContent = (r.hubCategory ? ceilingCell(r.hubCategory, r.city, sl) : "-") + (o ? " · over" : "");
    cv.classList.toggle("over", o);
  });

  var chip = document.getElementById("am-rate-status");
  if (chip) {
    chip.textContent = !complete ? "Incomplete" : (over ? "Above ceiling" : "Within ceiling");
    chip.className = "st " + (!complete ? "grey" : (over ? "amber" : "green"));
  }
  var incomplete = document.getElementById("am-rate-incomplete");
  if (incomplete) incomplete.hidden = complete;

  var note = document.getElementById("am-over-ceiling");
  if (note) {
    note.hidden = !over;
    var nt = document.getElementById("am-over-ceiling-text");
    if (nt) nt.textContent = apOverageText(r);
  }

  var gatesPass = AM_GATES.every(function (x) { return r.am.gates[x.id] === true; });
  var ready = gatesPass && amVehicleSettled(r) && complete;
  var approve = document.getElementById("ap-approve");
  if (approve) {
    approve.disabled = !ready;
    approve.innerHTML = over ? "Raise approval request to CH →" : "Approve &amp; send to CH →";
  }
}

/* =========================================================================
   DEV PANEL — stands in for the cluster head / area manager / zonal head
   consoles. See README for why this exists.
   ====================================================================== */

var devOpen = true;

function devBtn(label, action, kind, disabled) {
  return '<button class="da' + (kind ? " " + kind : "") + '" data-dev="' + action + '"' +
         (disabled ? ' disabled' : '') + '>' + label + '</button>';
}


/* Dev panel: the Area Manager closing the application outright. */
function amRejectBtn() { return devBtn("Reject the application", "amapp:reject", "bad"); }

/* Dev panel: the checks a real service answers, armed for the next call. */
function vxGroup(keys) {
  if (!keys.length) return null;
  return { title: "Simulate a check result", html:
    keys.map(function (k) {
      var armed = S.vxNext === k;
      return devBtn((armed ? "Armed · " : "") + VX_SIM[k], "vx:" + k, armed ? "warn" : "");
    }).join("") +
    '<p class="dnone">The next matching check returns this error. Format errors (wrong digits, ' +
    'symbols, typos) show on their own as the captain types or submits. Click an armed one again to disarm it.</p>' };
}
function vxKeys(r, id) {
  if (id === "pd") return r.pd.emailVerified ? [] : ["emailTaken"];
  if (id === "kyc") {
    var step = kycStep(r);
    if (step === "aadhaar") return r.kyc.aadhaar.otpOpen ? [] : ["aadhaarCheck", "aadhaarUsed", "aadhaarAge"];
    if (step === "pan") return ["panName", "panInop"];
    if (step === "bank") return ["ifscUnknown", "ifscNre", "pennyClosed", "pennyName"];
    if (step === "gst" && !r.kyc.gst.noGstOpen) return VX_GST;
  }
  return [];
}

function devActions() {
  /* Login / OTP: choose who is signing in. This is the only place the prototype
     decides between a first-time captain and one who already operates hubs. */
  if (S.screen === "login" || S.screen === "otp") {
    var whoLabel = S.loginAs === "admin" ? "admin" :
                   S.loginAs === "existing" ? "existing captain" :
                   S.loginAs === "sample" ? "sample captain" + (S.sampleCaptain && hubById(S.sampleCaptain)
                     ? " " + hubById(S.sampleCaptain).captain : "") : "new captain";
    return {
      ctx: "Signing in · <b>" + whoLabel + "</b>",
      groups: [{
        title: "Log in as",
        html:
          devBtn("Captain · new, no hubs yet", "as:new", S.loginAs === "new" ? "ok" : "") +
          devBtn("Captain · existing, 4 hubs", "as:existing", S.loginAs === "existing" ? "ok" : "") +
          '<select id="dev-sample" aria-label="Sample captain" style="width:100%;margin:8px 0 4px;padding:8px 8px;' +
            'border-radius:8px;background:#072042;color:#fff;border:1px solid #33415c;font:inherit;font-size:12px;line-height:16px">' +
            PORTFOLIO_HUBS.map(function (h) {
              return '<option value="' + h.id + '"' + (S.sampleCaptain === h.id ? ' selected' : '') + '>' +
                     esc(h.captain) + ' · ' + h.code + '</option>';
            }).join("") + '</select>' +
          devBtn("Captain · sample, the one above", "as:sample", S.loginAs === "sample" ? "ok" : "") +
          devBtn("Admin panel", "as:admin", S.loginAs === "admin" ? "ok" : "") +
          '<p class="dnone">Captain opens the onboarding flow: new starts at role selection, ' +
          'existing lands in the Captain Hub. Admin opens the panel picker: FM Area Manager, ' +
          'FM Cluster Head, FM Zonal Head or FM Central Admin.</p>'
      }]
    };
  }

  if (S.screen === "adminselect") {
    return { ctx: "Admin · choosing a panel.", groups: [] };
  }
  if (S.screen === "admin") {
    var adminGroups = [{ title: "Admin panel", html:
      '<p class="dnone">You are the backend here. Decisions are made in the panel itself, ' +
      'not simulated from this box.</p>' }];
    if (S.admin.role === "central") {
      adminGroups.unshift({ title: "Central Admin role", html:
        CENTRAL_PERSONA_ORDER.map(function (k) {
          return devBtn(CENTRAL_PERSONAS[k].label, "ca:" + k, S.admin.central === k ? "ok" : "");
        }).join("") +
        '<p class="dnone">Central Admin is three roles. Pick which one is signed in: BizFin approves rate cards ' +
        'above the ceilings and slab changes; the Design team aligns carting designs; FM Central Ops acts on AM ' +
        'and CH steps, updates rate cards in bulk and proposes slab changes.</p>' });
    }
    /* stand in for whoever the open update is waiting on */
    var sel = S.admin.selected && apById(S.admin.selected);
    if (sel && sel.noGst && sel.noGst.decision === "declined") {
      adminGroups.push({ title: "Captain · " + sel.captain, html:
        devBtn("Captain adds a GSTIN", "nogst:gstin", "ok") +
        '<p class="dnone">Stands in for the captain adding a verified GSTIN after the decline.</p>' });
    }
    var rh = S.admin.rate && allHubById(S.admin.rate), ru = rh && rateUpdateFor(rh.id);
    if (ru) adminGroups.push(ruDevGroup(ru));
    return {
      ctx: "<b>" + esc(apRole().label) + "</b> · " +
           esc(S.admin.rate || S.admin.edit || S.admin.hubView || S.admin.selected || S.admin.tab),
      groups: adminGroups
    };
  }

  if (S.screen === "roles") {
    return { ctx: "Choosing a role.", groups: [] };
  }

  /* Captain Hub */
  if (S.screen === "panel") {
    var bk = S.panel.bank, groups = [];
    if (bk.open && bk.step === "verifying") {
      groups.push({ title: "Bank penny-drop", html:
        devBtn("Penny-drop succeeded", "bank:ok", "ok") +
        devBtn("Penny-drop failed", "bank:fail", "bad") +
        devBtn("Bank times out (504)", "bank:timeout", "warn") +
        devBtn("IMPS down at the bank (503)", "bank:down", "warn") });
    } else if (bk.open) {
      groups.push({ title: "Bank change", html:
        '<p class="dnone">Step: ' + esc(bk.step) + '. The penny-drop outcome is simulated ' +
        'once the new account is submitted.</p>' });
    }
    /* the Captain Hub is the signed-in captain's — only their own hubs' requests */
    var ruP = S.rateUpdates.filter(function (u) { return ruOpen(u) && !!hubById(u.hubId); })[0];
    var ruHub = rateHubs().filter(function (h) { return !!hubById(h.id) && !rateUpdateFor(h.id); })[0];
    if (ruP) groups.push(ruDevGroup(ruP));
    else if (ruHub) {
      groups.push({ title: "Area Manager", html:
        devBtn("Send a rate card update for " + ruHub.code, "rate:send:" + ruHub.id) +
        '<p class="dnone">Or sign in as the Area Manager and use the Rate card updates tab.</p>' });
    }
    var heP = S.hubEdits.filter(function (e) { return e.status === "pending" && !!hubById(e.hubId); })[0];
    if (heP) {
      groups.push({ title: "Area Manager · hub edit " + heP.id, html:
        devBtn("Approve edit", "he:approve:" + heP.id, "ok") +
        devBtn("Reject edit", "he:reject:" + heP.id, "bad") +
        '<p class="dnone">Or sign in to the admin panel as the Area Manager and decide it from ' +
        'the Hub edits tab.</p>' });
    }
    var gstEntry = (S.panel.gst.hubId && S.panel.gst.mode === "edit") ||
                   (S.panel.section === "addhub" && S.panel.addHub.choice === "new");
    if (gstEntry) groups.push(failGroup(["gst"]), vxGroup(VX_GST), gstRegistryGroup());
    if (!groups.length) {
      groups.push({ title: "Captain Hub", html:
        '<p class="dnone">No backend actors act here. Profile and hub edits are ' +
        'captain-driven. Add a hub to re-enter onboarding.</p>' });
    }
    return { ctx: "<b>Captain Hub</b> · " + esc(S.panel.section), groups: groups };
  }

  if (S.screen !== "flow") {
    return { ctx: "Not in an onboarding flow.", groups: [] };
  }
  var r = R(), id = phaseId(), fm = r.role === "FM";
  var ctx = "<b>" + ROLE_META[r.role].name + "</b> · " + phases()[r.phaseIdx].title;
  var groups = [];

  if (id === "bgv") {
    if (failOf(r, "bgv")) {
      groups.push({ title: "Background verification", html:
        '<p class="dnone">Paused. The check reaches the partner again when the captain ' +
        'resumes.</p>' });
    } else {
      groups.push({ title: "Background verification", html:
        devBtn("Mark BGV passed", "bgv:passed", "ok") +
        devBtn("Mark BGV failed", "bgv:failed", "bad") +
        (r.bgv.status === "pending"
          ? devBtn("Partner times out (504)", "bgvfail:timeout", "warn") +
            devBtn("Partner is down (503)", "bgvfail:down", "warn")
          : "") });
    }
  }

  /* The calls the captain makes on this step that can fail. */
  var armable = armableApis(r, id);
  if (armable.length) groups.push(failGroup(armable));
  var vxk = vxGroup(vxKeys(r, id));
  if (vxk) groups.push(vxk);
  if (id === "kyc" && kycStep(r) === "gst" && !r.kyc.gst.noGstOpen) groups.push(gstRegistryGroup());

  if (id === "ch") {
    var ng = fm ? noGstState(r.kyc.gst) : null;
    if (ng === "pending") {
      groups.push({ title: "Area Manager · no-GST declaration", html:
        '<p class="dnone">' + esc(r.kyc.gst.noGst.reason) + '</p>' +
        devBtn("Approve: continue without GST", "nogst:approve", "ok") +
        devBtn("Decline: ask for a GSTIN", "nogst:decline", "bad") + amRejectBtn() });
    } else if (ng === "declined") {
      groups.push({ title: "Area Manager", html:
        '<p class="dnone">Declined the no-GST declaration. Waiting for the captain to add a GSTIN.</p>' });
      groups.push(gstRegistryGroup());
    } else if (fm && r.amRejected) {
      groups.push({ title: "Area Manager", html:
        '<p class="dnone">Rejected the application on ' + esc(r.amRejected.on) + '. Waiting for the captain to ' +
        'acknowledge it.</p>' });
    } else if (fm) {
      if (!r.ch.category) {
        groups.push({ title: "Area Manager · pick hub type", html:
          CATEGORY_ORDER.map(function (c) {
            var m = HUB_CATEGORIES[c];
            return devBtn(m.label + " · slabs " + ceilingText(c, chCity(r)), "cat:" + c);
          }).join("") + amRejectBtn() });
      } else {
        var m = HUB_CATEGORIES[r.ch.category];
        var above = chAboveCeiling(r);

        if (!chRateSubmitted(r)) {
          groups.push({ title: "Area Manager", html:
            '<p class="dnone">' + m.label + " · slab ceilings " + ceilingText(r.ch.category, chCity(r)) +
            " · touchpoint fixed at " + money(m.tp) + '</p>' +
            devBtn("Submit rate card within ceiling", "am:rate-within", "ok") +
            devBtn("Submit rate card above ceiling", "am:rate-above", "warn") +
            devBtn("Change hub type", "cat:clear") + amRejectBtn() });
        } else if (r.ch.status === "central") {
          groups.push({ title: "BizFin", html:
            devBtn("Approve rate card", "central:approve", "ok") +
            devBtn("Reject → back to Area Manager", "central:reject", "bad") });
        } else if (r.ch.status === "revision") {
          groups.push({ title: "Area Manager revision", html:
            devBtn("Reprice within ceiling and resubmit", "am:reprice", "ok") + amRejectBtn() });
        } else if (r.ch.status !== "approved") {
          groups.push({ title: "Cluster Head", html:
            (above
              ? devBtn("Raise to BizFin", "ch:raise", "warn")
              : devBtn("Approve rate card", "ch:approve", "ok")) +
            devBtn("Reject → back to Area Manager", "ch:reject", "bad") });
        } else {
          groups.push({ title: "Cluster Head", html:
            '<p class="dnone">Rate card approved.</p>' });
        }
      }
    } else {
      groups.push({ title: "Cluster Head decision", html:
        devBtn("Approve", "ch:approve", "ok") +
        devBtn("Reject", "ch:reject", "bad") });
    }
  }

  if (id === "sd" && !fm) {
    groups.push({ title: "Security deposit", html:
      devBtn("Force success", "sd:paid", "ok") +
      devBtn("Force failure", "sd:failed", "bad") +
      devBtn("Force quote expired", "sd:expired", "warn") });
  }

  if (id === "am" && !fm) {
    groups.push({ title: "Area Manager decision", html:
      devBtn("Approve", "am:approve", "ok") +
      devBtn("Reject (" + r.am.rejections + " of 2 used)", "am:reject", "bad") });
  }

  if (id === "act") {
    groups.push({ title: "Activation", html:
      devBtn("Force failure", "act:fail", "bad") +
      devBtn("Force success", "act:done", "ok") });
  }

  if (id === "ag") {
    groups.push({ title: "Agreements", html:
      devBtn("Mark agreement scrolled to end", "ag:read") });
  }

  if (!groups.length) {
    groups.push({ title: "This phase", html:
      '<p class="dnone">No backend actors act on this phase. It is entirely ' +
      'captain-driven.</p>' });
  }
  return { ctx: ctx, groups: groups };
}

/* Dev panel: stand in for the desk an update is waiting on. */
function ruDevGroup(u) {
  if (u.status === "ch") {
    return { title: "Cluster Head · " + u.id, html:
      devBtn("Approve and send to the Zonal Head", "ru:approve:" + u.id, "ok") +
      devBtn("Send back to the Area Manager", "ru:reject:" + u.id, "bad") };
  }
  if (u.status === "zh") {
    return { title: "Zonal Head · " + u.id, html:
      devBtn(ruAbove(u) ? "Approve and send to BizFin" : "Approve and send to the captain", "ru:approve:" + u.id, "ok") +
      devBtn("Send back to the Area Manager", "ru:reject:" + u.id, "bad") };
  }
  if (u.status === "central") {
    return { title: "BizFin · " + u.id, html:
      devBtn("Approve and send to the captain", "ru:approve:" + u.id, "ok") +
      devBtn(u.source === "bulk" ? "Don’t approve" : "Send back to the Area Manager", "ru:reject:" + u.id, "bad") };
  }
  if (u.status === "captain") {
    return { title: "Captain · " + u.captain, html:
      devBtn(u.captain + " agrees to " + u.id, "ru:agree:" + u.id, "ok") +
      '<p class="dnone">Stands in for the captain agreeing from their bell. Questions go to the Area Manager ' +
      'by phone; there is no decline.</p>' };
  }
  return { title: "Rate card update " + u.id, html: '<p class="dnone">' +
    (u.status === "revision" ? "Sent back. Waiting for the Area Manager to revise or withdraw it."
     : "Agreed and published. It applies from " + fmtIso(u.effectiveFrom) + ".") + '</p>' };
}

          var armed = S.failNext && S.failNext[api] === kind;
          return devBtn((armed ? "Armed · " : "") + "Fail next " + API_FAIL[api].call + " · " +

    'it from the same step. Click an armed one again to disarm it.</p>' };
}

/* The backend calls a captain can trigger from where they are. */
function armableApis(r, id) {
  if (id === "pd")  return r.pd.emailVerified || r.pd.emailLocked ? [] : ["email"];
  if (id === "kyc") {
    var step = kycStep(r);
    if (step === "gst" && r.kyc.gst.noGstOpen) return [];    // nothing is called on the declaration
    return ["aadhaar", "pan", "bank", "gst"].indexOf(step) >= 0 ? [step] : [];
  }
  return [];
}

function renderDev() {
  var host = document.getElementById("dev");
  if (!host) return;
  var d = devActions();

  var body = devOpen
    ? '<div class="db">' +
        '<p class="dctx">' + d.ctx + '</p>' +
        d.groups.map(function (g) {
          return '<div class="dgrp"><span>' + esc(g.title) + '</span>' + g.html + '</div>';
        }).join("") +
        '<button class="dreset" data-dev="reset">Reset entire demo</button>' +
      '</div>'
    : "";

  host.innerHTML =
    '<div class="dp">' +
      '<button class="dh" id="dev-toggle"><b>⚙ Simulate backend</b>' +
        '<i>' + (devOpen ? "hide" : "show") + '</i></button>' +
      body +
    '</div>';

  on("dev-toggle", "click", function () { devOpen = !devOpen; renderDev(); });
  Array.prototype.forEach.call(host.querySelectorAll("[data-dev]"), function (el) {
    el.addEventListener("click", function () { devDo(el.getAttribute("data-dev")); });
  });
}

function devDo(cmd) {
  var parts = cmd.split(":"), ns = parts[0], arg = parts[1];

  if (cmd === "reset") { A.resetAll(); return; }

  switch (ns) {
    case "as":
      S.loginAs = arg;
      /* Switching who signs in keeps what the others did — a hub edit the
         captain sent is still there when the Area Manager signs in, and the
         decision is still there when the captain comes back. */
      if (arg === "sample") {
        var pick = document.getElementById("dev-sample");
        becomeSampleCaptain(pick ? pick.value : PORTFOLIO_HUBS[0].id);
      }
      else if (arg === "existing") { restoreSelf(); if (!S.seededExisting) seedExistingCaptain(); }
      else if (arg === "admin") {
        seedAdmin();
        S.admin = blankAdmin();
      }
      else { restoreSelf();
             S.profile = blankProfile(); S.hubs = []; S.activeHubId = null;
             S.hubEdits = S.hubEdits.filter(function (e) { return isNetworkHubId(e.hubId); });
             S.rateUpdates = S.rateUpdates.filter(function (u) { return isNetworkHubId(u.hubId); });
             S.amChanges = (S.amChanges || []).filter(function (c) { return !c.hubId || isNetworkHubId(c.hubId); });
             S.seededExisting = false;
             S.roles = { LM: blankRole("LM"), FM: blankRole("FM") }; }
      save(); render();
      break;
    case "bank":
      if (FAIL_CODE[arg]) { A.bankApiFail(arg); break; }
      A.bankPennyResult(arg === "ok", arg === "ok" ? "" :
        "The account name doesn’t match your KYC name.");
      break;
    case "fail": A.armFail(arg, parts[2]); break;
    case "vx":
      S.vxNext = S.vxNext === arg ? null : arg;
      save(); render();
      break;
    case "ca": A.adminCentralAs(arg); break;
    case "ru":
      var ruU = rateUpdateById(parts[2]);
      if (ruU) {
        if (arg === "agree") captainAgree(ruU);
        else rateUpdateDecide(ruU, ruU.status, arg,
          arg === "reject" ? "Keep the first slab as it is. Volumes don\u2019t support it yet." : "");
        if (ruU.status === "zh") S.admin.toast = ruU.id + " sent to the Zonal Head.";
        if (ruU.status === "central") S.admin.toast = ruU.id + " sent to BizFin.";
        if (ruU.status === "captain") S.admin.toast = ruU.id + " sent to " + ruU.captain + " to agree.";
        if (ruU.status === "published") S.admin.toast = ruU.id + " published. It applies from " +
          fmtIso(ruU.effectiveFrom) + ".";
        save(); render();
      }
      break;
    case "rate":
      if (arg === "send") {
        var keepAdmin = S.admin;
        S.admin = Object.assign(blankAdmin(), { role:"am" });
        A.adminRateOpen(parts[2]);
        var dr = S.admin.rateDraft;
        if (dr) {
          dr.slabs = dr.slabs.map(function (sl) {
            return Object.assign({}, sl, { rate:Math.max(0, +sl.rate - 0.3).toFixed(2) }); });
          A.adminRateSend();
        }
        S.admin = keepAdmin;
        save(); render();
      }
      break;
    case "he":
      A.hubEditDecide(parts[2], arg === "approve",
        arg === "approve" ? "" : "The new location did not pass the Area Manager\u2019s site check.");
      break;
    case "gstfill":
      var gf = document.getElementById("gst-input") || document.getElementById("addhub-gstin") ||
               document.getElementById("kyc-gstin") || document.getElementById("ch-gstin");
      if (gf) { gf.value = arg; gf.dispatchEvent(new Event("input", { bubbles:true })); }
      break;
    case "bgvfail": A.bgvApiFail(arg); break;
    case "bgv": A.bgvSet(arg); break;
    case "amapp": A.amRejectApp(); break;
    case "nogst":
      if (arg === "gstin") A.amNoGstGstin();
      else A.chNoGstDecide(arg === "approve");
      break;
    case "cat":
      if (arg === "clear") { R().ch.category = null; save(); render(); }
      else A.chSetCategory(arg);
      break;
    case "ch":
      if (arg === "approve")     A.chApprove();
      else if (arg === "raise")  A.chRaise();
      else if (arg === "reject") A.chReject();
      break;
    case "central":
      if (arg === "approve") A.centralApprove(); else A.centralReject();
      break;
    case "sd": A.sdSet(arg); break;
    case "am":
      if (arg === "rate-within")     A.amSubmitRate(false);
      else if (arg === "rate-above") A.amSubmitRate(true);
      else if (arg === "reprice")    A.amReprice();
      else if (arg === "approve")    A.amApprove();
      else                           A.amReject();
      break;
    case "ag": A.markAgreementRead(); break;
    case "act":
      if (arg === "fail") A.actFail();
      else { stopFanout(); A.finishActivation(); }
      break;
  }
}
