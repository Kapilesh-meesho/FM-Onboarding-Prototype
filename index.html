                   "27":"Maharashtra", "29":"Karnataka", "32":"Kerala", "33":"Tamil Nadu",
                   "36":"Telangana" };
var GST_REGISTRY = {
  ABCDE1234F: { legal:"KARAN VERMA", trade:"VERMA LOGISTICS", type:"Proprietorship", status:"Active" },
  ZZZZZ9999Z: { legal:"VERMA KARAN KUMAR", trade:"KKV TRANSPORTS", type:"Proprietorship", status:"Active" },
  AAJFS4321M: { legal:"SHREE GANESH TRANSPORT CO", trade:"SHREE GANESH TRANSPORT",
                type:"Partnership", status:"Active" },
  AAGCV7788L: { legal:"VERMA FREIGHT PRIVATE LIMITED", trade:"VERMA FREIGHT",
                type:"Private limited company", status:"Cancelled", cancelledOn:"31 Mar 2025" }
};

function gstLookup(gstin, own) {
  var pan = gstin.slice(2, 12);
  var rec = own && own.pan && own.name && pan === String(own.pan).toUpperCase()
    ? { legal:String(own.name).toUpperCase(), trade:"", type:"Proprietorship", status:"Active" }
    : GST_REGISTRY[pan];
  return rec ? Object.assign({ gstin:gstin, state:GST_STATES[gstin.slice(0, 2)] || "-" }, rec) : null;
}

/* Fuzzy name match. Names are compared word by word in any order ("VERMA
   KARAN" is "Karan Verma"), after dropping case, punctuation, honorifics and
   legal-form words (Mr, Shri, M/s, Pvt, Ltd, LLP…). Each word of the shorter
   name pairs with its closest unused word in the other — exact, an initial
   ("K" for "Karan", a weak match), or by Jaro-Winkler for spelling slips —
   and the total is scored against both names' lengths, so a missing or
   extra word costs as much as a wrong one. */
var NAME_NOISE = ["mr","mrs","ms","miss","shri","sri","smt","kumari","dr","messrs",
                  "pvt","private","ltd","limited","llp","co","company","and","the"];
var NAME_MATCH = 0.95, NAME_SIMILAR = 0.78;

function nameTokens(n) {
  return String(n || "").toLowerCase().replace(/m\/s\.?/g, " ").replace(/&/g, " and ")
    .replace(/[^a-z\s]/g, " ").split(/\s+/)
    .filter(function (t) { return t && NAME_NOISE.indexOf(t) < 0; });
}
function jaro(a, b) {
  if (a === b) return 1;
  var la = a.length, lb = b.length;
  if (!la || !lb) return 0;
  var win = Math.max(0, Math.floor(Math.max(la, lb) / 2) - 1);
  var ma = [], mb = [], m = 0, t = 0, i, j, k;
  for (i = 0; i < la; i++) {
    for (j = Math.max(0, i - win); j < Math.min(lb, i + win + 1); j++) {
      if (mb[j] || a.charAt(i) !== b.charAt(j)) continue;
      ma[i] = mb[j] = true; m++; break;
    }
  }
  if (!m) return 0;
  for (i = 0, k = 0; i < la; i++) {
    if (!ma[i]) continue;
    while (!mb[k]) k++;
    if (a.charAt(i) !== b.charAt(k)) t++;
    k++;
  }
  return (m / la + m / lb + (m - t / 2) / m) / 3;
}
function jaroWinkler(a, b) {
  var j = jaro(a, b), p = 0;
  while (p < 4 && p < a.length && p < b.length && a.charAt(p) === b.charAt(p)) p++;
  return j + p * 0.1 * (1 - j);
}
function nameScore(a, b) {
  var x = nameTokens(a), y = nameTokens(b);
  if (!x.length || !y.length) return 0;
  if (x.length > y.length) { var tmp = x; x = y; y = tmp; }
  var used = [], total = 0;
  x.forEach(function (w) {
    var best = 0, bi = -1;
    y.forEach(function (v, i) {
      if (used[i]) return;
      var sc = w === v ? 1
        : (w.length === 1 && v.charAt(0) === w) || (v.length === 1 && w.charAt(0) === v) ? 0.75
        : jaroWinkler(w, v);
      if (sc > best) { best = sc; bi = i; }
    });
    if (bi >= 0) used[bi] = true;
    total += best;
  });
  return 2 * total / (x.length + y.length);
}

/* The registration's legal and trade names, each against the bank account
   holder; the closer one counts. */
function gstNameCheck(rec, bankName) {
  var best = { score:0, on:"legal", gstName:rec.legal };
  [["legal", rec.legal], ["trade", rec.trade]].forEach(function (p) {
    if (!p[1]) return;
    var sc = nameScore(p[1], bankName);
    if (sc > best.score) best = { score:sc, on:p[0], gstName:p[1] };
  });
  best.bankName = bankName || "";
  best.pct = Math.round(best.score * 100);
  best.level = best.score >= NAME_MATCH ? "match" : (best.score >= NAME_SIMILAR ? "similar" : "mismatch");
  return best;
}

/* The whole check, shared by KYC, Manage GSTIN and Add a new hub: the format,
   the GST portal (which can fail like any backend call — `holder` keeps the
   failure for Resume), the registration's status, then its name against the
   bank account payouts go to. A similar name is accepted and labelled so. */
function verifyGstin(holder, gstin, bankName, own) {
  gstin = String(gstin || "").toUpperCase().trim();
  if (!V.gstin(gstin)) return { ok:false, code:"format", error:ERR.gstin };
  var vxg = vxTake(VX_GST);
  if (vxg) return { ok:false, code:"vx", error:VX[vxg] };
  if (!apiCall(holder, "gst")) return { ok:false, code:"api" };
  var rec = gstLookup(gstin, own);
  if (!rec) return { ok:false, code:"notfound", error:ERR.gstNotFound };
  if (rec.status !== "Active") {
    return { ok:false, code:"inactive", record:rec,
             error:"This GSTIN was " + rec.status.toLowerCase() +
                   (rec.cancelledOn ? " on " + rec.cancelledOn : "") + ". Use an active GSTIN." };
  }
  var m = gstNameCheck(rec, bankName);
  if (m.level === "mismatch") return { ok:false, code:"name", record:rec, match:m, error:ERR.gstName };
  return { ok:true, code:m.level, record:rec, match:m };
}

function parseMapLink(link) {
  var s = String(link || "");
  try { s = decodeURIComponent(s); } catch (e) { /* leave it encoded */ }
  var num = "(-?\\d{1,3}(?:\\.\\d+)?)";
  var pats = [
    new RegExp("!3d" + num + "!4d" + num),
    new RegExp("@" + num + "," + num),
    new RegExp("[?&](?:q|query|ll|center|destination|daddr)=(?:loc:)?" + num + ",\\s*\\+?" + num),
    new RegExp("/(?:place|search|dir)/" + num + ",\\s*\\+?" + num)

  return 2 * R * Math.asin(Math.sqrt(h));
}

   pin, the pin is a real place in India, and it sits inside the hub's pincode —
   both nearer that pincode than any other and within reach of its centre. */

   Share button gives. It carries no coordinates, only a redirect. */
function isShortMapLink(link) {
  return /^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)\//i.test(String(link || "").trim());
}

function checkMapPin(link, pin) {
  link = String(link || "").trim();
  if (!link) return { ok:false, code:"empty", msg:ERR.mapLink };
  if (!V.mapLink(link)) return { ok:false, code:"format",
    msg: /^https?:\/\//i.test(link) ? VX.mapNotGoogle : ERR.mapLink };
  var c = parseMapLink(link);
  if (!c) {

       server to follow the redirect, so this prototype can't preview it or
       check it against the pincode — it opens in Google Maps instead. */
    if (isShortMapLink(link)) return { ok:true, code:"shared", shared:true, msg:"" };
    return { ok:false, code:"nocoords", msg:ERR.mapNoPin };

  var out = { lat:c.lat, lng:c.lng };
  if (Math.abs(c.lat) > 90 || Math.abs(c.lng) > 180) {
    return Object.assign(out, { ok:false, code:"range", msg:ERR.mapRange, short:"Invalid location" });
  }
  if (c.lat < 6.5 || c.lat > 37.5 || c.lng < 68 || c.lng > 97.5) {
    return Object.assign(out, { ok:false, code:"india", msg:ERR.mapIndia, short:"Outside India" });
  }
  var area = pin && PIN_AREAS[pin];
  if (!area) return Object.assign(out, { ok:true, code:"nopin", pending:true });

  var dSel = haversineKm(c, area), nearest = null, dNear = Infinity;
  Object.keys(PIN_AREAS).forEach(function (k) {
    var d = haversineKm(c, PIN_AREAS[k]);
    if (d < dNear) { dNear = d; nearest = k; }
  });
  out.distKm = dSel; out.nearest = nearest;
  if (nearest !== pin && dNear <= PIN_RADIUS_KM) {
    return Object.assign(out, { ok:false, code:"elsewhere", short:"Outside " + pin,
      msg:"This pin is in " + nearest + " (" + PIN_AREAS[nearest].name + "), not the hub\u2019s pincode " +

  if (dSel > PIN_RADIUS_KM) {
    return Object.assign(out, { ok:false, code:"far", short:"Outside " + pin,
      msg:"This pin is " + dSel.toFixed(1) + " km from the " + pin + " (" + area.name +

var MAP_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" ' +
                      'rel="noopener">OpenStreetMap</a> contributors';
// where a map with no pin and no pincode to go on opens: central Bengaluru
var MAP_HOME = { lat:12.9716, lng:77.5946, zoom:11 };
var mapTileIdx = 0;      // the tile server that last worked
var liveMaps = [];       // mounted maps; let go of once a render replaces them
var mapViews = {};       // where each map was left, so a re-render doesn't move it

function hasLeaflet() {
  return typeof window !== "undefined" && !!window.L && typeof window.L.map === "function";
}
function mapHasPin(c) { return !!c && c.lat != null && c.code !== "range"; }
function mapTone(c) { return !c.ok ? "bad" : c.pending ? "wait" : "ok"; }

/* Where a map opens: on the pin; failing that on the hub's pincode, or on
   `near` (a pincode the captain has mentioned); failing that, central Bengaluru. */
function mapStartView(c, pin, near) {
  if (mapHasPin(c)) return { lat:c.lat, lng:c.lng, zoom:16 };
  var a = PIN_AREAS[pin] || PIN_AREAS[near];
  return a ? { lat:a.lat, lng:a.lng, zoom:14 } : MAP_HOME;
}

/* Redraw the preview and the field's hint in place as the link is typed, so the
   input keeps focus. `loud` reports a broken link — used once the captain
   leaves the field, not on every keystroke while they are mid-paste. */
/* `prefix` names the field's box, hint and preview elements (hub details uses
   "hub-map", the Area Manager's edit "ap-map"); `idle` is the hint shown while
   the pin checks out. A live map is never redrawn: its pin moves, and follows
   the field unless the change came from the map itself (`fromMap`). */
function paintMapPreview(link, pin, loud, prefix, idle, fromMap) {
  prefix = prefix || "hub-map";
  var box = document.getElementById(prefix + "-box"),
      hint = document.getElementById(prefix + "-hint"),
      prev = document.getElementById(prefix + "-preview");
  if (!prev) return;
  var c = checkMapPin(link, pin);
  var frame = prev.querySelector(".map-frame"), lm = frame && frame._lm;
  if (lm) {
    var meta = prev.querySelector(".map-meta"), next = mapMetaHtml(c, link, pin, prefix);
    if (meta) meta.outerHTML = next;
    else if (next) prev.querySelector(".map-prev").insertAdjacentHTML("beforeend", next);
    syncMapPin(lm, c, pin, !fromMap);
  } else {
    var key = (c.lat == null ? (c.shared ? String(link).trim() : "") : c.lat + "," + c.lng) + "|" +
              (pin || "") + "|" + c.code;
    if (prev.getAttribute("data-key") !== key) {
      prev.innerHTML = mapPreviewHtml(link, pin, {
        pick: prefix,
        key: frame ? frame.getAttribute("data-map") : prefix,
        near: frame ? frame.getAttribute("data-map-near") : ""
      });
      prev.setAttribute("data-key", key);
      mountMaps();
    }
  }
  var show = !c.ok && String(link || "").trim() && (loud || c.lat != null);
  if (box) box.classList.toggle("bad", !!show);
  if (hint) {
    hint.classList.toggle("err", !!show);
    hint.textContent = show ? c.msg : (idle || MAP_HINT);
  }
}

function gmapsUrl(c) { return "https://www.google.com/maps?q=" + c.lat + "," + c.lng; }

/* The pin on a map, with whether it sits inside the pincode. A map that only
   shows a pin draws nothing until the link gives a location. A map the pin can
   be dropped on (`opts.pick`: the field's id) shows from the start. `opts.key`
   names the map so a re-render can put it back where it was left. */
function mapPreviewHtml(link, pin, opts) {
  opts = opts || {};
  var c = checkMapPin(link, pin);
  if (!opts.pick) {
    if (c.shared) {
      return '<div class="map-prev" data-testid="map-preview-shared"><div class="map-meta">' +
        '<span class="coords">Google Maps share link</span>' +
        '<a href="' + esc(String(link).trim()) + '" target="_blank" rel="noopener">Open in Google Maps ↗</a>' +
        '</div></div>';
    }
    if (!mapHasPin(c)) return "";
  }
  return '<div class="map-prev' + (opts.pick ? ' pick' : '') + '" data-testid="map-preview">' +
    mapFrameHtml(c, pin, opts) + mapMetaHtml(c, link, pin, opts.pick) + '</div>';
}

/* The map itself: an empty frame Leaflet is mounted in after the render
   (mountMaps), carrying where to open and where the pin is. */
function mapFrameHtml(c, pin, opts) {
  var pick = opts.pick || "", v = mapStartView(c, pin, opts.near), has = mapHasPin(c);
  var data = ' data-map="' + esc(opts.key || pick || "view") + '"' +
    ' data-map-view="' + v.lat + ',' + v.lng + ',' + v.zoom + '"' +
    (has ? ' data-map-pin="' + c.lat + ',' + c.lng + '" data-map-tone="' + mapTone(c) + '"' : '') +
    (pick ? ' data-map-pick="' + esc(pick) + '"' : '') +
    (opts.near ? ' data-map-near="' + esc(opts.near) + '"' : '');
  var inner = hasLeaflet() ? ''
    : has
      ? '<iframe title="Map preview of the hub location" loading="lazy" ' +
        'referrerpolicy="no-referrer-when-downgrade" ' +
        'src="https://maps.google.com/maps?q=' + c.lat + ',' + c.lng + '&amp;z=16&amp;output=embed"></iframe>'
      : '<div class="map-off" data-testid="map-off">The map couldn’t load here. ' +
        'Paste a Google Maps link instead.</div>';
  return '<div class="map-frame' + (pick ? ' pick' : '') + '"' + data + '>' + inner + '</div>';
}

/* The line under the map: whether the pin sits inside the pincode, and where it is. */
function mapMetaHtml(c, link, pin, pick) {
  if (c.shared) {
    return '<div class="map-meta" data-testid="map-preview-shared">' +
      '<span class="coords">Google Maps share link' +
        (pick && hasLeaflet() ? ' · it can’t be shown here, so tap the map to drop the pin instead' : '') +
      '</span>' +
      '<a href="' + esc(String(link).trim()) + '" target="_blank" rel="noopener">Open in Google Maps ↗</a></div>';
  }
  if (c.lat == null) {
    return pick && hasLeaflet()
      ? '<div class="map-meta"><span class="coords" data-testid="map-pick-hint">' +
        'Tap the map to mark where your hub is.</span></div>'
      : '';
  }
  var area = pin && PIN_AREAS[pin];
  var badge = c.ok
    ? (c.pending
        ? '<span class="st grey">Pick the hub pincode to check this pin</span>'
        : '<span class="st green" data-testid="map-pin-ok">Inside ' + esc(pin) +
          (area ? ' · ' + esc(area.name) : '') + '</span>')
    : '<span class="st red" data-testid="map-pin-bad">' + esc(c.short) + '</span>';
  return '<div class="map-meta">' + badge +
    '<span class="coords" data-testid="map-coords">' + c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) +
      (c.ok && !c.pending ? ' · ' + c.distKm.toFixed(1) + ' km from the area centre' : '') +
    '</span>' +
    (c.code === "range" ? ''
      : '<a href="' + esc(gmapsUrl(c)) + '" target="_blank" rel="noopener">Open in Google Maps ↗</a>') +
  '</div>';
}

/* Mount a Leaflet map in every frame the last render drew, and let go of the
   maps it replaced. Called after every render. */
function mountMaps() {
  if (typeof document === "undefined") return;
  liveMaps = liveMaps.filter(function (lm) {
    if (document.body.contains(lm.el)) return true;
    try { lm.map.remove(); } catch (e) { /* already gone */ }
    return false;
  });
  if (!hasLeaflet()) return;
  Array.prototype.forEach.call(document.querySelectorAll(".map-frame[data-map]"), function (el) {
    if (!el._lm) mountMap(el);
  });
}

function mountMap(el) {
  var nums = function (s) { return String(s || "").split(",").map(Number); };
  var view = nums(el.getAttribute("data-map-view")), at = el.getAttribute("data-map-pin") || "";
  var lm = { el:el, key:el.getAttribute("data-map"), pick:el.getAttribute("data-map-pick") || "",
             marker:null, pin:null,
             // what the view hangs on: the pin, or with no pin where the map opened
             anchor: at || "view:" + el.getAttribute("data-map-view") };
  el.innerHTML = "";
  var map = L.map(el, { scrollWheelZoom:false, zoomControl:true });
  lm.map = map;
  if (map.attributionControl) map.attributionControl.setPrefix(false);
  mapTiles(map);
  var kept = mapViews[lm.key];
  if (kept && kept.anchor === lm.anchor) map.setView([kept.lat, kept.lng], kept.zoom);
  else map.setView([view[0], view[1]], view[2]);
  if (at) {
    var p = nums(at);
    lm.marker = mapMarker(lm, [p[0], p[1]], el.getAttribute("data-map-tone") || "wait");
  }
  if (lm.pick) {
    map.on("click", function (ev) {
      var ll = ev.latlng.wrap();
      A.mapPick(lm.pick, ll.lat, ll.lng);
    });
  }
  map.on("moveend", function () { rememberMapView(lm); });
  el._lm = lm;
  liveMaps.push(lm);
  rememberMapView(lm);
}

function rememberMapView(lm) {
  var ctr = lm.map.getCenter();
  mapViews[lm.key] = { lat:ctr.lat, lng:ctr.lng, zoom:lm.map.getZoom(), anchor:lm.anchor };
}

/* The OpenStreetMap tiles, moving to the next server if the first keeps failing
   before any tile has loaded. */
function mapTiles(map) {
  var loaded = false, errors = 0, layer;
  var add = function () {
    layer = L.tileLayer(MAP_TILES[mapTileIdx], { maxZoom:19, attribution:MAP_ATTRIBUTION });
    layer.on("tileload", function () { loaded = true; });
    layer.on("tileerror", function () {
      if (loaded || ++errors < 3 || mapTileIdx + 1 >= MAP_TILES.length) return;
      map.removeLayer(layer);
      mapTileIdx++; errors = 0;
      add();
    });
    layer.addTo(map);
  };
  add();
}

function mapPinIcon(tone) {
  return L.divIcon({
    className: "map-pin " + tone, iconSize:[28, 38], iconAnchor:[14, 37],
    html: '<svg viewBox="0 0 28 38" width="28" height="38" aria-hidden="true">' +
          '<path d="M14 1C6.8 1 1 6.7 1 13.8 1 23.5 14 37 14 37s13-13.5 13-23.2C27 6.7 21.2 1 14 1z"/>' +
          '<circle cx="14" cy="14" r="5" fill="#fff"/></svg>'
  });
}

/* The hub's pin. On a map the pin can be dropped on, it can also be dragged. */
function mapMarker(lm, ll, tone) {
  var m = L.marker(ll, { icon:mapPinIcon(tone), draggable:!!lm.pick, keyboard:false, autoPan:true });
  if (lm.pick) {
    m.on("dragend", function () {
      var p = m.getLatLng().wrap();
      A.mapPick(lm.pick, p.lat, p.lng);
    });
  }
  return m.addTo(lm.map);
}

/* Move a live map's pin to what the field now says. `follow` brings the map to
   it (a link typed or pasted); a tap or a drag is already in view. With no pin,
   the map moves to a newly chosen pincode instead. */
function syncMapPin(lm, c, pin, follow) {
  if (mapHasPin(c)) {
    var ll = [c.lat, c.lng];
    if (lm.marker) { lm.marker.setLatLng(ll); lm.marker.setIcon(mapPinIcon(mapTone(c))); }
    else lm.marker = mapMarker(lm, ll, mapTone(c));
    lm.anchor = c.lat + "," + c.lng;
    if (follow) lm.map.setView(ll, Math.max(lm.map.getZoom(), 15));
  } else {
    if (lm.marker) { lm.marker.remove(); lm.marker = null; }
    var a = PIN_AREAS[pin];
    if (follow && a && lm.pin !== pin) lm.map.setView([a.lat, a.lng], 14);
  }
  lm.pin = pin;
  rememberMapView(lm);
}

  if (!S.vxNext || keys.indexOf(S.vxNext) < 0) return null;

function vxPhone(s) {
  s = String(s || "").trim();
  if (!/^\d{10}$/.test(s)) return null;
  if (/^[0-5]/.test(s)) return VX.phoneStart;
  if (/^(\d)\1{9}$/.test(s)) return VX.phoneRepeat;
  return null;

  s = String(s || "").trim();

  if (/[^A-Za-z .'\-]/.test(s)) return VX.nameChars;
  if (s.replace(/[^A-Za-z]/g, "").length < 3) return VX.nameShort;
  return null;
}

var SLAB_STEP = 2500;

/* The upper bound of every slab but the last, for a hub type. */
function slabBreaks(type) {

  return (HUB_CATEGORIES[type] && s && s[type]) || DEFAULT_SLAB_BREAKS;
}

  }

  });

function seedAmPortfolio() {
  if (S.networkHubs && S.networkHubs.length) return;
  S.networkHubs = PORTFOLIO_HUBS.concat(OTHER_AM_HUBS).map(function (o) {
    return makeHub(Object.assign(JSON.parse(JSON.stringify(o)),
      { role:"FM", status:"active", city:knownCity(o.pincode) || "Bengaluru, Karnataka" }));
  });
  var edits = portfolioEdits();
  edits.forEach(function (e) {             // an approved edit is already live on its hub
    var h = e.status === "approved" && networkHubById(e.hubId);
    if (!h) return;
    h.address = e.after.address; h.pincode = e.after.pincode; h.mapLink = e.after.mapLink;
    h.areaSqft = e.after.areaSqft; h.city = knownCity(e.after.pincode) || h.city;
  });
  S.hubEdits = S.hubEdits.concat(edits);
  S.networkHubs.forEach(ensureVersions);
  var seededRates = portfolioRates().concat(otherAmRates());
  S.rateUpdates = S.rateUpdates.concat(seededRates);
  seededRates.forEach(seedPublished);
  S.amChanges = (S.amChanges || []).concat(portfolioChanges());
}

/* Progress bar counts completed phases, not the index, so a rejection that
   sends the captain backwards also walks the bar back. */
function progressPct() {
  var r = R(), total = phases().length;
  var pct = Math.round(((r.phaseIdx + (r.complete ? 1 : 0)) / total) * 100);
  return Math.max(0, Math.min(100, pct));
}

function kycComplete(r) {
  var k = r.kyc;

    // FM: a verified GSTIN, or a deliberate "Don't have GST?" the Area Manager

    return k.gst.done && (k.gst.registered === true || !!noGstState(k.gst));
  }
  // LM: GST is an optional toggle — "Non-GST" is a valid completed answer.
  return k.gst.done;

/* ------------------------------------------------------- rate card helpers */

/* The city a captain's own request is priced for: its hub's. */
function chCity(r) { return (r.hub && (r.hub.city || knownCity(r.hub.pincode))) || ""; }
/* The first slab's ceiling, the figure a single-rate LM card is held to. */
function ceilingFor(r) {
  var c = r.ch.category;
  return c && HUB_CATEGORIES[c] ? slabCeiling(c, chCity(r), 0) : null;
}
function tpFor(r) {
  var c = r.ch.category;
  return c && HUB_CATEGORIES[c] ? cityTp(c, chCity(r)) : null;
}
function isAboveCeiling(r) {
  var ceil = ceilingFor(r);
  return ceil != null && r.ch.rate != null && r.ch.rate > ceil;
}

/* Split mode, captain side. The payouts team has NOT confirmed this formula —
   it is rendered as an indicative figure with a caveat and is deliberately not
   used to gate or compute anything downstream. */
/* The approved rate card the captain is shown: volume slabs plus a touchpoint
   rate — the same shape a Cluster Head fills in on the admin panel. */
function bookRateCard(r) {
  if (r.ch.slabs && r.ch.slabs.length) return;      // already booked
  var base = r.ch.rate != null ? r.ch.rate : 0;
  r.ch.slabs = seedSlabs(base.toFixed(2), Math.max(0, base - 0.5).toFixed(2), slabBreaks(r.ch.category));
  r.ch.touchpoint = fixedTp(r.ch.category, chCity(r));
}

/* Whether the Area Manager has authored a rate card for this hub yet. */
function chRateSubmitted(r) {
  return !!(r.ch.slabs && r.ch.slabs.length);
}

/* Captain-side mirror of the admin panel's ceiling check: a card is above
   ceiling if any slab beats its own ceiling for the hub type and city. The
   touchpoint is fixed by the hub type, so it is never over. */
function chAboveCeiling(r) {
  return cardAbove(r.ch.category, chCity(r), { slabs:r.ch.slabs });
}

/* The Area Manager authoring a card for this hub category, either inside its
   ceilings or deliberately over them. Slab bands mirror the admin panel's. */
function seedCaptainRateCard(r, above) {
  var cat = r.ch.category;
  if (!HUB_CATEGORIES[cat]) return;
  var city = chCity(r);
  r.ch.slabs = bandsFor(slabBreaks(cat)).map(function (b, i) {
    var c = slabCeiling(cat, city, b.from), v;
    if (c == null) v = 3;                                     // no ceilings here at all
    else v = above && i === 0 ? c + 1 : Math.max(0.5, c - 0.2);
    return { from:b.from, to:b.to, rate:v.toFixed(2) };
  });
  r.ch.touchpoint = fixedTp(cat, city);
}


/* ------------------------------------------------------------------ escape */

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
/* Day stamps read the same everywhere: "23 Sept 2026", matching the format the
   activation screen and the seeded hubs already use. */
function fmtDay(d) {
  return (d || new Date()).toLocaleDateString("en-IN",
    { day:"2-digit", month:"short", year:"numeric" });
}
/* The name a brand new hub takes until it is renamed. Both the activation
   screen and the hub it produces read it from here. */
function defaultHubName(r) {
  return ((r.hub && (r.hub.selected || r.hub.pincode)) || "New") + " Hub";
}
function money(n) {
  if (n == null) return "-";
  return "₹" + (Math.round(n * 100) / 100).toFixed(2);
}
function maskPhone(p) {
  if (!p || p.length < 10) return p || "";
  return "+91 " + p.slice(0, 5) + "•••" + p.slice(8);
}
function initials(name, phone) {
  var n = (name || "").trim();
  if (n) {
    var parts = n.split(/\s+/);
    return ((parts[0][0] || "") + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  return phone ? phone.slice(0, 2) : "KV";
}

function blankSlab() { return { from:"", to:"", rate:"" }; }

/* A slab is usable once it has a starting volume and a rate. An empty "to"
   means the band is open-ended — the top slab usually is. */
function slabValid(sl) {
  if (!/^\d+$/.test(String(sl.from).trim())) return false;
  if (!/^\d+(\.\d{1,2})?$/.test(String(sl.rate).trim())) return false;
  if (String(sl.to).trim() === "") return true;
  if (!/^\d+$/.test(String(sl.to).trim())) return false;
  return +sl.to > +sl.from;
}
function slabsValid(list) {
  return Array.isArray(list) && list.length > 0 && list.every(slabValid);
}
function rateOk(v) { return /^\d+(\.\d{1,2})?$/.test(String(v == null ? "" : v).trim()); }

/* The benchmark ceilings for a request's hub category and city, and whether
   its rate card stays inside them. A card above them cannot be settled by the
   Cluster Head alone — it goes to BizFin. */
function apCeiling(r) {
  return HUB_CATEGORIES[r.hubCategory] ? slabCeiling(r.hubCategory, r.city, 0) : null;
}
function apTpCeiling(r) {
  return cityTp(r.hubCategory, r.city);
}
function tpOverCeiling(r) {
  var ceil = apTpCeiling(r), v = parseFloat(r.rate.touchpoint);
  return ceil != null && !isNaN(v) && v > ceil;
}
function slabsOverCeiling(r) {
  return (r.rate.slabs || []).some(function (sl) { return slabOverCeiling(r, sl); });
}

/* One sentence naming whichever part of the card is over, so the AM's live
   notice, the Cluster Head's banner and BizFin's all read the same. */
function apOverageText(r) {
  if (!HUB_CATEGORIES[r.hubCategory]) return "";
  if (!ceilingRow(r.hubCategory, r.city)) {
    return "There are no " + HUB_CATEGORIES[r.hubCategory].label + " ceilings for " +
           (cityKey(r.city) || "this city") + " on the rate card sheet.";
  }
  var over = (r.rate.slabs || []).filter(function (sl) { return slabOverCeiling(r, sl); });
  if (!over.length) return "";
  var sl = over[0], t = "Slab " + ((r.rate.slabs || []).indexOf(sl) + 1) + " (" + bandText(sl) + ") is \u20b9" +
    (+sl.rate).toFixed(2) + " against a \u20b9" + apSlabCeiling(r, sl).toFixed(2) + " ceiling";
  if (over.length > 1) t += ", and " + (over.length - 1) + " more slab" + (over.length > 2 ? "s are" : " is") + " over";
  return t + ".";
}

      '<div class="ph"><b>Bank account</b><span>Used for all your payouts</span></div>' +
      '<div class="prow"><div class="pl"><span class="k">Bank account</span>' +
        '<span class="v">' + esc(maskedAcc) + '</span>' +
        '<span class="s">IFSC ' + esc(b.ifsc || "-") + ' · ' + esc(b.holder || "-") + '</span></div>' +
        '<div class="pr">' +
          (b.verified ? '<span class="pill-ok">✓ Verified</span>' : '<span class="pill-mute">Unverified</span>') +
          '<button class="btn btn-ghost btn-edit" id="bank-edit"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.6 3.9l3.5 3.5M3.5 16.5l.9-4.1 9.4-9.4a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1l-9.4 9.4-4.1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Edit</button>' +
        '</div></div>' +
      (bk.open ? bankEditBlock(bk) : "") +
    '</div>' +

    '<div class="pnote"><span>ⓘ</span><span>To change your bank account, we’ll send an OTP to your registered phone and check the new account before saving.</span></div>';
}

/* PR-02 … PR-08 — the bank-edit journey, inline under the bank card. */
function bankEditBlock(bk) {
  var inner;

  if (bk.step === "otp") {
    inner = '<div class="pnote" style="margin-bottom:16px"><span>ⓘ</span>' +
        '<span>Enter the OTP sent to ' + esc(maskPhone(S.phone)) + ' to change your bank account. ' +
        'Demo code <b>000000</b>.</span></div>' +
      (bk.locked
        ? '<div class="notice bad" data-testid="bank-otp-locked"><b>Bank change locked</b>' +
          'Three incorrect codes. Contact VALMO Support to unlock.</div>'
        : '<div class="fl" style="max-width:260px"><label>OTP</label>' +
            '<div class="box' + (bk.error ? ' bad' : '') + '">' +
            '<input id="bank-otp" maxlength="6" inputmode="numeric" placeholder="000000" ' +
              'value="' + esc(bk.otp) + '"></div>' +
            (bk.error ? '<div class="hint err">' + esc(bk.error) + '</div>' : '') +
          '</div>' +
          '<div style="display:flex;gap:12px">' +
            '<button class="btn btn-ghost" id="bank-cancel">Cancel</button>' +
            '<button class="btn btn-primary" id="bank-otp-go">Verify OTP</button></div>');

  } else if (bk.step === "form") {
    inner = '<div class="grid2">' +
        '<div class="fl"><label>New account number</label>' +
          '<div class="box' + (bk.error && bk.errField === "acc" ? ' bad' : '') + '">' +
          '<input id="bank-acc" inputmode="numeric" maxlength="18" placeholder="Account number" ' +
            'value="' + esc(bk.draft.acc) + '"></div>' +
          '<div class="hint' + (bk.errField === "acc" ? ' err' : '') + '">' +
            (bk.errField === "acc" ? esc(bk.error) : "9 to 18 digits.") + '</div></div>' +
        '<div class="fl"><label>IFSC</label>' +
          '<div class="box' + (bk.error && bk.errField === "ifsc" ? ' bad' : '') + '">' +
          '<input id="bank-ifsc" maxlength="11" style="text-transform:uppercase" ' +
            'placeholder="HDFC0001234" value="' + esc(bk.draft.ifsc) + '"></div>' +
          '<div class="hint' + (bk.errField === "ifsc" ? ' err' : '') + '">' +
            (bk.errField === "ifsc" ? esc(bk.error) : "11 characters.") + '</div></div>' +
      '</div>' +
      '<div class="fl"><label>Account holder name</label>' +
        '<div class="box' + (bk.errField === "holder" ? ' bad' : '') + '">' +
        '<input id="bank-holder" placeholder="As per bank records" value="' + esc(bk.draft.holder) + '"></div>' +
        '<div class="hint' + (bk.errField === "holder" ? ' err' : '') + '">' +
          (bk.errField === "holder" ? esc(bk.error) : "Must match the name on the account.") + '</div></div>' +
      '<div style="display:flex;gap:12px">' +
        '<button class="btn btn-ghost" id="bank-cancel">Cancel</button>' +
        '<button class="btn btn-primary" id="bank-verify">Verify account</button></div>';

  } else if (bk.step === "verifying") {
    inner = statusBlock("run", "Verifying the new account",
      "We’re deducting ₹1 from this account to check it’s yours. It will be refunded instantly.");

  } else if (bk.step === "error") {
    inner = failNotice(bk.fail) +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="bank-cancel">Cancel</button>' +
        '<button class="btn btn-primary" id="bank-resume">Resume verification</button></div>';

  } else if (bk.step === "failed") {
    inner = statusBlock("bad", "Verification failed",
        bk.error || "We couldn’t deduct ₹1 from this account. Check the details and try again.") +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="bank-cancel">Cancel</button>' +
        '<button class="btn btn-primary" id="bank-retry">Back to details</button></div>';

  } else {
    inner = statusBlock("ok", "Bank account updated",
      "Future payouts go to the new account.") +
      '<div style="display:flex;justify-content:flex-end">' +
        '<button class="btn btn-primary" id="bank-done">Done</button></div>';
  }

  return '<div style="padding:20px 20px;border-top:1px solid var(--line-soft);' +
         'background:var(--sum-bg);border-radius:0 0 12px 12px" data-testid="bank-edit">' +
         inner + '</div>';
}

/* ------------------------------------------------------- HB-01 · My Hubs */

function hubCard(h) {
  var g = S.panel.gst, editing = g.hubId === h.id && g.mode !== "view";
  var inactive = h.status === "inactive";
  var pending = h.status === "in_progress";

  var right = pending
    ? '<span class="pill-mute">In progress</span>'
    : (inactive ? '<span class="pill-mute">Inactive</span>' : '<span class="pill-ok">Active</span>');

  var gstRow;
  if (pending) {
    var paused = S.roles[h.role].fail;
    gstRow = '<div class="prow"><div class="pl"><span class="k">Onboarding</span>' +
      '<span class="v">Step ' + (S.roles[h.role].phaseIdx + 1) + ' of ' +
      PHASES[h.role].length + '</span>' +
      (paused
        ? '<span class="s" data-testid="hub-paused" style="font-size:11px;color:var(--err);' +
          'font-weight:600;line-height:16px">' + esc(paused.what) + ' didn’t go through: ' + esc(paused.reason) + '</span>'
        : '') + '</div>' +
      '<div class="pr"><button class="btn btn-primary" data-resume="' + esc(h.id) + '">' +
      'Resume onboarding</button></div></div>';
  } else {
    gstRow = '<div class="prow"><div class="pl"><span class="k">GST registration</span>' +
      '<span class="v">' + esc(h.gst.registered ? h.gst.gstin : "Non-GST") + '</span></div>' +
      '<div class="pr">' +
        (inactive
          ? '<span class="s" style="font-size:11px;color:var(--muted);line-height:16px">Deactivated on ' +
            esc(h.deactivatedOn || "-") + '</span>'
          : '<button class="btn btn-ghost" data-gst="' + esc(h.id) + '">' +
            (h.gst.registered ? "Manage GSTIN" : "Add GSTIN") + '</button>') +
      '</div></div>';
  }

  /* a hub mid-onboarding shows what has been entered for it so far */
  var rr = pending ? S.roles[h.role] : null;
  var name = pending ? defaultHubName(rr) : h.name;
  var address = pending ? (rr.hub.address || "Address not added yet") : h.address;
  var pin = pending ? (rr.hub.selected || rr.hub.pincode) : h.pincode;

  var rateRow = "";
  if (!pending && !inactive && h.role === "FM" && h.rateCard) rateRow = hubRateSection(h);

  /* A live hub can ask its Area Manager for new details — one request at a time. */
  var detailsRow = "";
  if (!pending && !inactive) {
    var he = hubEditOf(h.id), editingDetails = S.panel.hubEdit.hubId === h.id;
    if (he && he.status === "pending") {
      detailsRow = '<div class="prow" data-testid="hub-edit-pending"><div class="pl">' +
        '<span class="k">Hub details</span>' +
        '<span class="v">Edit sent to your Area Manager · ' + esc(he.submittedOn) + '</span>' +
        '<span class="s" style="font-size:11px;color:var(--muted);line-height:16px">' +
          esc(hubEditChanged(he).map(function (f) { return f.label; }).join(", ")) +
          '. Your hub keeps its current details until then.</span></div>' +
        '<div class="pr"><span class="pill-mute">Awaiting approval</span></div></div>';
    } else if (!editingDetails) {
      detailsRow = '<div class="prow"><div class="pl"><span class="k">Hub details</span>' +
        '<span class="v">' + esc(fmtArea(h.areaSqft)) + ' · ' +
          esc(parseMapLink(h.mapLink) ? "map pin " + fmtPin(h.mapLink) : fmtPin(h.mapLink)) + '</span></div>' +
        '<div class="pr"><button class="btn btn-ghost btn-edit" data-hubedit="' + esc(h.id) + '"><svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.6 3.9l3.5 3.5M3.5 16.5l.9-4.1 9.4-9.4a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1l-9.4 9.4-4.1.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Edit hub details</button>' +
        '</div></div>';
    }
    var amc = amChangeFor(h.id);
    if (amc && !editingDetails) {
      detailsRow += '<div style="padding:0 20px 16px"><div class="notice info" data-testid="hub-am-updated" ' +
        'style="margin:0"><b>Your Area Manager updated this hub on ' + esc(amc.at) + '</b>' +
        esc(amChangeSummary(amc)) + '. Already live, so there’s nothing for you to do.' +
        '<div style="margin-top:12px"><button class="btn btn-ghost" data-amdismiss="' + esc(amc.id) + '">' +
        'Dismiss</button></div></div></div>';
    }
    if (he && he.status !== "pending" && !he.seen && !editingDetails) {
      detailsRow += he.status === "approved"
        ? '<div style="padding:0 20px 16px"><div class="notice ok" data-testid="hub-edit-approved" style="margin:0">' +
          '<b>Hub details updated</b>Your Area Manager approved the edit on ' + esc(he.decidedOn) +
          '. The new ' + esc(hubEditChanged(he).map(function (f) { return f.label.toLowerCase(); }).join(", ")) +
          ' ' + (hubEditChanged(he).length > 1 ? "are" : "is") + ' live.' +
          '<div style="margin-top:12px"><button class="btn btn-ghost" data-hedismiss="' + esc(he.id) + '">Dismiss</button></div>' +
          '</div></div>'
        : '<div style="padding:0 20px 16px"><div class="notice bad" data-testid="hub-edit-rejected" style="margin:0">' +
          '<b>Your Area Manager didn’t approve the edit</b>' + esc(he.reason) +
          ' Your hub details are unchanged.' +
          '<div style="margin-top:12px"><button class="btn btn-ghost" data-hedismiss="' + esc(he.id) + '">Dismiss</button></div>' +
          '</div></div>';
    }
  }

  return '<div class="hub-card' + (inactive ? " off" : "") + '" data-hub="' + esc(h.id) + '">' +
    '<div class="hh">' +
      '<span class="hcode">Hub ' + esc(h.code || "-") + '</span>' +
      '<span class="ht"><b>' + esc(name) + '</b>' +
        '<span>' + esc(address) + (pin ? " · " + esc(pin) : "") + '</span>' +
        '<span class="hrole">' + esc(h.role) + ' Captain</span></span>' +
      right +
    '</div>' +
    gstRow +
    (!editing && S.panel.gst.savedHubId === h.id
      ? '<div style="padding:0 20px 16px"><div class="notice ok" data-testid="gst-saved" style="margin:0">' +
        '<b>GSTIN verified and saved</b>Invoices for this hub now carry ' + esc(h.gst.gstin) + '.</div></div>'
      : "") +
    (editing ? gstEditBlock(h) : "") +
    rateRow +
    detailsRow +
    (S.panel.hubEdit.hubId === h.id ? hubEditBlock(h) : "") +
  '</div>';
}

/* A rate card as a table: every slab with its rate, then the touchpoint rate. */
function rateTableHtml(card, testid) {
  return '<table class="rate-tbl"' + (testid ? ' data-testid="' + testid + '"' : '') + '><thead><tr>' +
      '<th>Slab</th><th>Orders</th><th class="num">Rate</th></tr></thead><tbody>' +
    (card.slabs || []).map(function (sl, i) {
      var to = String(sl.to).trim();
      return '<tr><td>Slab ' + (i + 1) + '</td><td>' + esc(fmtOrders(sl.from)) +
        (to ? ' – ' + esc(fmtOrders(to)) : ' and above') + '</td>' +
        '<td class="num">₹' + esc(sl.rate) + ' / shipment</td></tr>';
    }).join("") +
    '<tr class="tp"><td colspan="2">Touchpoint rate</td><td class="num">₹' + esc(card.touchpoint || "-") +
      ' / touchpoint</td></tr>' +
  '</tbody></table>';
}

/* The hub's rate card on My Hubs: the card in force, the day it took effect,
   any change already published for a later day, and the way into the past. */
function hubRateSection(h) {
  var list = captainVersions(h), cur = versionOn(list, todayIso()) || list[0];
  var next = scheduledVersions(h, list)[0];
  var ask = S.rateUpdates.filter(function (u) { return u.hubId === h.id && u.status === "captain"; })[0];
  if (!cur) return "";
  return '<div class="rate-sec" data-testid="hub-rate">' +
    '<div class="rs-hd"><div><span class="k">Rate card</span>' +
      '<b>In force since ' + esc(fmtIso(cur.effectiveFrom)) + '</b></div>' +
      '<button class="btn btn-ghost" data-ratehist="' + esc(h.id) + '">View historic rate card updates</button></div>' +
    rateTableHtml(cur, "hub-rate-table") +
    (ask
      ? '<div class="notice warn" data-testid="hub-rate-ask" style="margin:12px 0 0"><b>Updated rates to agree</b>' +
        'Your Area Manager has updated this hub’s rates, from ' + esc(fmtIso(ask.effectiveFrom)) +
        '. They apply only once you agree.' +
        '<div style="margin-top:12px"><button class="btn btn-primary" data-rateagree="' + esc(ask.id) + '">' +
        'Review and agree</button></div></div>'
      : '') +
    (next
      ? '<div class="notice info" data-testid="hub-rate-next" style="margin:12px 0 0"><b>New rates from ' +
        esc(fmtIso(next.effectiveFrom)) + '</b>' + (next.agreedOn ? 'You agreed on ' + esc(next.agreedOn) + '. '
                                                                 : 'Published on ' + esc(fmtIso(next.publishedOn)) + '. ') +
        'Your current rates apply until then.' + rateTableHtml(next, "hub-rate-next-table") + '</div>'
      : '') +
  '</div>';
}

/* A rate card update the captain is asked to agree to: the card in force
   beside the updated one, the day it would apply, and the agreement. Nothing
   changes until they agree; it never applies before the day they do. */
function panelRateAgree() {
  var u = rateUpdateById(S.panel.rateUpdateId), h = u && hubById(u.hubId);
  var crumbs = '<div class="crumbs">My Profile<span class="sep">›</span>My Hubs' +
    '<span class="sep">›</span><b>Rate card update</b></div>';
  if (!u || !h || (u.status !== "captain" && u.status !== "published")) {
    return crumbs + '<h2 class="hub-h1"><button id="hub-back-hubs"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Rate card update</h2>' +
      '<div class="rs-empty"><b>This update is no longer available</b><span>Head back to My Hubs.</span></div>';
  }
  var cur = { slabs:u.from.slabs, touchpoint:u.from.touchpoint };
  var body = u.status === "published"
    ? statusBlock("ok", "Updated rate card agreed",
        "You agreed on " + (u.agreedOn || u.publishedOn) + ". The new rates apply from " + fmtIso(u.effectiveFrom) +
        "; your current rates apply until then.") +
      rateTableHtml(u.to, "rate-agreed-table") +
      '<div style="display:flex;justify-content:flex-end;gap:12px;margin-top:16px">' +
        '<button class="btn btn-ghost" data-ratehist="' + esc(h.id) + '">View historic rate card updates</button>' +
        '<button class="btn btn-primary" id="hub-back-hubs-2">Back to My Hubs</button></div>'
    : '<div class="notice info" style="margin-bottom:16px"><b>Your Area Manager has updated this hub’s rates</b>' +
        esc(u.by) + ' changed the rates for ' + esc(u.hubName) + ' (' + esc(u.hubCode) + '). They apply from ' +
        esc(fmtIso(u.effectiveFrom)) + ' once you agree, or from the day you agree if that’s later. ' +
        'Until then your current rates apply.</div>' +
      '<div class="rate-cmp">' +
        '<div><span class="cap">Current</span>' + rateTableHtml(cur, "rate-current") + '</div>' +
        '<div><span class="cap">Updated · from ' + esc(fmtIso(u.effectiveFrom)) + '</span>' +
          rateTableHtml(u.to, "rate-new") + '</div>' +
      '</div>' +
      '<div class="notice info" data-testid="combined-blurb"><b>Combined rate card</b>' +
        'You get your order rate plus the touchpoint rate, paid together.</div>' +
      '<label class="check-row" style="margin:8px 0 16px">' +
        '<input type="checkbox" id="rate-agree-check"' + (S.panel.rateAgreeChecked ? ' checked' : '') + '>' +
        '<span class="cl"><b>I have read the updated rate card and agree to it</b>' +
        '<span>This replaces your current rates for this hub from that date.</span></span></label>' +
      '<div style="display:flex;justify-content:flex-end">' +
        '<button class="btn btn-primary" id="rate-agree"' + (S.panel.rateAgreeChecked ? '' : ' disabled') + '>' +
          'Agree to updated rate card</button></div>' +
      '<p style="margin:16px 0 0;font-size:12px;color:var(--muted);line-height:16px" data-testid="rate-questions">' +
        'Questions about this change? Call your Area Manager, ' + esc(u.by) + ', on ' +
        '<a href="tel:' + esc(u.byPhone) + '" style="color:var(--cyan-ink);font-weight:700;text-decoration:none">' +
        esc(u.byPhone) + '</a>.</p>';
  return crumbs +
    '<h2 class="hub-h1"><button id="hub-back-hubs"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Rate card update</h2>' +
    '<div class="pcard" style="max-width:760px" data-testid="rate-update"><div style="padding:24px 24px">' +
      '<span class="hcode" style="display:inline-block;margin-bottom:8px">Hub ' + esc(u.hubCode) + '</span>' +
      '<b style="display:block;font-size:17px;color:var(--ink);margin-bottom:16px;line-height:24px">' + esc(u.hubName) + '</b>' +
      body +
    '</div></div>';
}

/* A new page of content starts at its top. */
function toTop() {
  var el = document.scrollingElement || document.documentElement;
  if (el) el.scrollTop = 0;
}

/* Every rate card the hub has had, newest first, five to a page. */
var RATE_HISTORY_PAGE = 5;
function panelRateHistory() {
  var h = hubById(S.panel.rateHub);
  var crumbs = '<div class="crumbs">My Profile<span class="sep">›</span>My Hubs' +
    '<span class="sep">›</span><b>Rate card history</b></div>';
  if (!h || !(h.rateCards && h.rateCards.length)) {
    return crumbs + '<h2 class="hub-h1"><button id="hub-back-hubs"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Rate card history</h2>' +
      '<div class="rs-empty"><b>No rate card history for this hub</b><span>Head back to My Hubs.</span></div>';
  }
  var list = captainVersions(h), newest = list.slice().reverse();
  var pages = Math.max(1, Math.ceil(newest.length / RATE_HISTORY_PAGE));
  var p = Math.max(0, Math.min(S.panel.ratePage || 0, pages - 1));
  var first = p * RATE_HISTORY_PAGE, shown = newest.slice(first, first + RATE_HISTORY_PAGE);
  var items = shown.map(function (v) {
    var st = versionState(list, v), until = versionUntil(list, v);
    var chip = st === "current" ? '<span class="pill-ok">In force</span>'
             : st === "upcoming" ? '<span class="pill-warn">Upcoming</span>' : '<span class="pill-mute">Past</span>';
    var when = st === "past" ? fmtIso(v.effectiveFrom) + ' – ' + fmtIso(until)
             : st === "current" ? 'From ' + fmtIso(v.effectiveFrom) + ' · in force today'
             : 'From ' + fmtIso(v.effectiveFrom);
    return '<div class="rh-item" data-testid="rate-hist-item" data-state="' + st + '">' +
      '<div class="rh-hd"><div><b>' + esc(when) + '</b><span>' +
        (v.source === "onboarding" ? 'Agreed when the hub was onboarded'
         : v.agreedOn ? 'You agreed on ' + esc(v.agreedOn)
         : 'Published on ' + esc(fmtIso(v.publishedOn))) + '</span></div>' + chip + '</div>' +
      rateTableHtml(v) + '</div>';
  }).join("");
  return crumbs +
    '<h2 class="hub-h1"><button id="hub-back-hubs"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Rate card history</h2>' +
    '<div class="pcard" style="max-width:760px" data-testid="rate-history"><div style="padding:24px 24px">' +
      '<span class="hcode" style="display:inline-block;margin-bottom:8px">Hub ' + esc(h.code) + '</span>' +
      '<b style="display:block;font-size:17px;color:var(--ink);margin-bottom:4px;line-height:24px">' + esc(h.name) + '</b>' +
      '<p style="margin:0 0 16px;font-size:12px;color:var(--muted);line-height:16px">All rate cards for this hub and when each one applied. Each day is paid at the rates active that day.</p>' +
      items +
      '<div class="rh-pager" data-testid="rate-hist-pager">' +
        '<span>Showing ' + (first + 1) + '–' + (first + shown.length) + ' of ' + newest.length + '</span>' +
        '<span class="pg"><button class="btn btn-ghost" id="rh-newer"' + (p === 0 ? ' disabled' : '') + '>‹ Newer</button>' +
        '<b>Page ' + (p + 1) + ' of ' + pages + '</b>' +
        '<button class="btn btn-ghost" id="rh-older"' + (p >= pages - 1 ? ' disabled' : '') + '>Older ›</button></span>' +
      '</div>' +
    '</div></div>';
}

/* The captain's edit form. Every field starts from the hub's current value;
   the map pin is checked against the pincode being asked for. */
function hubEditBlock(h) {
  var he = S.panel.hubEdit, d = he.draft, e = he.errors || {};
  var field = function (id, label, value, hint, err, attrs) {
    return '<div class="fl"><label>' + label + '</label>' +
      '<div class="box' + (err ? ' bad' : '') + '" id="' + id + '-box">' +
        '<input id="' + id + '" value="' + esc(value) + '"' + (attrs || '') + '></div>' +
      '<div class="hint' + (err ? ' err' : '') + '" id="' + id + '-hint">' + esc(err || hint) + '</div></div>';
  };

/* HB-02 … HB-06 — per-hub GSTIN management. */
function gstEditBlock(h) {
  var g = S.panel.gst, inner;

  if (g.mode === "confirmRemove") {
    inner = '<div class="notice warn" data-testid="gst-remove-confirm">' +
        '<b>Remove GSTIN from ' + esc(h.name) + '?</b>' +
        'This hub will become Non-GST. New invoices won’t show a GSTIN. ' +
        'You can add one again later.</div>' +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="gst-cancel">Keep GSTIN</button>' +
        '<button class="btn btn-primary" id="gst-remove-go" ' +
          'style="background:var(--err);box-shadow:none">Remove GSTIN</button></div>';
  } else if (g.mode === "verified") {
    var sim = g.result.match && g.result.match.level === "similar";
    inner = statusBlock("ok", "GSTIN verified",
        "The GST portal confirmed " + g.result.record.gstin + " is active" +
        (sim ? ", and its name is close enough to your bank account’s." : " and in your bank account’s name.")) +
      gstCheckHtml(g.result) +
      '<div style="display:flex;gap:12px;justify-content:flex-end">' +
        '<button class="btn btn-ghost" id="gst-again">Use a different GSTIN</button>' +
        '<button class="btn btn-primary" id="gst-confirm">Save GSTIN to ' + esc(h.name) + '</button></div>';
  } else {
    var gFail = failOf(g, "gst");
    inner = '<div class="fl" style="max-width:320px"><label>GSTIN</label>' +
        '<div class="box' + (g.error ? ' bad' : '') + '">' +
        '<input id="gst-input" maxlength="15" style="text-transform:uppercase" ' +
          'placeholder="15-character GSTIN" value="' + esc(g.value) + '"></div>' +
        '<div class="hint' + (g.error ? ' err' : '') + '">' +
          esc(g.error || "We’ll check this GSTIN and match its name with your bank account before saving.") + '</div></div>' +
      (g.error ? gstCheckHtml(g.result) : '') +
      failNotice(gFail) +
      '<div style="display:flex;gap:12px">' +
        '<button class="btn btn-ghost" id="gst-cancel">Cancel</button>' +
        '<button class="btn btn-primary" id="gst-save">' +
          (gFail ? "Resume verification" : (h.gst.registered ? "Verify new GSTIN" : "Verify GSTIN")) +
        '</button>' +
        (h.gst.registered
          ? '<button class="btn-link" id="gst-remove" style="color:var(--err);margin-left:8px">' +
            'Remove GSTIN</button>'
          : '') +
      '</div>';
  }
  return '<div style="padding:16px 20px;border-top:1px solid var(--line-soft);' +
         'background:var(--sum-bg);border-radius:0 0 12px 12px" data-testid="gst-edit">' +
         inner + '</div>';
}

function panelAddHub() {
  var a = S.panel.addHub, known = knownGstins();
  var fm = a.role === "FM";

  /* FM has no Non-GST option to pick — a captain without GST for this hub
     takes the deliberate "Don't have GST?" path, which the Area Manager reviews. */
  var fmNoGst = fm && a.choice === "none";

  /* A row is a radio, not a <button> — it contains a text field and a select, and
     form controls cannot live inside a button: the click would bubble to the
     button, re-render, and destroy the field before anything could be typed. */
  var opt = function (id, title, sub, extra, dis) {
    return '<div class="choice' + (a.choice === id ? " on" : "") + (dis ? " off" : "") + '" ' +
             'data-choice="' + id + '" role="radio" ' +
             'aria-checked="' + (a.choice === id ? "true" : "false") + '" ' +
             'aria-disabled="' + (dis ? "true" : "false") + '" ' +
             (dis ? '' : 'tabindex="0"') + '>' +
             '<span class="radio"></span>' +
             '<span class="ct"><b>' + title + '</b><span>' + sub + '</span>' +
               (extra ? '<span class="sub">' + extra + '</span>' : '') + '</span>' +
           '</div>';
  };

  var gstinSelect = known.length
    ? '<select id="addhub-existing" class="ms-search" style="max-width:280px;margin:0">' +
      known.map(function (g) {
        return '<option value="' + esc(g) + '"' + (a.existing === g ? " selected" : "") + '>' +
               esc(g) + ' · Karnataka</option>';
      }).join("") + '</select>'
    : '<span style="font-size:11px;color:var(--muted);line-height:16px">No verified GSTIN on your account yet.</span>';

  return '<div class="crumbs">My Profile<span class="sep">›</span>My Hubs' +
      '<span class="sep">›</span><b>Add new hub</b></div>' +
    '<h2 class="hub-h1"><button id="hub-back-hubs"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Add a new hub</h2>' +

    '<div class="pcard" style="max-width:520px"><div style="padding:24px 24px">' +
      '<div style="margin-bottom:24px">' +
        '<span style="display:block;font-size:11px;font-weight:700;color:var(--cyan-label);' +
          'margin-bottom:8px;line-height:16px">Role for this hub</span>' +
        '<div class="toggle-row" style="margin:0">' +
          '<button data-addrole="LM"' + (a.role === "LM" ? ' class="on"' : '') + '>LM Captain</button>' +
          '<button data-addrole="FM"' + (a.role === "FM" ? ' class="on"' : '') + '>FM Captain</button>' +
        '</div></div>' +

      '<b style="display:block;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px;line-height:24px">' +
        'How is this hub registered for GST?</b>' +
      '<p style="margin:0 0 20px;font-size:13px;font-weight:500;color:var(--muted);line-height:20px">' +
        'Your KYC and bank details are already saved. Choose GST for this hub (you can change it later).</p>' +

      (fmNoGst
        ? noGstForm("addhub", a.noGstDraft, a.noGstErrors) +
          '<button class="btn-link" id="addhub-nogst-cancel" style="font-size:12px;line-height:16px">I have a GSTIN</button>'
        : opt("existing", "Use an existing GSTIN",
            "Use a GSTIN you’ve already verified.", gstinSelect, !known.length) +
          (fm ? '' : opt("none", "Continue as Non-GST",
            "This hub won&rsquo;t have a GSTIN. You can add one later from My Hubs.", "", false)) +
          opt("new", "Add a new GSTIN",
          "Enter a new GSTIN for this hub. We’ll verify it.",
          a.choice === "new"
            ? '<span class="fl" style="display:block;margin:0"><span class="box' +
              (a.error ? ' bad' : '') + '" style="max-width:280px">' +
              '<input id="addhub-gstin" maxlength="15" style="text-transform:uppercase" ' +
              'placeholder="15-character GSTIN" value="' + esc(a.gstin) + '"></span>' +
              (a.error ? '<span class="hint err" style="display:block">' + esc(a.error) + '</span>' : '') +
              '</span>'
            : "") +
          "") +
      (fm && !fmNoGst
        ? '<button class="btn-link" id="addhub-nogst" data-testid="addhub-nogst-open" ' +
          'style="font-size:12px;margin-top:4px;line-height:16px">Don’t have GST for this hub?</button>' : '') +
      (a.choice === "new" && a.error ? gstCheckHtml(a.result) : "") +
      (a.choice === "new" ? failNotice(failOf(a, "gst")) : "") +

      '<div style="margin-top:20px">' +
        '<button class="btn btn-primary" id="addhub-go">' +
          (a.choice === "new" && failOf(a, "gst") ? "Resume verification →"

          'Your personal details, KYC and background check are already done, so you’ll start at hub details.</div>' +
      '</div>' +

    '</div></div>';
}

/* Map link row: where the pin is, whether it sits in the hub's pincode, and —
   for the Area Manager — an Edit that corrects it without going back to the
   captain. */
function apMapRow(r) {
  var link = apMapLink(r), c = parseMapLink(link), chk = checkMapPin(link, r.pincode);
  var canEdit = actsAs("am") && !r.am.mapEditing;
  return '<div class="row" data-testid="ap-map-row"><span class="k">Map link</span>' +
      '<span class="v" style="max-width:66%;white-space:normal">' +
      (c ? '<a href="' + esc(gmapsUrl(c)) + '" target="_blank" rel="noopener" ' +
           'style="color:var(--cyan-ink);text-decoration:none">' +
           c.lat.toFixed(4) + ', ' + c.lng.toFixed(4) + ' ↗</a>'
         : isShortMapLink(link)
           ? '<a href="' + esc(link) + '" target="_blank" rel="noopener" ' +
             'style="color:var(--cyan-ink);text-decoration:none">Google Maps share link ↗</a>'
           : '<span class="mute">' + (link ? "No pin in the link" : "Not submitted") + '</span>') +
      (r.am.mapLink ? ' <span class="st amber" data-testid="ap-map-updated">AM updated</span>' : '') +
      (canEdit ? ' <button class="btn-link" id="ap-map-edit" style="font-size:12px;margin-left:8px;line-height:16px">' +
                 'Edit</button>' : '') +
      '</span></div>' +
    (link && !chk.ok
      ? '<div class="row" data-testid="ap-map-warn"><span class="k"></span>' +
        '<span class="v bad" style="max-width:80%;white-space:normal;font-weight:600">' + esc(chk.msg) +
        '</span></div>'
      : '') +
    (r.am.mapLink
      ? '<div class="row"><span class="k"></span><span class="v mute" style="font-weight:500;font-size:11px;line-height:16px">' +
        'Corrected by the Area Manager' + (r.am.mapOn ? ' on ' + esc(r.am.mapOn) : '') +
        ' · the captain is notified, with nothing to re-verify</span></div>'
      : '');
}

function apMapEditor(r) {
  var draft = r.am.mapDraft, err = r.am.mapError;
  return '<div data-testid="ap-map-editor" style="margin-top:16px">' +
    '<div class="fl" style="margin-bottom:12px"><label>Google Maps link</label>' +
      '<div class="box' + (err ? ' bad' : '') + '" id="ap-map-box">' +
        '<input id="ap-map" placeholder="https://maps.google.com/?q=…" value="' + esc(draft) + '"></div>' +
      '<div class="hint' + (err ? ' err' : '') + '" id="ap-map-hint">' + esc(err || AM_MAP_HINT) + '</div></div>' +
    '<div id="ap-map-preview">' + mapPreviewHtml(draft, r.pincode, { pick:"ap-map", key:"ap-map:" + r.id }) +
    '</div>' +
    '<div style="display:flex;gap:12px;justify-content:flex-end">' +
      '<button class="btn btn-ghost" id="ap-map-cancel">Cancel</button>' +
      '<button class="btn btn-primary" id="ap-map-save">Save map link</button></div>' +
  '</div>';
}

function apSla(r, label, sub) {
  return '<div class="ap-sla' + (r.slaTone ? ' warn' : '') + '">' +
    '<span class="k">' + esc(label) + '</span><b>' + esc(r.sla) + '</b>' +
    '<span class="s">' + esc(sub) + '</span></div>';
}

/* ---------------------------------------------------- AM · infra checklist */

/* Nine hard gates — any failure requires rejection — followed by a max vehicle
   size review, which is a different thing: failing it means the captain's
   declared size was wrong, and the AM corrects it rather than rejecting. */
var AM_GATES = [
  { id:"cctv",      label:"CCTV installed and operational" },
  { id:"fire",      label:"Fire extinguisher" },
  { id:"computer",  label:"Computer / laptop + Internet" },
  { id:"scanner",   label:"Scanner / handheld devices available" },
  { id:"scanTable", label:"Scan table" },
  { id:"scanStand", label:"Scan stand" },
  { id:"power",     label:"Power backup provisioned" },
  { id:"printer",   label:"Printer available and working" },
  { id:"address",   label:"Address matches submitted" }
];

/* The vehicle review is settled once it passes, or once it fails and the AM has
   set a corrected size. */
function amVehicleSettled(r) {
  var a = r.am;
  if (a.vehicleReview === true) return true;
  if (a.vehicleReview === false) return !!a.maxVehicle;
  return false;
}
function amEffectiveVehicle(r) {
  return r.am.maxVehicle || r.am.declaredVehicle || "";
}

/* The infra check passes once every hard gate is Yes and the vehicle review is
   settled. Only then does the rate card open. */
function amInfraReady(r) {
  return AM_GATES.every(function (x) { return r.am.gates[x.id] === true; }) &&
         amVehicleSettled(r) && (!r.noGst || r.noGst.decision === "approved");
}
function amRateReady(r) {
  return !!r.hubCategory && rateCardValid(r.rate);
}

function apAmDetail(r) {
  if (S.admin.amStep === "rate")   return apAmRatePage(r);
  if (S.admin.amStep === "design") return apAmDesignPage(r);
  return apAmInfraPage(r);
}

/* Page 1 — the facility itself. */
function apAmInfraPage(r) {
  var a = r.am, g = r.am.gates;
  var gateFailed = AM_GATES.some(function (x) { return g[x.id] === false; });
  var ready = amInfraReady(r);

  var gates = AM_GATES.map(function (x, i) {
    return '<div class="ap-gate"><div><b>' + (i + 1) + '. ' + x.label + '</b><span>Hard gate</span></div>' +
      '<div class="yn">' +
        '<button class="yes' + (g[x.id] === true ? ' on' : '') + '" data-gate="' + x.id + '" data-val="yes">Yes</button>' +
        '<button class="no' + (g[x.id] === false ? ' on' : '') + '" data-gate="' + x.id + '" data-val="no">No</button>' +
      '</div></div>';
  }).join("");

  var reviewSub = a.vehicleReview === false
    ? (a.maxVehicle ? "Corrected to " + a.maxVehicle
                    : "Marked incorrect: set the size the location can actually take")
    : "Captain declared: " + (a.declaredVehicle || "-");

  var vehicleRow =
    '<div class="ap-gate" data-testid="am-vehicle-review" style="align-items:flex-start;' +
      'flex-direction:column;gap:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%">' +
        '<div><b>' + (AM_GATES.length + 1) + '. Max. vehicle size review</b>' +
          '<span>' + esc(reviewSub) + '</span></div>' +
        '<div class="yn">' +
          '<button class="yes' + (a.vehicleReview === true ? ' on' : '') + '" data-vehreview="yes">Pass</button>' +
          '<button class="no' + (a.vehicleReview === false ? ' on' : '') + '" data-vehreview="no">Fail</button>' +
        '</div>' +
      '</div>' +
      (a.vehicleEditing
        ? '<div style="width:100%" data-testid="am-vehicle-picker">' +
            vehicleField(a.maxVehicle || "", null) +
            '<button class="btn-link" id="am-veh-cancel" style="font-size:11px;line-height:16px">Cancel update</button>' +
          '</div>'
        : '<button class="btn-link" id="am-veh-edit" style="font-size:11px;line-height:16px">' +
          (a.maxVehicle ? "Change the corrected size" : "Update max vehicle size") + '</button>') +
    '</div>';

  var ng = r.noGst, gstRow = !ng ? '' :
    '<div class="ap-gate" data-testid="am-nogst" style="align-items:flex-start;flex-direction:column;gap:12px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%">' +
        '<div><b>' + (AM_GATES.length + 2) + '. Continuing without GST</b>' +
          '<span>The captain has no GSTIN · ' + esc(ng.reason) + ' · declared ' + esc(ng.on) + '</span></div>' +
        '<div class="yn">' +
          '<button class="yes' + (ng.decision === "approved" ? ' on' : '') + '" data-nogst="yes">Approve</button>' +
          '<button class="no' + (ng.decision === "declined" ? ' on' : '') + '" data-nogst="no">Decline</button>' +
        '</div>' +
      '</div>' +
      (ng.decision === "declined"
        ? '<span class="hint err" style="padding:0">Declined. The captain is asked to add a GSTIN. This ' +
          'request waits here until they do.</span>'
        : ng.decision === "approved"
        ? '<span class="hint" style="padding:0">Approved. The hub goes live without GST. The captain can add a ' +
          'GSTIN later from My Hubs.</span>'
        : '<span class="hint" style="padding:0">Approve it to carry on, or decline it to ask the captain for a ' +
          'GSTIN.</span>') +
    '</div>';

  var left = '<div class="ap-panel">' +
    '<div class="ph"><div>' +
      '<span class="hubcode" data-testid="am-hubcode">Hub code ' +
        esc(r.hubCode || "-") + '</span>' +
      '<b>Area Manager infra check</b>' +
      '<span>Any failed hard gate requires rejection. Floor area is AM-entered value.</span></div>' +
      (gateFailed ? '<span class="st red">Hard gate failed</span>'
        : (ready ? '<span class="st green">Infra check passed</span>'
                 : '<span class="st grey">In progress</span>')) + '</div>' +
    '<div class="ap-form">' +
      '<div class="grid2">' +
        '<div class="fl"><label>Visit date</label><div class="box">' +
          '<input id="am-date" value="' + esc(a.visitDate) + '"></div></div>' +
        '<div class="fl"><label>Visit performed by</label><div class="box sel">' +
          '<select id="am-by">' + ["Self","Field executive","Third-party agency"].map(function (o) {
            return '<option' + (a.by === o ? ' selected' : '') + '>' + o + '</option>'; }).join("") +
          '</select></div></div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="fl"><label>Floor area (sq ft)</label><div class="box">' +
          '<input id="am-floor" inputmode="numeric" value="' + esc(a.floor) + '"></div></div>' +
        '<div class="fl"><label>Landmark</label><div class="box">' +
          '<input id="am-landmark" value="' + esc(a.landmark) + '"></div></div>' +
      '</div>' +
      gates + vehicleRow + gstRow +
      '<div class="pnote" style="margin-top:16px"><span>ⓘ</span><span>Please ensure you have drawn ' +
        'the polygon on Atlas and that the central team has completed all mandatory checks.</span></div>' +
    '</div>' +
    '<div class="ap-foot">' +
      '<button class="btn btn-ghost" id="ap-back">Back to list</button>' +
      '<button class="btn btn-ghost" id="ap-save">Save draft</button>' +
      (gateFailed
        ? '<button class="btn btn-primary" id="ap-reject" style="background:var(--err);box-shadow:none">' +
          'Reject infra check →</button>'
        : '<button class="btn btn-primary" id="am-to-design"' + (ready ? '' : ' disabled') +
          '>Continue to carting design →</button>') +
    '</div></div>';

  return '<h2>AM verification · step 1 of 3 · infra check</h2>' +
    '<p class="lede">Infra checklist is full-page and scoped only to facility verification.</p>' +
    '<div class="ap-detail"><div class="dl">' + left + '</div>' +
    '<div class="dr">' + apContext(r) + apSla(r, "AM SLA", "72h SLA from hub code creation") + '</div></div>';
}

/* Page 2 — how the hub maps onto the sorting network. Validate checks every
   code against the network before the design can be sent for alignment. */
function apAmDesignPage(r) {
  var d = r.design;
  var filled = designFilled(d);
  var fmcds = parseCodes(d.fmcds);

  var status = d.approved
    ? '<span class="st green">Design approved</span>'
    : (d.sent ? '<span class="st amber">Awaiting the Design team</span>'
              : (d.validated ? '<span class="st green">Codes validated</span>'
                             : '<span class="st grey">In progress</span>'));

  /* Validate first; only a clean run turns the button into the send action. */
  var cta = d.sent
    ? '<button class="btn btn-primary" id="am-to-rate">Continue to rate card →</button>'
    : (d.validated
        ? '<button class="btn btn-primary" id="am-design-send" data-testid="am-design-send">' +
          'Send Design for Approval →</button>'
        : '<button class="btn btn-primary" id="am-design-validate"' +
          (filled ? '' : ' disabled') + '>Validate</button>');

  var left = '<div class="ap-panel">' +
    '<div class="ph"><div>' +
      '<span class="hubcode">Hub code ' + esc(r.hubCode || "-") + '</span>' +
      '<b>FM Carting Design Input</b>' +
      '<span>Map this hub onto its sorting centre and cross-docks.</span></div>' +
      status + '</div>' +
    '<div class="ap-form">' +
      (d.error
        ? '<div class="notice bad" data-testid="am-design-error"><b>Unknown hub codes</b>' +
          esc(d.error) + '</div>'
        : '') +
      (d.approved
        ? '<div class="notice ok" data-testid="am-design-approved"><b>Design approved by the Design team</b>' +
          (d.note ? esc(d.note) : "The mapping below is aligned.") + '</div>'
        : (d.sent
            ? '<div class="notice info" data-testid="am-design-sent"><b>Sent for alignment</b>' +
              'The Design team reviews the mapping while you carry on to the rate card.</div>'
            : '')) +
      '<div class="grid2">' +
        '<div class="fl"><label>FMSC</label><div class="box">' +
          '<input id="am-fmsc" placeholder="e.g. SSY" value="' + esc(d.fmsc) + '"' +
          (d.sent ? ' disabled' : '') + '></div>' +
          '<div class="hint">Required. The sorting centre this hub carts to.</div></div>' +
        '<div class="fl"><label>FMCDs</label><div class="box">' +
          '<input id="am-fmcds" placeholder="e.g. KRM, HSR" value="' + esc(d.fmcds) + '"' +
          (d.sent ? ' disabled' : '') + '></div>' +
          '<div class="hint">Optional. Comma-separated cross-dock hub codes.</div></div>' +
      '</div>' +
      '<div class="fl" style="max-width:320px"><label>Onboarding Type</label>' +
        '<div class="box sel"><select id="am-onboarding"' + (d.sent ? ' disabled' : '') + '>' +
          '<option value=""' + (d.onboarding ? '' : ' selected') + '>Select onboarding type</option>' +
          ONBOARDING_TYPES.map(function (o) {
            return '<option value="' + o.id + '"' + (d.onboarding === o.id ? ' selected' : '') + '>' +
                   esc(o.label) + '</option>'; }).join("") +
        '</select></div></div>' +
      '<div class="kv" style="margin-top:16px" data-testid="am-design-summary">' +
        '<div class="row"><span class="k">Assigned hub code</span>' +
          '<span class="v">' + esc(r.hubCode || "-") + '</span></div>' +
        '<div class="row"><span class="k">Carts to</span>' +
          '<span class="v">' + esc(parseCodes(d.fmsc)[0] || "-") + '</span></div>' +
        '<div class="row"><span class="k">Cross-docks</span>' +
          '<span class="v">' + (fmcds.length ? esc(fmcds.join(", ")) : "None") + '</span></div>' +
      '</div>' +
      '<div class="pnote" style="margin-top:16px"><span>ⓘ</span><span>Codes known to the ' +
        'network: ' + KNOWN_HUB_CODES.slice(0, 8).join(", ") + '…</span></div>' +
    '</div>' +
    '<div class="ap-foot">' +
      '<button class="btn btn-ghost" id="am-to-infra">← Back to infra check</button>' +
      '<button class="btn btn-ghost" id="ap-save">Save draft</button>' + cta +
    '</div></div>';

  return '<h2>AM verification · step 2 of 3 · FM Carting Design Input</h2>' +
    '<p class="lede">Give the hub its FMSC mapping and cross-docks, then send the design for alignment.</p>' +
    '<div class="ap-detail"><div class="dl">' + left + '</div>' +
    '<div class="dr">' + apContext(r) + apSla(r, "AM SLA", "72h SLA from hub code creation") + '</div></div>';
}

/* Page 3 — hub type and the rate card it sets the ceiling for. */
function apAmRatePage(r) {
  var ready = amRateReady(r);
  var over  = ready && !apWithinThreshold(r);

  var left = '<div class="ap-panel">' +
    '<div class="ph"><div><b>Hub type and rate card</b>' +
      '<span>The hub type sets the ceiling each slab rate is measured against.</span></div>' +
      '<span class="st green">Infra check passed</span></div>' +
    '<div class="ap-form">' +
      (r.revision
        ? '<div class="notice bad" data-testid="am-revision"><b>Sent back by the ' +
          esc(r.revision.by) + '</b>' +
          (r.revision.reason ? esc(r.revision.reason) + ' ' : '') +
          'Revise the hub type or the rate card and submit it again.</div>'
        : '') +
      '<div class="grid2">' +
        '<div class="fl"><label>Hub type</label><div class="box sel">' +
          '<select id="am-category">' +
            '<option value=""' + (r.hubCategory ? '' : ' selected') + '>Select hub type</option>' +
            CATEGORY_ORDER.map(function (c) {
              return '<option value="' + c + '"' + (r.hubCategory === c ? ' selected' : '') + '>' +
                     esc(HUB_CATEGORIES[c].label) + '</option>'; }).join("") +
          '</select></div>' +
          '<div class="hint">Sets the ceiling the rate card is measured against.</div></div>' +
        '<div class="fl"><label>Hub payout type</label><div class="box sel">' +
          '<select id="am-payout">' +
            '<option value="Combined"' + (r.rate.payoutType === "Combined" ? " selected" : "") + '>Combined</option>' +
            '<option value="Split" disabled>Split (not available yet)</option>' +
          '</select></div>' +
          '<div class="hint">Split payouts are not enabled yet.</div></div>' +
      '</div>' +
      slabEditor(r) +
    '</div>' +
    '<div class="ap-foot">' +
      '<button class="btn btn-ghost" id="am-to-design">← Back to carting design</button>' +
      '<button class="btn btn-ghost" id="ap-save">Save draft</button>' +
      '<button class="btn btn-primary" id="ap-approve"' + (ready ? '' : ' disabled') + '>' +
        (over ? 'Raise approval request to CH →' : 'Approve &amp; send to CH →') + '</button>' +
    '</div></div>';

  return '<h2>AM verification · step 3 of 3 · rate card</h2>' +
    '<p class="lede">Set the hub type and the slab-wise rate card for this hub.</p>' +
    '<div class="ap-detail"><div class="dl">' + left + '</div>' +
    '<div class="dr">' + apContext(r) + apSla(r, "AM SLA", "72h SLA from hub code creation") + '</div></div>';
}

/* ------------------------------------------------------ CH · review form */

/* Slab rate card: the slabs come from the central structure for the hub type,
   in steps of 2,500 orders, and the Area Manager prices each one. */
function slabEditor(r) {
  var rc = r.rate, cat = HUB_CATEGORIES[r.hubCategory];
  var rows = (rc.slabs || []).map(function (sl, i) {
    // a slab not priced yet isn't an error — a rate typed wrong is
    var bad = String(sl.rate).trim() !== "" && !slabValid(sl), over = slabOverCeiling(r, sl);
    var ceil = cat ? apSlabCeiling(r, sl) : null;
    return '<div class="slab-row fixed' + (bad ? ' bad' : (over ? ' over' : '')) + '" data-slabrow="' + i + '">' +
      '<div class="sf band"><span class="sl">Slab ' + (i + 1) + '</span>' +
        '<span class="bv">' + esc(bandText(sl)) + '</span></div>' +
      '<div class="sf"><span class="sl">Slab rate (₹ / shipment)</span>' +
        '<input data-slab="' + i + '" data-field="rate" inputmode="decimal" ' +
          'placeholder="' + (ceil == null ? "0.00" : ceil.toFixed(2)) + '" ' +
          'value="' + esc(sl.rate) + '"></div>' +
      '<div class="sf ceil"><span class="sl">Ceiling</span>' +
        '<span class="cv' + (over ? ' over' : '') + '">' +
          (cat ? ceilingCell(r.hubCategory, r.city, sl) : "-") +
          (over ? ' · over' : '') + '</span></div>' +
    '</div>';
  }).join("");

  var complete = rateCardValid(rc);
  var over = !apWithinThreshold(r);
  return '<div class="slabs" data-testid="am-slabs">' +
    '<div class="sh"><div><b>Rate card</b>' +
      '<span>Price each slab. The slabs are set centrally for the hub type in steps of 2,500 orders, ' +
        'each with its own ceiling for the hub type and city. The touchpoint rate is fixed by the hub ' +
        'type.</span></div>' +
      '<span class="st ' + (!complete ? "grey" : (over ? "amber" : "green")) + '" ' +
        'id="am-rate-status">' +
        (!complete ? "Incomplete" : (over ? "Above ceiling" : "Within ceiling")) + '</span></div>' +
    (!cat
      ? '<div class="hint err" style="padding-bottom:8px">Select a hub type first. It sets ' +
        'the slab ceilings and the touchpoint rate.</div>'
      : '') +
    rows +
    '<div class="slab-tp" data-testid="am-tp">' +
      '<div class="sf" style="max-width:232px">' +
        '<span class="sl">Touchpoint rate (₹ / touchpoint)</span>' +
        '<span class="bv" id="am-touchpoint" data-testid="am-tp-fixed">' +
          (cat ? "₹" + esc(fixedTp(r.hubCategory, r.city)) : "-") + '</span></div>' +
      '<span class="tph">Paid per touchpoint, on top of the slab rate. Fixed for ' +
        (cat ? esc(cat.label) + ' hubs' : 'each hub type') + ', and isn’t priced per hub.</span></div>' +
    '<div class="hint err" style="padding-top:8px" id="am-rate-incomplete"' +
      (complete ? ' hidden' : '') + '>' +
      'Every slab needs a rate.</div>' +
    '<div class="notice warn" style="margin:12px 0 0" data-testid="am-over-ceiling" ' +
      'id="am-over-ceiling"' + (complete && over ? '' : ' hidden') + '>' +
      '<b>Above the ceiling for this hub type</b>' +
      '<span id="am-over-ceiling-text">' + esc(apOverageText(r)) + '</span>' +
      ' You can still submit it, but it goes to the Cluster Head as an ' +
      'approval request rather than straight through.</div>' +
  '</div>';
}

/* The rate card as set by the Area Manager, read-only downstream. */
function apRateCardRows(r) {
  var cat = HUB_CATEGORIES[r.hubCategory];
  return (r.rate.slabs || []).map(function (sl) {
    var over = slabOverCeiling(r, sl);
    return '<div class="row"><span class="k">' + esc(slabLabel(sl)) + '</span>' +
      '<span class="v' + (over ? '' : ' ok') + '">₹' + esc(sl.rate) + ' / shipment' +
      (over ? ' · above ceiling' : '') +
      (cat ? ' <span class="mute">· ceiling ' + esc(ceilingCell(r.hubCategory, r.city, sl)) + '</span>' : '') +
      '</span></div>';
  }).join("") +
  '<div class="row"><span class="k">Touchpoint rate</span>' +
    '<span class="v' + (r.rate.touchpoint ? ' ok' : '') + '">₹' + esc(r.rate.touchpoint || "-") + ' / touchpoint' +
    (cat ? ' <span class="mute">· fixed for ' + esc(cat.label) + '</span>' : '') + '</span></div>' +
  '<div class="row"><span class="k">Slab ceilings (' + esc(cat ? cat.label : "-") + ', ' +
    esc(cityKey(r.city) || "-") + ')</span>' +
    '<span class="v">' + esc(cat ? ceilingText(r.hubCategory, r.city) : "-") + '</span></div>';
}

function apChDetail(r) {
  var c = r.ch;
  var sel2 = function (id, val, opts) {
    return '<div class="box sel"><select id="' + id + '">' + opts.map(function (o) {
      return '<option' + (val === o ? ' selected' : '') + '>' + o + '</option>'; }).join("") + '</select></div>';
  };
  var stars = [1,2,3,4,5].map(function (n) {
    return '<button data-rating="' + n + '"' + (c.rating === n ? ' class="on"' : '') + '>' + n + '</button>';
  }).join("");

function viewAdmin() {

  if (a.hubView && allHubById(a.hubView)) return apShell(apHubView(allHubById(a.hubView)));
  if (a.selected) {
    var r = apById(a.selected);

         it. Everyone else — the Zonal Head always — gets the read-only status
         view, so nobody can act outside their own stage. */
